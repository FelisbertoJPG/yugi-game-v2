 */
function activeHand() {
  if (dragging) return dragging.h;
  return selectedHand;
}

/** As zonas que aceitam esta carta, respeitando o tipo. */
function dropTargets(h) {
  if (h == null) return { m: false, s: false, f: false };
  const acts = actionsFor(h);
  if (!acts.length) return { m: false, s: false, f: false };
  const kind = cardKind(hand[0][h]);
  const podeMonstro = acts.some((a) => a.action === 'summon' || a.action === 'setmonster');
  const podeMagia = acts.some((a) => a.action === 'activate' || a.action === 'setspell');
  return {
    m: kind === 'm' && podeMonstro,
    s: kind === 's' && podeMagia,
    f: kind === 'f' && podeMagia,
  };
}

function startDrag(h, el) {
  dragging = { h, code: hand[0][h], kind: cardKind(hand[0][h]) };
  el.classList.add('dragging');

  // NÃO chamar render() aqui: ele reconstrói a mão e destruiria justamente o
  // elemento que está sendo arrastado, o que faz o navegador cancelar o arrasto.
  // Só o campo precisa ser redesenhado (para acender as zonas válidas), e ainda
  // assim num setTimeout, já com o arrasto iniciado.
  setTimeout(() => {
    if (dragging) $('you-field').replaceChildren(fieldRows(0, true));
  }, 0);
}

function endDrag() {
  dragging = null;
  document.querySelectorAll('.zone.over').forEach((z) => z.classList.remove('over'));
  render();
}

/**
 * Escolheu a zona (soltando ou clicando): guarda o destino e pergunta a posição.
 * `tributoSeq` vem preenchido quando a carta foi solta SOBRE um monstro — nesse
 * caso o gesto também diz qual monstro tributar.
 */
function dropOn(type, index, tributoSeq = null) {
  const h = activeHand();
  if (h == null) return;
  // A zona de campo é, para o motor, a sequência 5 do grupo de magia.
  pendingZone = { type: type === 'f' ? 's' : type, index: type === 'f' ? 5 : index };
  pendingTribute = tributoSeq;
  const acts = actionsFor(h);
  dragging = null;
  selectedHand = null;
  abrirPopupPosicao(h, acts, type, index);
}

/**
 * Popup de posição/ação. Para monstro são [Posição de Ataque] e [Setar]; para
 * magia/armadilha, [Utilizar] e [Setar] — a mesma escolha, outro vocabulário.
 *
 * `type`/`index` são a zona de destino — vêm preenchidos quando a carta foi
 * ARRASTADA até lá (`dropOn`), e ficam `null` quando a carta só foi CLICADA
 * (`toggleSelect`): aí ainda não existe zona nenhuma escolhida, e uma ação que
 * precise de uma (Invocar/Setar) vai gerar a pergunta SELECT_PLACE do motor
 * normalmente depois — as zonas válidas acendem na tela do mesmo jeito que já
 * acendiam antes deste popup existir. "Utilizar" nunca precisou de zona pra
 * ignição de efeito (Thunder Dragon, Rei do Pântano etc.), então esses casos
 * já resolvem direto.
 */
function abrirPopupPosicao(h, acts, type = null, index = null) {
  const code = hand[0][h];
  const LABEL = {
    summon: 'Posição de Ataque',
    setmonster: 'Setar (defesa, virada)',
    activate: 'Utilizar',
    setspell: 'Setar (virada)',
  };
  const zonaTxt = type === 'f' ? 'Zona de Campo'
    : type === 'm' ? `Zona de Monstro ${index + 1}`
    : type === 's' ? `Zona de Magia/Armadilha ${index + 1}`
    : null;

  $('pos-art').src = ART(code);
  $('pos-name').textContent = nameOf(code);
  $('pos-where').textContent = zonaTxt ? `→ ${zonaTxt}` : 'escolha o que fazer';

  const frag = document.createDocumentFragment();
  for (const a of acts) {
    const b = document.createElement('button');
    b.className = a.action === 'summon' || a.action === 'activate' ? 'btn-primary' : '';
    b.textContent = LABEL[a.action] ?? a.label;
    b.onclick = () => {
      selectedHand = null;
      fecharPopupPosicao();
      act(a.action, a.arg, `${LABEL[a.action] ?? a.label} ${nameOf(code)}` + (zonaTxt ? ` em ${zonaTxt}` : ''));
    };
    frag.append(b);
  }
  const x = document.createElement('button');
  x.textContent = 'cancelar';
  x.onclick = () => { selectedHand = null; pendingZone = null; fecharPopupPosicao(); render(); };
  frag.append(x);

  $('pos-acts').replaceChildren(frag);
  $('pos-overlay').hidden = false;
}

function fecharPopupPosicao() { $('pos-overlay').hidden = true; }

/**
 * Pergunta de POSIÇÃO (SELECT_POSITION): Invocação-Ritual e demais Invocações
 * Especiais deixam escolher entre ataque e defesa — as duas com a FACE PARA
 * CIMA. Não confunda com Set: setar é virar a carta, e é outra jogada.
 *
 * A máscara vem do motor (0x1 ataque, 0x4 defesa aberta); só desenhamos o que
 * ele aceita, em vez de oferecer uma opção que seria recusada.
 */
function abrirPopupPosicaoEspecial(q) {
  const code = q.askCode;
  const opcoes = [];
  if (q.posMask & 0x1) opcoes.push({ pos: 0x1, label: 'Posição de Ataque', primaria: true });
  if (q.posMask & 0x4) opcoes.push({ pos: 0x4, label: 'Posição de Defesa', primaria: false });
  // Máscara sem nada reconhecível: responde ataque para não travar o duelo.
  if (!opcoes.length) { act('position', 0x1, 'posição (ataque)'); return; }

  $('pos-art').src = ART(code);
  $('pos-name').textContent = nameOf(code);
  $('pos-where').textContent = '→ escolha a posição';

  const frag = document.createDocumentFragment();
  for (const o of opcoes) {
    const b = document.createElement('button');
    b.className = o.primaria ? 'btn-primary' : '';
    b.textContent = o.label;
    b.onclick = () => {
      fecharPopupPosicao();
      act('position', o.pos, `${nameOf(code)} em ${o.label.toLowerCase()}`);
    };
    frag.append(b);
  }
  // Sem "cancelar": o motor está esperando uma posição, e recusar trava o duelo.
  $('pos-acts').replaceChildren(frag);
  $('pos-overlay').hidden = false;
}

function render() {
  SELECIONAVEIS = selecionaveisNoCampo();
  if (question && question.kind === 'position' && question.player === 0) {
    abrirPopupPosicaoEspecial(question);
  }
  $('turn').textContent = turn === 0 ? 'VOCÊ' : 'oponente';
  $('opp-field').replaceChildren(fieldRows(1, false));
  $('you-field').replaceChildren(fieldRows(0, true));

  // LP + fases na barra central
  const lpEl = (p) => {
    const s = document.createElement('span'); s.className = 'lp';
    s.innerHTML = `<b style="color:${p === 0 ? 'var(--blue)' : 'var(--red)'}">${p === 0 ? 'VOCÊ' : 'OPP'}</b> ${lp[p]}`;
    return s;
  };
  const midPhases = document.createElement('div');
  midPhases.className = 'mid-phases';
  const agora = document.createElement('span');
  agora.className = 'phase-now' + (turn === 0 ? '' : ' opp');
  agora.textContent = PHASE_NOME[phase] ?? `Fase ${phase}`;
  midPhases.append(agora);
  $('mid').replaceChildren(lpEl(1), midPhases, lpEl(0));

  // mão do oponente (verso)
  const oh = document.createElement('div'); oh.style.display='contents';
  $('hand-opp').replaceChildren(...Array.from({length: hand[1]}, (_, i) => {
    const c=document.createElement('div'); c.className='card'; c.dataset.anchor='1:hand:'+i; c.innerHTML='<div class="back"></div>'; scaleCard(c, 1); return c;
  }));

  // sua mão (selecionável quando há ação disponível)
  rebuildMaps();
  if (selectedHand != null && actionsFor(selectedHand).length === 0) selectedHand = null;
  $('hand-you').replaceChildren(...hand[0].map((code, h) => {
    const c = document.createElement('div'); c.className = 'card'; c.dataset.anchor = '0:hand:' + h;
    c.innerHTML = `<img src="${ART(code)}" title="${nameOf(code)}\nsegurar: ver detalhes" alt="" draggable="false">`;
    scaleCard(c, 0);

    // Segurar abre os detalhes — vale para toda carta da mão, jogável ou não.
    const segurou = wireLongPress(c, HOLD_MS, () => showCardDetail(code));
    c.oncontextmenu = (e) => { e.preventDefault(); showCardDetail(code); };

    if (actionsFor(h).length) {
      c.classList.add('playable', 'draggable');
      c.onclick = () => { if (segurou()) return; toggleSelect(h); };
      // Arrastar é o caminho novo; o clique continua funcionando para quem
      // preferir a barra de ações.
      c.draggable = true;
      c.addEventListener('dragstart', (e) => {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(code));  // exigido pelo Firefox
        startDrag(h, c);
      });
      c.addEventListener('dragend', endDrag);
    }
    if (h === selectedHand) c.classList.add('selected');
    if (dragging && dragging.h === h) c.classList.add('dragging');
    c.oncontextmenu = (e) => e.preventDefault();
    return c;
  }));

  const yourIdle = question && question.kind === 'idle' && question.player === 0;
  const yourPlace = question && question.kind === 'place' && question.player === 0;
  $('btn-end').disabled = !(yourIdle && question.canEnd) || ended;

  // barra de ação (quando há carta selecionada) ou prompt normal
  const bar = $('prompt-bar');
  if (selectedField) {
    const div = document.createElement('div'); div.className = 'actbar';
    div.append(Object.assign(document.createElement('b'), { textContent: nameOf(selectedField.code) + ':' }));
    for (const a of selectedField.opts) {
      const b = document.createElement('button');
      b.textContent = a.label;
      b.onclick = () => { const s = selectedField; selectedField = null; act(a.action, a.arg, `${a.label} ${nameOf(s.code)}`); };
      div.append(b);
    }
    const x = document.createElement('button'); x.textContent = 'cancelar';
    x.onclick = () => { selectedField = null; render(); };
    div.append(x);
    bar.replaceChildren(div);
  } else {
    // selectedHand != null cai aqui também: o popup de ação (abrirPopupPosicao)
    // já cobre a tela pra esse caso, então não tem barra própria pra ele.
    const unsupported = question && question.kind === 'unsupported';
    if (unsupported) warn(`O motor pediu uma ação que o treino ainda não suporta (msg ${question.rawType}). Dê "novo duelo".`);
    bar.replaceChildren(Object.assign(document.createElement('span'), {
      className: 'prompt',
      textContent: ended ? 'duelo encerrado.'
        : unsupported ? `⚠ ação não suportada ainda (msg ${question.rawType}) — comece um novo duelo.`
        : yourPlace ? `Escolha uma zona ${question.zoneType === 's' ? 'de magia/armadilha' : 'de monstro'} livre (destacada).`
        : dragging ? 'Solte a carta numa zona verde.'
        : yourIdle ? 'Sua vez: clique numa carta pra escolher o que fazer, ou arraste até a zona.'
        : 'aguarde…'
    }));
  }
}

/**
 * Botões de fase, no centro do tabuleiro.
 *
 * O motor não tem um "próxima fase" genérico: da Main 1 dá para ir à Battle
 * (idle 6) ou à End Phase (idle 7); dentro da Battle dá para ir à Main 2
 * (battle 2) ou à End Phase (battle 3). O botão traduz isso para o que faz
 * sentido no momento, e desliga quando o motor não permite.
 */
/**
 * Caixa dos botões de fase, ao lado do Deck. É uma zona de UI (`acts`) como a
 * `mid`: não existe pro `ocgcore` — nenhuma carta "mora" ali —, mas é
 * posicionável no editor de campo igual às outras.
 */
function phaseActsEl() {
  const d = document.createElement('div');
  d.className = 'phase-acts';
  d.append(...botoesDeFase());
  // Sem tabuleiro ativo isto não faz nada e o flexbox resolve; com tabuleiro,
  // a zona `acts` manda — o backfill de `loadActiveBoard` garante que ela
  // sempre existe, então não há caso "sem posição" pra adivinhar.
  applyZonePosition(d, 'acts');
  return d;
}

function botoesDeFase() {
  const meu = question && question.player === 0 && !ended;
  const idle = meu && question.kind === 'idle';
  const batalha = meu && question.kind === 'battle';

  let proxima = null;
  if (idle && question.canBattle) proxima = { rotulo: '▶ Battle Phase', acao: 'battle' };
  else if (idle && question.canEnd) proxima = { rotulo: '▶ End Phase', acao: 'endturn' };
  else if (batalha && question.canMain2) proxima = { rotulo: '▶ Main Phase 2', acao: 'tomain2' };

  const b1 = document.createElement('button');
  b1.textContent = proxima ? proxima.rotulo : '▶ próxima fase';
  b1.disabled = !proxima;
  b1.title = 'avança para a próxima fase';
  if (proxima) b1.onclick = () => act(proxima.acao, 0, proxima.rotulo);

  const b2 = document.createElement('button');
  b2.textContent = '⏭ End Phase';
  b2.title = 'pula direto para a End Phase';
  b2.disabled = !(idle ? question.canEnd : batalha);
  b2.onclick = () => act(batalha ? 'endbattle' : 'endturn', 0, 'End Phase');

  return [b1, b2];
}

function pileEl(player, label, cards) {
  const d = document.createElement('div');
  d.className = 'pilezone' + (cards.length ? ' has' : '');
  d.dataset.anchor = player + ':gy';
  d.innerHTML = `<span class="n">${cards.length}</span>${label}`;
  if (cards.length) d.onclick = () => openGrave(player);
  applyZonePosition(d, `p${player}:gy`);
  return d;
}

/** Pilha do deck: quantas cartas ainda restam para comprar. */
function deckEl(player) {
  const n = deckCount[player];
  const d = document.createElement('div');
  d.className = 'pilezone';
  d.dataset.anchor = player + ':deck';
  d.title = `Deck de ${player === 0 ? 'você' : 'oponente'}: ${n} carta(s)`;
  if (n > 0) {
    d.style.borderStyle = 'solid';
    d.style.borderColor = '#6b4a1e';
    d.innerHTML = `<span class="n">${n}</span>DECK`;
  } else {
    d.innerHTML = `<span class="n" style="color:var(--red)">0</span>DECK`;
  }
  applyZonePosition(d, `p${player}:deck`);
  return d;
}

/**
 * Pilha do Extra Deck (Fusão/Sincro/Xyz). Fica destacada e clicável quando o
 * motor está oferecendo Invocação Especial AGORA (`question.spSummonable`) —
 * é a mesma ideia da mão ficar com botões: aqui quem oferece a ação é a
 * pilha, porque a carta não está visível em lugar nenhum antes de invocada.
 */
function extraEl(player, isYou) {
  const n = extraCount[player];
  const d = document.createElement('div');
  d.className = 'pilezone';
  d.dataset.anchor = player + ':extra';
  const disponiveis = (isYou && question && question.kind === 'idle' && question.player === 0)
    ? (question.spSummonable || []).filter((a) => a.controller === player)
    : [];
  d.title = `Extra Deck de ${player === 0 ? 'você' : 'oponente'}: ${n} carta(s)`
    + (disponiveis.length ? ` — ${disponiveis.length} pronta(s) para Invocação Especial` : '');
  if (n > 0) {
    d.style.borderStyle = 'solid';
    d.style.borderColor = '#6b4a1e';
    d.innerHTML = `<span class="n">${n}</span>EXTRA`;
  } else {
    d.innerHTML = `<span class="n" style="color:var(--red)">0</span>EXTRA`;
  }
  if (disponiveis.length) {
    d.classList.add('has');
    d.style.borderColor = 'var(--gold)';
    d.onclick = () => {
      extraPicker = (extraPicker ? null : { acts: disponiveis });
      render(); renderSelection();
    };
  }
  applyZonePosition(d, `p${player}:extra`);
  return d;
}

function openGrave(player) {
  const cards = field[player].g;
  $('gv-title').textContent = `Cemitério — ${player === 0 ? 'você' : 'oponente'} (${cards.length} cartas)`;
  $('gv-grid').replaceChildren(...cards.map((code) => {
    const t = document.createElement('div'); t.className = 'thumb'; t.title = nameOf(code);
    t.innerHTML = `<img src="${ART(code)}" alt="">`; return t;
  }));
  $('gv-back').classList.add('show');
}

function populateDecks() {
  const decks = listDecks();
  const sel = $('deck-sel');
  sel.replaceChildren(...decks.map((d, i) => new Option(`${d.name} (${d.main.length})`, String(i))));
  if (!decks.length) sel.append(new Option('(nenhum deck salvo)', ''));
  const active = getActiveIndex();
  sel.value = (active != null && decks[active]) ? String(active) : (decks.length ? '0' : '');
}

function conn(ok){ $('dot').classList.toggle('on', ok); $('conn').textContent = ok?'conectado':'desconectado'; }
function warn(m){ $('warn').hidden=false; $('warn').textContent=m; }
// qualquer erro de JS agora aparece na barra vermelha (nunca mais trava em silêncio)
window.addEventListener('error', (e) => warn('ERRO JS: ' + e.message + ' @ linha ' + e.lineno));
window.addEventListener('unhandledrejection', (e) => warn('ERRO async: ' + ((e.reason && e.reason.message) || e.reason)));

/**
 * Recompensa do modo Adversário: só se for adversário (tem `advNpc`), se venceu,
 * e uma vez por duelo. Dá +100 DP e a carta-assinatura do NPC na Coleção.
 */
async function concederRecompensa(venci) {
  if (!advNpc || !venci || rewardGiven || !dueloId) return null;
  rewardGiven = true;

  // O QUANTO e QUAL carta saem do servidor, a partir do registro do NPC —
  // `advReward`/`advSignature` continuam existindo só para a tela poder
  // antecipar o texto. Enquanto o crédito era feito aqui, o valor vinha do
  // objeto carregado no navegador: o jogador escolhia o próprio prêmio.
  //
  // O `dueloId` é o que autoriza: cada duelo registrado paga uma vez só.
  const r = await premiarVitoria(dueloId);
  if (!r.ok) return null;
  return { dp: r.premio, cardId: r.carta };
}

/** Popup de fim de duelo: quem venceu + recompensa + botão para voltar à home. */
function mostrarFimDuelo(venci, empate, premio) {
  const box = document.querySelector('#end-overlay .end-box');
  box.classList.toggle('lose', !venci && !empate);
  $('end-emoji').textContent = empate ? '🤝' : venci ? '🏆' : '💀';
  $('end-title').textContent = empate ? 'Duelo empatado' : venci ? 'Você venceu!' : 'Você perdeu';
  let sub = `LP — você ${Math.max(0, lp[0])} · oponente ${Math.max(0, lp[1])}`;
  if (premio) {
    const carta = premio.cardId ? (nameOf(premio.cardId)) : null;
    sub += `<br><b style="color:var(--gold)">+${premio.dp} DP</b>`
         + (carta ? ` e <b style="color:var(--gold)">${carta}</b> na Coleção!` : '');
  }
  $('end-sub').innerHTML = sub;
  $('end-overlay').hidden = false;
}
function fecharFimDuelo() { $('end-overlay').hidden = true; }

$('btn-start').onclick = start;
$('btn-end').onclick = () => act('endturn', 0, 'encerrar turno');
$('btn-home').onclick = () => (location.href = '/web/index.html');
$('chain-pass').onclick = () => { $('chain-overlay').hidden = true; act('chain', -1, 'não ativar'); };
$('end-home').onclick = () => (location.href = '/web/index.html');
$('end-again').onclick = () => { fecharFimDuelo(); start(); };
$('deck-sel').onchange = start;                 // trocar de deck começa novo duelo
$('gv-close').onclick = () => $('gv-back').classList.remove('show');
$('gv-back').addEventListener('click', (e) => { if (e.target === $('gv-back')) $('gv-back').classList.remove('show'); });
$('log-fab').onclick = () => $('log').classList.toggle('show');

await hydrateWallet();   // carteira do projeto antes de premiar vitórias
await hydrateDecks();    // o deck com que você vai duelar vem de decks/player/
await hydrateCustomNpcs();
// Um adversário criado noutra máquina só existe no disco: refaz a busca agora
// que o hydrate sincronizou (a busca lá em cima rodou antes de qualquer await).
if (advId && !advNpc) advNpc = getNpc(advId);

// Modo Adversário: carrega o deck e a assinatura do NPC antes do 1º duelo.
if (advNpc) {
  const h1 = document.querySelector('.topbar h1');
  if (h1) h1.textContent = `▚ ADVERSÁRIO — vs ${advNpc.name}`;
  try {
    await loadNpcDecks();
    const active = getNpcActiveDeck(advId);
    advDeck = active?.deck?.main?.length ? active.deck.main : null;
    advExtra = active?.deck?.extra?.length ? active.deck.extra : null;
    advSignature = active?.signatureId ?? advNpc.signatureId;
    advReward = Number.isFinite(Number(active?.rewardDp)) ? Number(active.rewardDp) : WIN_REWARD;
  } catch { advSignature = advNpc.signatureId; }
}

await loadActiveBoard();   // antes do 1º render, senão pisca do padrão pro customizado
populateDecks();
start();
</script>
