<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Área de Teste — Classic Duels</title>
<link rel="icon" href="/web/img/icone.png">
<link rel="stylesheet" href="/web/css/ui.css">
<style>
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 0%, #2a2033 0%, var(--bg) 60%);
  }
  .home { width: min(760px, 94vw); }
  .title { text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--line); padding-bottom: 14px; }
  .title h1 { margin: 0; font-size: 24px; letter-spacing: 4px; color: #c9a6e0; }
  .title p { margin: 6px 0 0; color: var(--dim); font-size: 11px; letter-spacing: 1px; }
  .menu { display: grid; gap: 9px; }
  .menu button {
    text-align: left; padding: 13px 16px; font-size: 14px;
    background: var(--panel); border: 2px solid var(--line);
    display: flex; align-items: baseline; gap: 12px;
  }
  .menu button:hover { background: var(--panel2); }
  .menu .k { color: #c9a6e0; font-weight: bold; min-width: 18px; }
  .menu .why { margin-left: auto; font-size: 10px; color: var(--dim); }
  .back { margin-top: 16px; }
  /* Decks no banco (admin) */
  .banco { background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; margin-bottom: 16px; }
  .banco h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: 2px; color: #c9a6e0; }
  .banco .linha { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 12px; }
  .banco .linha:first-child { border-top: 0; }
  .banco .qtd { color: var(--dim); font-size: 10px; }
  .banco button { font-size: 10px; padding: 3px 8px; }
</style>
</head>
<body>
<div class="home">
  <div class="title">
    <h1>⚙ ÁREA DE TESTE</h1>
    <p>ferramentas de desenvolvimento — fora do fluxo do jogador</p>
  </div>

  <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;
              background:var(--panel); border:1px solid var(--line); padding:10px 14px">
    <span>Seu saldo: <b id="dp" style="color:var(--gold)">— DP</b></span>
    <span style="flex:1"></span>
    <!-- O "+ Adicionar DP" voltou, mas agora quem credita é o SERVIDOR
         (`creditar_dp`, migration 0022) e só para admin. O botão do cliente
         que a migration 0004 tirou não tinha efeito nenhum; este tem, porque a
         conta é feita lá. Some para quem não é admin — botão que só dá erro é
         pior que botão nenhum. -->
    <span id="admin-dp" hidden style="display:flex; align-items:center; gap:6px">
      <input type="number" id="dp-valor" value="5000" step="500"
             style="width:92px; background:var(--bg2); color:var(--ink);
                    border:1px solid var(--line); font-size:12px; padding:3px 6px">
      <button id="btn-dp" class="btn-primary" style="font-size:11px">+ creditar DP</button>
    </span>
    <span id="dp-nota" style="font-size:10px; color:var(--dim)">DP só pela Loja e por vencer Adversários</span>
  </div>

  <!-- Decks NO BANCO desta conta. Não é a lista do Deck Builder (aquela vem
       do localStorage hidratado): é o que está gravado em `decks_jogador`,
       que é o que vale no Multiplayer e em outra máquina. Ver as duas lado a
       lado é justamente o ponto — quando discordam, é aqui que se vê. -->
  <div class="banco" id="admin-decks" hidden>
    <h2>DECKS NO BANCO <span style="color:var(--dim); letter-spacing:0">(esta conta)</span></h2>
    <div id="decks-lista"></div>
    <div style="display:flex; align-items:center; gap:8px; margin-top:8px">
      <span id="decks-nota" style="font-size:10px; color:var(--dim)">carregando…</span>
      <span style="flex:1"></span>
      <button id="btn-decks-recarregar">recarregar</button>
    </div>
  </div>

  <div class="menu">
    <button id="btn-deck">
      <span class="k">1</span>
      <span>Deck Builder (todas as cartas)</span>
      <span class="why">sem limite de Coleção</span>
    </button>
    <button id="btn-booster">
      <span class="k">2</span>
      <span>Booster Builder</span>
      <span class="why">montar boosters e pôr na Loja</span>
    </button>
    <button id="btn-estrutural">
      <span class="k">2</span>
      <span>Deck Estrutural</span>
      <span class="why">deck pronto na Loja — o jogador compra e já joga</span>
    </button>
    <button id="btn-npcs">
      <span class="k">3</span>
      <span>Adversários (NPCs) — editor</span>
      <span class="why">montar os decks dos NPCs</span>
    </button>
    <button id="btn-train">
      <span class="k">4</span>
      <span>Treino de duelo</span>
      <span class="why">testar a mecânica · exige o duel-server</span>
    </button>
    <button id="btn-cards">
      <span class="k">5</span>
      <span>Navegador de cartas</span>
      <span class="why">banco completo</span>
    </button>
    <button id="btn-campo">
      <span class="k">6</span>
      <span>Editor de Campo</span>
      <span class="why">desenhar layouts de tabuleiro</span>
    </button>
    <button id="btn-banlist">
      <span class="k">7</span>
      <span>Banlist</span>
      <span class="why">pontos e grupos de cópias por cima da Lista 1</span>
    </button>
    <button id="btn-listas">
      <span class="k">8</span>
      <span>Listas de cartas</span>
      <span class="why">o pool permitido — a Lista 1 e as que vierem</span>
    </button>
    <button id="btn-icones">
      <span class="k">·</span>
      <span>Ícones de perfil</span>
      <span class="why">o catálogo de avatares · a arte mora no repositório</span>
    </button>
    <button id="btn-mundo">
      <span class="k">9</span>
      <span>Mundo andável (mapa mundi)</span>
      <span class="why">em standby · fora do fluxo do jogador, que usa a Trilha de Duelos</span>
    </button>
    <button id="btn-ordenar">
      <span class="k">T</span>
      <span>Ordenar Trilha</span>
      <span class="why">quem libera quem na Trilha de Duelos · por campanha, publicado por id</span>
    </button>
    <button id="btn-adv-grade">
      <span class="k">0</span>
      <span>Adversários em grade (tela antiga)</span>
      <span class="why">aposentada pela Trilha de Duelos · sem trilha e sem cadeado, útil para testar um duelo direto</span>
    </button>
  </div>

  <button class="back" id="btn-home">← voltar para a home</button>
</div>

<script type="module">
import { getDP, hydrateWallet, creditarDP } from '/web/js/wallet.js';
import { perfilAtual } from '/web/js/supabase.js';
import { listarDecksNoBanco, apagarDeckNoBanco, playerDeckPath } from '/web/js/projectdecks.js';
import { esquecerDeckLocal } from '/web/js/storage.js';
const $ = (id) => document.getElementById(id);

await hydrateWallet();
const renderDP = () => { $('dp').textContent = `${getDP()} DP`; };
renderDP();

// O controle de DP é só do admin. A trava de verdade é a RLS no servidor; isto
// aqui é só não mostrar um botão que ia recusar.
const perfil = await perfilAtual().catch(() => null);
if (perfil?.admin) {
  $('admin-dp').hidden = false;
  $('admin-decks').hidden = false;
  $('btn-decks-recarregar').onclick = () => renderDecksDoBanco();
  renderDecksDoBanco();
  $('dp-nota').textContent = `admin (${perfil.usuario ?? ''}) — pode creditar direto`;
  $('btn-dp').onclick = async () => {
    const valor = Number($('dp-valor').value);
    if (!valor) return void ($('dp-nota').textContent = 'informe um valor diferente de zero');
    $('btn-dp').disabled = true;
    const r = await creditarDP(valor);
    $('btn-dp').disabled = false;
    renderDP();
    $('dp-nota').textContent = r.ok
      ? `${r.antes} → ${r.depois} DP`
      : `não creditou: ${r.error}`;
  };
}

// ------------------------------------------------------------ decks no banco
//
// Apagar aqui chama `apagar_deck`, que filtra por `usuario_id = auth.uid()`:
// nem sendo admin dá para apagar o deck de outra pessoa. Por isso a lista é
// sempre "esta conta", nunca "todas".
async function renderDecksDoBanco() {
  const alvo = $('decks-lista');
  const nota = $('decks-nota');
  nota.textContent = 'carregando…';
  const r = await listarDecksNoBanco();
  if (!r.ok) {
    alvo.replaceChildren();
    nota.textContent = `não consegui ler: ${r.error ?? 'erro'}`;
    return;
  }
  if (!r.decks.length) {
    alvo.replaceChildren();
    nota.textContent = 'nenhum deck no banco — salve um pelo Deck Builder';
    return;
  }

  const frag = document.createDocumentFragment();
  for (const d of r.decks) {
    const linha = document.createElement('div');
    linha.className = 'linha';

    const nome = document.createElement('b');
    nome.textContent = d.nome;
    const qtd = document.createElement('span');
    qtd.className = 'qtd';
    qtd.textContent = `main ${d.main} · extra ${d.extra}`;
    const espaco = document.createElement('span');
    espaco.style.flex = '1';

    const btn = document.createElement('button');
    btn.textContent = 'excluir';
    btn.onclick = async () => {
      if (!confirm(`Apagar "${d.nome}" do banco? Isto não tem volta.`)) return;
      btn.disabled = true;
      const x = await apagarDeckNoBanco(d.nome);
      // A cópia de trabalho deste navegador também some, senão o Deck Builder
      // continuaria mostrando um deck que já não existe no banco.
      if (x.ok) esquecerDeckLocal(playerDeckPath(d.nome));
      // Redesenha ANTES de escrever o recado: o redesenho reescreve a nota
      // com a contagem, e na ordem inversa o "apagado" some sem ninguem ler.
      await renderDecksDoBanco();
      nota.textContent = x.ok ? `"${d.nome}" apagado` : `não apagou: ${x.error}`;
    };

    linha.append(nome, qtd, espaco, btn);
    frag.append(linha);
  }
  alvo.replaceChildren(frag);
  nota.textContent = `${r.decks.length} deck(s) — o que vale no Multiplayer e em outra máquina`;
}

$('btn-deck').onclick = () => (location.href = '/web/deck.html');
$('btn-booster').onclick = () => (location.href = '/web/booster.html');
$('btn-estrutural').onclick = () => (location.href = '/web/estrutural.html');
$('btn-npcs').onclick = () => (location.href = '/web/npcs.html');
$('btn-train').onclick = () => (location.href = '/web/duel.html');
$('btn-cards').onclick = () => (location.href = '/ygo-data/examples/web-demo.html');
$('btn-campo').onclick = () => (location.href = '/web/campo.html');
$('btn-banlist').onclick = () => (location.href = '/web/banlist.html');
$('btn-listas').onclick = () => (location.href = '/web/listas.html');
$('btn-icones').onclick = () => (location.href = '/web/icones.html');
$('btn-mundo').onclick = () => (location.href = '/web/mundo.html');
$('btn-ordenar').onclick = () => (location.href = '/web/ordenar.html');
$('btn-adv-grade').onclick = () => (location.href = '/web/adversario.html');
$('btn-home').onclick = () => (location.href = '/web/index.html');
document.addEventListener('keydown', (e) => {
  if (e.key === '1') $('btn-deck').click();
  if (e.key === '2') $('btn-booster').click();
  if (e.key === '3') $('btn-npcs').click();
  if (e.key === '4') $('btn-train').click();
  if (e.key === '5') $('btn-cards').click();
  if (e.key === '6') $('btn-campo').click();
  if (e.key === '7') $('btn-banlist').click();
  if (e.key === '8') $('btn-listas').click();
  if (e.key === '9') $('btn-mundo').click();
  if (e.key === 'Escape') $('btn-home').click();
});
</script>
</body>
</html>
