<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck Builder — Duel Academy</title>
<link rel="stylesheet" href="/web/css/ui.css">
<style>
  body { display: flex; flex-direction: column; overflow: hidden; }

  .topbar input.deck-name {
    width: 200px; background: var(--bg2); color: var(--gold);
    border: 1px solid var(--line); font-size: 13px;
  }

  /* ---------- duas colunas: deck | pool ---------- */
  .workspace {
    flex: 1; display: grid; grid-template-columns: minmax(360px, 42%) 1fr;
    gap: 0; min-height: 0;
  }
  .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .col.deck { border-right: 2px solid var(--line); background: var(--bg2); }

  .sec-head {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 12px; background: var(--panel);
    border-bottom: 1px solid var(--line);
    font-size: 11px; letter-spacing: 1px; color: var(--dim);
  }
  .sec-head .n { color: var(--ink); }
  .sec-head .n.bad { color: var(--red); }
  .sec-head .n.good { color: var(--green); }
  .sec-head .spacer { flex: 1; }

  .deck-scroll { flex: 1; overflow-y: auto; padding: 8px 12px 16px; }
  .deck-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
    gap: 4px;
  }
  .deck-grid.extra { grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); }
  .zone-empty {
    color: var(--dim); font-size: 11px; padding: 14px 4px; font-style: italic;
  }

  /* ---------- pool ---------- */
  .filters {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .filters input, .filters select { padding: 4px 6px; font-size: 11px; }
  .filters input[type="text"] { flex: 1; min-width: 130px; }
  .filters input[type="number"] { width: 62px; }
  .filters select { max-width: 140px; }

  .pool-scroll { flex: 1; overflow-y: auto; padding: 10px 12px 20px; }
  .pool-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    gap: 6px;
  }

  /* ---------- detalhe flutuante ---------- */
  .detail {
    position: fixed; right: 14px; bottom: 14px; width: 300px; z-index: 40;
    background: var(--panel); border: 2px solid var(--gold);
    padding: 10px; display: none; gap: 10px;
    box-shadow: 0 6px 24px #000a;
  }
  .detail.show { display: flex; }
  .detail img { width: 88px; flex: none; align-self: flex-start; }
  .detail h3 { margin: 0 0 3px; font-size: 12px; color: var(--gold); }
  .detail .sub { font-size: 10px; color: var(--blue); margin-bottom: 5px; }
  .detail .st { font-size: 10px; color: var(--dim); }
  .detail .dsc {
    font-size: 10px; margin-top: 6px; max-height: 108px; overflow: auto;
    border-top: 1px solid var(--line); padding-top: 5px; white-space: pre-wrap;
  }

  .hint { font-size: 10px; color: var(--dim); padding: 5px 12px; background: var(--bg2); }

  /* ---------- arrastar e soltar ---------- */
  .dropzone { min-height: 74px; transition: background .12s, outline-color .12s; }
  .dropzone.over {
    background: #e8c46a12;
    outline: 2px dashed var(--gold); outline-offset: -3px;
  }
  .dropzone.reject.over { outline-color: var(--red); background: #e2707a12; }
  .thumb.dragging { opacity: .35; }
  .thumb.drop-before { box-shadow: inset 3px 0 0 var(--gold); }
</style>
</head>
<body>

<div class="topbar">
  <h1>▚ DECK BUILDER</h1>
  <input class="deck-name" id="deck-name" maxlength="40" placeholder="nome do deck">
  <select id="deck-select" title="trocar de deck"></select>
  <span class="spacer"></span>
  <button id="btn-new">novo</button>
  <button id="btn-import">importar .ydk</button>
  <button id="btn-export">exportar .ydk</button>
  <button id="btn-delete" class="btn-danger">excluir</button>
  <button id="btn-save" class="btn-primary">salvar</button>
  <button id="btn-home">← home</button>
</div>

<div class="hint" id="status">carregando banco de cartas…</div>

<div class="workspace">
  <!-- ESQUERDA: o deck -->
  <div class="col deck">
    <div class="sec-head">
      <span>MAIN DECK</span>
      <span class="n" id="main-count">0</span>
      <span class="spacer"></span>
      <span id="main-rule">40–60</span>
    </div>
    <div class="deck-scroll">
      <div class="dropzone" id="main-zone">
        <div class="deck-grid" id="main-grid"></div>
        <div class="zone-empty" id="main-empty">
          Clique ou arraste as cartas da direita para o Main Deck.
        </div>
      </div>

      <div class="sec-head" style="margin:16px -12px 8px; border-top:1px solid var(--line)">
        <span>EXTRA DECK</span>
        <span class="n" id="extra-count">0</span>
        <span class="spacer"></span>
        <span>máx 15</span>
      </div>
      <div class="dropzone" id="extra-zone">
        <div class="deck-grid extra" id="extra-grid"></div>
        <div class="zone-empty" id="extra-empty">
          Fusion, Synchro, Xyz e Link vêm para cá automaticamente.
        </div>
      </div>
    </div>
  </div>

  <!-- DIREITA: o pool de cartas -->
  <div class="col">
    <div class="filters">
      <input type="text" id="f-name" placeholder="buscar por nome…" autocomplete="off">
      <select id="f-type">
        <option value="">tipo: todos</option>
        <option value="Monster">Monstro</option>
        <option value="Spell">Magia</option>
        <option value="Trap">Armadilha</option>
      </select>
      <select id="f-attr"><option value="">atributo: todos</option></select>
      <select id="f-race"><option value="">raça: todas</option></select>
      <select id="f-arch"><option value="">arquétipo: todos</option></select>
      <input type="number" id="f-lvmin" placeholder="nv⩾" min="0" max="12">
      <input type="number" id="f-lvmax" placeholder="nv⩽" min="0" max="12">
      <input type="number" id="f-atk" placeholder="ATK⩾" min="0" step="100">
      <button id="f-clear">limpar</button>
    </div>
    <div class="sec-head">
      <span id="pool-count">—</span>
      <span class="spacer"></span>
      <span>clique ou arraste = adicionar · arraste de volta = remover · botão direito = detalhe</span>
    </div>
    <div class="pool-scroll dropzone" id="pool-zone">
      <div class="pool-grid" id="pool-grid"></div>
    </div>
  </div>
</div>

<div class="detail" id="detail">
  <img id="d-img" alt="">
  <div style="min-width:0">
    <h3 id="d-name"></h3>
    <div class="sub" id="d-type"></div>
    <div class="st" id="d-stats"></div>
    <div class="dsc" id="d-desc"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/web/js/builder.js"></script>
</body>
</html>
