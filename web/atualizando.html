<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classic Duels — Atualizando</title>
<link rel="icon" href="/web/img/icone.png">
<link rel="stylesheet" href="/web/css/ui.css">
<style>
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 0%, #1b2438 0%, var(--bg) 60%);
  }
  .home { width: min(520px, 94vw); }

  .title { text-align: center; margin-bottom: 22px; border-bottom: 2px solid var(--line); padding-bottom: 16px; }
  .title h1 { margin: 0; font-size: 30px; letter-spacing: 5px; color: var(--gold); text-shadow: 0 2px 0 #0008; }
  .title p { margin: 6px 0 0; color: var(--dim); font-size: 11px; letter-spacing: 2px; }

  .slot { background: var(--panel); border: 2px solid var(--line); padding: 20px; }

  .etapa { font-size: 13px; letter-spacing: 1px; color: var(--gold); margin-bottom: 4px; }
  .detalhe { font-size: 11px; color: var(--dim); min-height: 15px; word-break: break-all; }

  .barra { height: 14px; background: var(--panel2); border: 1px solid var(--line); margin: 14px 0 6px; }
  .barra > i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .25s linear; }
  .pct { font-size: 10px; color: var(--dim); text-align: right; }

  .acoes { display: flex; gap: 8px; margin-top: 16px; }
  /* O guarda fica mesmo sem ninguem escondendo uma `.acoes` hoje: o `hidden` do
     markup nao esconde nada sozinho — ele e' uma regra da folha do NAVEGADOR, e
     qualquer regra NOSSA com `display` ganha dela. Foi assim que o "voltar para
     a versao anterior" (removido) aparecia em TODA atualizacao, inclusive sem
     backup nenhum. Ver `node web/js/esconder.test.mjs`. */
  .acoes[hidden] { display: none; }
  .acoes button { flex: 1; padding: 10px; }
  .secundario { background: var(--panel2); color: var(--dim); }

  .erro { color: var(--red); font-size: 11px; margin-top: 10px; min-height: 14px; }
  .nota { color: var(--dim); font-size: 10px; margin-top: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div class="home">
  <div class="title">
    <h1>CLASSIC DUELS</h1>
    <p id="versao">PROCURANDO ATUALIZACAO</p>
  </div>

  <div class="slot">
    <div class="etapa" id="etapa">checando…</div>
    <div class="detalhe" id="detalhe"></div>

    <div class="barra"><i id="barra"></i></div>
    <div class="pct" id="pct">0%</div>

    <!-- NAO existe "jogar sem atualizar" (23/08/2026). Ele era a porta pela qual
         um jogador ficava para tras de proposito, e o custo caia sempre no mesmo
         lugar: front novo conversando com motor velho, ou um deck que o servidor
         recusa por uma regra que so' existe na versao nova. Quem atualiza um dia
         atualiza todo dia; quem podia adiar, adiava para sempre. -->
    <div class="acoes">
      <button id="btn-atualizar" hidden>atualizar agora</button>
      <button id="btn-tentar" class="secundario" hidden>tentar de novo</button>
    </div>

    <!-- NAO ha' "voltar para a versao anterior" (23/08/2026). Pela mesma razao
         que nao ha' "jogar sem atualizar": voltar e' ficar para tras, e cliente
         parado numa versao velha e' o defeito mais caro que este projeto ja'
         pagou. Os BACKUPS continuam existindo (nada e' apagado numa
         atualizacao); o que saiu foi oferece-los como escolha a quem joga. -->

    <div class="erro" id="erro"></div>

    <!-- Preservar isto na tela importa: a primeira reacao de quem ve' uma barra
         de progresso num jogo e' achar que vai perder o save. -->
    <p class="nota">
      Seus decks, sua carteira e sua conta nao sao tocados pela atualizacao.
      O que for substituido vai para a pasta de backup, nunca e' apagado.
    </p>
  </div>
</div>

<script type="module" src="/web/js/bootguard.js"></script>
<script type="module">
  const $ = (id) => document.getElementById(id);
  const HOME = '/web/index.html';

  let terminouUmaVez = false;

  // Recusa vinda do clique (ex.: 409 "termine o duelo"). Sem guardar isto o
  // proximo tick, meio segundo depois, apagaria a mensagem antes de alguem ler.
  let recusa = '';

  // Quantas vezes ja' reconsultamos sozinhos. So' serve para a mensagem: quem
  // esta' sem rede precisa ver que a tela nao desistiu.
  let tentativas = 0;
  let proximaTentativa = 0;

  // De quanto em quanto tempo a tela reconsulta sozinha quando esta' sem
  // conexao. Nao e' o meio segundo do `tick`: cada tentativa abre uma conexao
  // com o GitHub, e insistir a cada 500 ms num wi-fi caido so' gasta bateria.
  const ESPERA_ENTRE_TENTATIVAS_MS = 10_000;

  // O estado do tick anterior — e' o que distingue "acabei de chegar em
  // disponivel" de "continuo em disponivel". Sem essa distincao, reabilitar o
  // botao desfazia o `disabled` do proprio clique meio segundo depois dele.
  let estadoAnterior = '';

  /** Pede ao servidor uma checagem nova (a unica saida da tela sem conexao). */
  async function rechecar(pedidoPeloJogador) {
    if (pedidoPeloJogador) { recusa = ''; tentativas = 0; }
    proximaTentativa = Date.now() + ESPERA_ENTRE_TENTATIVAS_MS;
    tentativas++;
    $('btn-tentar').disabled = true;
    try { await fetch('/__update/rechecar', { method: 'POST' }); }
    catch { /* o servidor local caiu; o proximo tick tenta de novo */ }
    $('btn-tentar').disabled = false;
  }

  function pinta(s) {
    $('etapa').textContent = s.etapa || '';
    $('detalhe').textContent = s.detalhe || '';
    $('erro').textContent = recusa || s.erro || '';

    const pct = Math.round((s.fracao || 0) * 100);
    $('barra').style.width = pct + '%';
    $('pct').textContent = pct + '%';

    if (s.versao) $('versao').textContent = s.versao.toUpperCase();

    const disponivel = s.estado === 'disponivel';
    $('btn-atualizar').hidden = !disponivel;
    if (disponivel) {
      $('etapa').textContent = 'atualizacao disponivel';
      $('detalhe').textContent = s.resumo || '';
      // So' na CHEGADA em `disponivel`: e' o caminho de volta de quem tentou de
      // novo depois de uma falha. Reabilitar a cada tick desfaria o `disabled`
      // do proprio clique, no tick seguinte a ele.
      if (estadoAnterior !== 'disponivel') $('btn-atualizar').disabled = false;
    }

    // "tentar de novo" so' faz sentido nos dois estados sem saida: nao alcancei
    // o servidor, ou a instalacao falhou. Nos outros ele seria um botao que
    // interrompe o que esta' acontecendo — com uma excecao: `checando` e' o que
    // a propria tentativa produz, e sumir com o botao durante ela o faria piscar
    // a cada reconsulta.
    const travado = s.estado === 'indisponivel' || s.estado === 'falhou'
                 || (s.estado === 'checando' && tentativas > 0);
    $('btn-tentar').hidden = !travado;

    // Fim de linha: some com os botoes e vai para a home sozinho. Uma tela de
    // update que exige um clique no fim so' serve para o jogador ficar preso
    // olhando "100%" sem saber que acabou.
    if (s.estado === 'concluido' && !terminouUmaVez) {
      terminouUmaVez = true;
      $('etapa').textContent = 'pronto';
      $('btn-atualizar').hidden = true;
      $('btn-tentar').hidden = true;
      setTimeout(() => location.href = HOME, 900);
    }

    // Troca do proprio executavel: o servidor vai morrer em instantes e o .bat
    // reabre o jogo. Avisa, senao a pagina simplesmente congela e parece travada.
    if (s.estado === 'reiniciando') {
      $('btn-atualizar').hidden = true;
      $('btn-tentar').hidden = true;
      $('etapa').textContent = 'reiniciando o Classic Duels';
      // ESTA janela e' que continua: o processo novo sobe com `--reaberto` e nao
      // abre outra (senao terminariam duas copias do jogo na tela). Quando ele
      // responder, o `tick` daqui leva esta mesma janela para a home.
      $('detalhe').textContent = 'o jogo volta nesta mesma janela em instantes';
      return;
    }

    // SEM CONEXAO — e aqui o jogador FICA. Nao ha' "jogar offline" desde
    // 23/08/2026: login, carteira, decks, adversarios e trilha moram todos no
    // Supabase, entao entrar sem rede entregava um jogo vazio com cara de
    // quebrado, e ainda deixava o cliente para tras. A tela reconsulta sozinha
    // ate' a rede voltar — desistir e exigir um clique deixaria quem so' perdeu
    // o wi-fi por um minuto parado numa mensagem morta.
    if (s.estado === 'indisponivel') {
      $('etapa').textContent = 'sem conexao com o servidor do jogo';
      $('detalhe').textContent = 'o Classic Duels precisa estar atualizado para abrir'
                              + (tentativas ? ` — ${tentativas} tentativa(s)` : '');
      if (Date.now() >= proximaTentativa) rechecar(false);
    }

    estadoAnterior = s.estado || '';
  }

  async function tick() {
    try {
      const r = await fetch('/__update/status', { cache: 'no-store' });
      if (r.ok) pinta(await r.json());
    } catch { /* o servidor caiu; o proximo tick tenta de novo */ }
  }

  $('btn-atualizar').addEventListener('click', async () => {
    $('btn-atualizar').disabled = true;
    recusa = '';
    try {
      const r = await fetch('/__update/aplicar', { method: 'POST' });
      // 409 = duelo em andamento. O servidor recusa de proposito: trocar os
      // arquivos de carta debaixo do motor deixaria o jogo instalado pela
      // metade. Nao e' erro do jogador, entao a mensagem tem que dizer o que
      // fazer, e o botao volta a funcionar quando o duelo acabar.
      if (r.status === 409) {
        const j = await r.json().catch(() => ({}));
        recusa = j.erro || 'termine o duelo para atualizar';
        $('erro').textContent = recusa;
        $('btn-atualizar').disabled = false;
        return;
      }
      if (!r.ok) {
        recusa = 'o servidor recusou a atualizacao (' + r.status + ')';
        $('erro').textContent = recusa;
        $('btn-atualizar').disabled = false;
      }
    }
    catch (e) { $('erro').textContent = String(e); $('btn-atualizar').disabled = false; }
  });

  $('btn-tentar').addEventListener('click', () => rechecar(true));

  tick();
  setInterval(tick, 500);
</script>
<!-- A batida que mantem o jogo aberto: sem ela o servidor se encerra.
     O terminal deixou de existir, entao e' a PAGINA que diz "ainda estou
     aqui". Toda tela de web/ precisa desta linha — `web/js/vivo.test.mjs`
     reprova quem a esquecer. Ver o cabecalho de `web/js/vivo.js`. -->
<script type="module">import { manterVivo } from '/web/js/vivo.js'; manterVivo();</script>
<script type="module">import { exigirVersao } from '/web/js/versao.js'; exigirVersao();</script>
</body>
</html>
