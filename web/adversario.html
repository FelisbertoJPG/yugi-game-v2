<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adversário — Classic Duels</title>
<link rel="icon" href="/web/img/icone.png">
<link rel="stylesheet" href="/web/css/ui.css">
<style>
  body { display: flex; flex-direction: column; }
  .wrap { flex: 1; overflow-y: auto; padding: 20px; }
  .npcs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; max-width: 900px; margin: 0 auto; }
  .npc {
    background: var(--panel); border: 2px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* proporção real da carta (59:86) e "contain" pra sempre mostrar a arte
     inteira — "cover" numa coluna mais larga que uma carta cortava as bordas. */
  .npc .art {
    aspect-ratio: 59 / 86; background: var(--panel2) center/contain no-repeat;
    border-bottom: 1px solid var(--line);
  }
  .npc .body { min-width: 0; padding: 12px; display: flex; flex-direction: column; gap: 5px; }
  .npc .name { color: var(--gold); font-size: 17px; overflow-wrap: anywhere; }
  .npc .theme { font-size: 11px; color: var(--blue); overflow-wrap: anywhere; }
  .npc .reward { font-size: 10px; color: var(--dim); overflow-wrap: anywhere; }
  .npc .go { margin-top: auto; padding-top: 6px; width: 100%; }
  .npc .go:disabled { opacity: .5; }
  .hint { font-size: 11px; color: var(--dim); padding: 8px 14px; background: var(--bg2); }

  .campaign { max-width: 900px; margin: 0 auto 26px; }
  .campaign:first-child { margin-top: 20px; }
  .campaign h2 {
    font-size: 13px; color: var(--gold); letter-spacing: 1px; margin: 0 0 10px;
    border-bottom: 1px solid var(--line); padding-bottom: 6px;
  }
  .campaign-empty { max-width: 900px; margin: 0 auto; font-size: 11px; color: var(--dim); }
</style>
</head>
<body>
<div class="topbar">
  <h1>▚ ADVERSÁRIO</h1>
  <span class="spacer"></span>
  <span class="dp" id="dp" style="color:var(--gold); border:1px solid var(--gold); padding:3px 10px; font-weight:bold">— DP</span>
  <button id="btn-home">← home</button>
</div>

<div class="hint">
  Escolha uma campanha e um oponente dentro dela para disparar o duelo. Ao
  <b>vencer</b>: <b>+100 DP</b> e a <b>carta-assinatura</b> do NPC entra na sua
  Coleção (recompensas de conclusão de campanha em breve). Exige o
  <b>duel-server</b> no ar (suba pelo <b>classic-duels.exe</b>). Você duela com
  o seu deck ativo.
</div>

<div class="wrap">
  <div id="campaigns"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/web/js/adversario.js"></script>
</body>
</html>
