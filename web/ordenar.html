<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordenar Trilha — Classic Duels</title>
<link rel="icon" href="/web/img/icone.png">
<link rel="stylesheet" href="/web/css/ui.css">
<style>
  body { display: flex; flex-direction: column; }
  .campanha-bar {
    display: flex; align-items: center; gap: 12px; justify-content: center;
    padding: 10px 16px; background: var(--bg2); border-bottom: 1px solid var(--line);
  }
  .campanha-bar .nome {
    color: var(--gold); font-size: 15px; letter-spacing: 2px; text-transform: uppercase;
    min-width: 240px; text-align: center;
  }
  .campanha-bar .conta { font-size: 11px; color: var(--dim); }
  .hint { font-size: 11px; color: var(--dim); padding: 8px 14px; background: var(--bg2); }

  .wrap { flex: 1; overflow-y: auto; padding: 18px; }
  .col { max-width: 720px; margin: 0 auto; }

  /* A CADEIA: como a trilha vai ficar, lida da esquerda para a direita. É o
     mesmo texto do pedido — [wevil -> rex raptor] [rex raptor -> mako]. */
  .cadeia {
    border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px;
    font-size: 12px; color: var(--dim); margin-bottom: 16px; line-height: 1.9;
  }
  .cadeia b { color: var(--gold); font-weight: normal; }
  .cadeia .seta { color: var(--blue); margin: 0 4px; }

  .lista { display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 4px;
    cursor: grab;
  }
  .item.arrastando { opacity: .4; }
  .item.alvo { border-color: var(--gold); }
  .item .pos {
    width: 26px; height: 26px; flex: none; border-radius: 50%;
    background: var(--panel2); color: var(--gold); font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .item .art {
    width: 34px; height: 48px; flex: none; border: 1px solid var(--line);
    background: var(--panel2) center/cover no-repeat;
  }
  .item .quem { flex: 1; min-width: 0; }
  .item .quem .nome { color: var(--ink); font-size: 13px; overflow-wrap: anywhere; }
  .item .quem .sub { font-size: 10px; color: var(--dim); overflow-wrap: anywhere; }
  .item .mover { display: flex; gap: 4px; }
  .item .mover button { padding: 2px 8px; font-size: 12px; }

  .acoes { display: flex; gap: 10px; margin-top: 18px; align-items: center; }
  .estado { font-size: 11px; color: var(--dim); }
  .vazio { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div class="topbar">
  <h1>▚ ORDENAR TRILHA</h1>
  <span class="spacer"></span>
  <button id="btn-voltar">← Área de Teste</button>
</div>

<div class="campanha-bar">
  <button id="camp-ant" title="campanha anterior">◀</button>
  <span class="nome" id="camp-nome">—</span>
  <button id="camp-prox" title="próxima campanha">▶</button>
  <span class="conta" id="camp-conta"></span>
</div>

<div class="hint">
  A ordem define <b>quem libera quem</b> na Trilha de Duelos: vencer um abre o
  seguinte. Arraste os adversários ou use ▲▼, e <b>publique</b> — a ordem é
  guardada por <b>id</b> em <code>conteudo/npc-trilha</code>, então entra igual
  no jogo de todo mundo. Adversário que você não ordenar aparece no fim.
</div>

<div class="wrap">
  <div class="col">
    <div class="cadeia" id="cadeia">—</div>
    <div class="lista" id="lista"></div>
    <div class="acoes">
      <button class="btn-primary" id="btn-publicar">publicar ordem</button>
      <span class="estado" id="estado"></span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/web/js/ordenar.js"></script>
</body>
</html>
