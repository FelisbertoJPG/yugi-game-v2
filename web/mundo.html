<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mundo — Classic Duels</title>
<link rel="icon" href="/web/img/icone.png">
<link rel="stylesheet" href="/web/css/ui.css">
<style>
  body { display: flex; flex-direction: column; }
  .wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: auto; }

  .map {
    position: relative; width: min(900px, 94vw); height: min(460px, 60vh);
    background:
      radial-gradient(ellipse at 30% 20%, #1c2740 0%, transparent 55%),
      radial-gradient(ellipse at 75% 70%, #1c2740 0%, transparent 55%),
      var(--bg2);
    border: 2px solid var(--line);
    overflow: hidden;
  }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .road {
    fill: none; stroke: var(--line2); stroke-width: 3; stroke-dasharray: 2 10;
    stroke-linecap: round;
  }

  .node {
    position: absolute; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; padding: 0; width: 108px;
  }
  .node .disc {
    width: 62px; height: 62px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; box-shadow: 0 0 0 4px #0004;
  }
  .node .label { font-size: 11px; color: var(--gold); text-align: center; overflow-wrap: anywhere; }
  .node .sub { font-size: 9px; color: var(--dim); text-align: center; }
  .node:hover:not(.locked) .disc { border-color: #f3d68a; box-shadow: 0 0 0 4px #0006, 0 0 12px #e8c46a88; }
  .node:hover:not(.locked) .label { color: #f3d68a; }

  .node.locked { cursor: not-allowed; }
  .node.locked .disc {
    background: var(--panel); border-color: var(--line); filter: grayscale(1);
    position: relative;
  }
  .node.locked .disc .lock {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 20px; background: #000a;
  }
  .node.locked .label, .node.locked .sub { color: var(--dim); }

  .hint { font-size: 11px; color: var(--dim); padding: 8px 14px; background: var(--bg2); text-align: center; }
</style>
</head>
<body>
<div class="topbar">
  <h1>▚ MUNDO</h1>
  <span class="spacer"></span>
  <span class="dp" id="dp" style="color:var(--gold); border:1px solid var(--gold); padding:3px 10px; font-weight:bold">— DP</span>
  <button id="btn-home">← área de teste</button>
</div>

<div class="hint">Escolha um cenário para entrar e andar até um adversário.</div>

<div class="wrap">
  <div class="map">
    <svg id="road-svg"></svg>
    <div id="nodes"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/web/js/mundo.js"></script>
</body>
</html>
