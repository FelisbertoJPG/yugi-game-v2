<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classic Duels — Entrar</title>
<link rel="icon" href="/web/img/icone.png">
<link rel="stylesheet" href="/web/css/ui.css">
<style>
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 0%, #1b2438 0%, var(--bg) 60%);
  }
  .home { width: min(420px, 94vw); }

  .title { text-align: center; margin-bottom: 22px; border-bottom: 2px solid var(--line); padding-bottom: 16px; }
  .title h1 { margin: 0; font-size: 30px; letter-spacing: 5px; color: var(--gold); text-shadow: 0 2px 0 #0008; }
  .title p { margin: 6px 0 0; color: var(--dim); font-size: 11px; letter-spacing: 2px; }

  .slot { background: var(--panel); border: 2px solid var(--line); padding: 18px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tabs button {
    flex: 1; padding: 8px; font-size: 12px; letter-spacing: 1px;
    background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
  }
  .tabs button.on { background: var(--panel); border-color: var(--gold); color: var(--gold); }

  form { display: grid; gap: 10px; }
  label { font-size: 11px; letter-spacing: 1px; color: var(--dim); display: block; margin-bottom: 4px; }
  input { width: 100%; }

  .error { color: var(--red); font-size: 11px; min-height: 14px; }
  .hint { color: var(--dim); font-size: 10px; margin-top: -4px; }

  button[type="submit"] { width: 100%; padding: 10px; margin-top: 4px; }

  .aviso { color: var(--gold); font-size: 11px; line-height: 1.5; }
  .linkish {
    background: none; border: 0; color: var(--dim); font-size: 10px;
    letter-spacing: 1px; padding: 4px; cursor: pointer; text-decoration: underline;
  }
  .linkish:hover { color: var(--gold); }

  /* `display:flex` aqui APAGA o `[hidden]` do navegador (a regra dele tem a
     menor especificidade que existe), entao o guarda tem de vir junto — e' a
     mesma armadilha que deixou o aviso de icone novo aparecendo em todo fim de
     duelo. Ver `node web/js/esconder.test.mjs`. */
  .lembrar { display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 2px 0 4px; }
  .lembrar[hidden] { display: none; }
  .lembrar input { width: auto; margin: 0; }
  .lembrar span { font-size: 11px; color: var(--dim); letter-spacing: 1px; }
</style>
</head>
<body>
<div class="home">
  <div class="title">
    <h1>CLASSIC DUELS</h1>
    <p id="versao">YUGI GAME V2</p>
  </div>

  <div class="slot">
    <div class="tabs">
      <button id="tab-login" class="on">entrar</button>
      <button id="tab-register">criar conta</button>
    </div>

    <form id="form">
      <div>
        <label for="email">e-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div id="campo-usuario" hidden>
        <label for="username">nome no jogo</label>
        <input id="username" name="username" autocomplete="username">
      </div>
      <div>
        <label for="password">senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <!-- "Manter login nesta maquina". Sem ela, a sessao vive so' enquanto a
           janela do jogo estiver aberta: fechar e abrir pede a senha de novo.
           So' aparece no modo ENTRAR — quem esta' criando conta ainda nem sabe
           se vai jogar nesta maquina, e a escolha continua disponivel no
           proximo login. -->
      <label class="lembrar" id="campo-lembrar">
        <input id="lembrar" type="checkbox">
        <span>manter login nesta maquina</span>
      </label>
      <div class="hint" id="hint" hidden>nome no jogo: 3-32 caracteres · senha com pelo menos 8</div>
      <div class="error" id="error"></div>
      <div class="aviso" id="aviso" hidden></div>
      <button type="submit" class="btn-primary" id="submit">entrar</button>
      <button type="button" class="linkish" id="esqueci">esqueci minha senha</button>
    </form>
  </div>
</div>

<script type="module" src="/web/js/bootguard.js"></script>
<script type="module">
import {
  login, register, recuperarSenha, desviarParaRecuperacao, manterLogin,
} from '/web/js/auth.js';

// Antes de tudo: se o link de recuperação caiu aqui (o Supabase ignora o
// `redirect_to` que não está na lista de URLs permitidas e usa a Site URL),
// leva para a tela certa levando o token junto.
if (desviarParaRecuperacao()) throw new Error('indo para a recuperacao');

const $ = (id) => document.getElementById(id);

// Entrar e criar conta terminam os dois na home, sempre — ver `requireLogin`.
const HOME = '/web/index.html';

let mode = 'login'; // 'login' | 'register'

function render() {
  $('tab-login').classList.toggle('on', mode === 'login');
  $('tab-register').classList.toggle('on', mode === 'register');
  $('submit').textContent = mode === 'login' ? 'entrar' : 'criar conta';
  $('password').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
  $('campo-usuario').hidden = mode !== 'register';
  $('username').required = mode === 'register';
  $('hint').hidden = mode !== 'register';
  $('esqueci').hidden = mode !== 'login';
  $('campo-lembrar').hidden = mode !== 'login';
  $('error').textContent = '';
  $('aviso').hidden = true;
}

$('tab-login').onclick = () => { mode = 'login'; render(); };
$('tab-register').onclick = () => { mode = 'register'; render(); };

$('form').onsubmit = async (e) => {
  e.preventDefault();
  $('error').textContent = '';
  $('aviso').hidden = true;
  $('submit').disabled = true;

  const email = $('email').value.trim();
  const password = $('password').value;
  const usuario = $('username').value.trim();

  const r = mode === 'login'
    ? await login(email, password, $('lembrar').checked)
    : await register(email, password, usuario);

  $('submit').disabled = false;
  if (!r.ok) { $('error').textContent = r.error || 'algo deu errado'; return; }

  // Com confirmacao de e-mail ligada, cadastrar NAO loga: o jogador precisa
  // clicar no link antes. Sem este aviso a tela ficaria parada, e parada e'
  // exatamente como um cadastro que falhou se parece.
  if (r.precisaConfirmar) {
    mode = 'login';
    render();
    $('aviso').hidden = false;
    $('aviso').textContent =
      `conta criada. confira o e-mail ${email} e clique no link de confirmacao para entrar.`;
    return;
  }

  location.href = HOME;
};

$('esqueci').onclick = async () => {
  const email = $('email').value.trim();
  if (!email) { $('error').textContent = 'escreva o e-mail primeiro'; return; }
  $('esqueci').disabled = true;
  // O link do e-mail leva à tela de recuperação, não de volta para cá.
  const r = await recuperarSenha(email, `${location.origin}/web/recuperar.html`);
  $('esqueci').disabled = false;
  if (!r.ok) { $('error').textContent = r.error; return; }
  $('aviso').hidden = false;
  // Nao confirma se a conta existe: isso entregaria quais e-mails tem conta.
  $('aviso').textContent = `se essa conta existir, o link de redefinicao chegou em ${email}.`;
};

// A caixa comeca como a pessoa a deixou da ultima vez. Guardar a ESCOLHA (e
// nao a sessao) e' o que faz "eu sempre marco isto" nao virar um clique a mais
// por dia — sem manter ninguem entrado contra a propria escolha.
$('lembrar').checked = manterLogin();

render();
</script>
<!-- A batida que mantem o jogo aberto: sem ela o servidor se encerra.
     O terminal deixou de existir, entao e' a PAGINA que diz "ainda estou
     aqui". Toda tela de web/ precisa desta linha — `web/js/vivo.test.mjs`
     reprova quem a esquecer. Ver o cabecalho de `web/js/vivo.js`. -->
<script type="module">import { manterVivo } from '/web/js/vivo.js'; manterVivo();</script>
<script type="module">import { exigirVersao } from '/web/js/versao.js'; exigirVersao();</script>
</body>
</html>
