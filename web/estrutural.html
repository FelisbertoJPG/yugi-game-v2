<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck Estrutural — Duel Academy</title>
<link rel="stylesheet" href="/web/css/ui.css">
<style>
  body { display: flex; flex-direction: column; overflow: hidden; }

  .topbar input, .topbar select {
    background: var(--bg2); color: var(--ink);
    border: 1px solid var(--line); font-size: 12px; padding: 3px 6px;
  }
  .topbar input.nome { width: 190px; color: var(--gold); }
  .topbar input.preco { width: 70px; }

  .workspace {
    flex: 1; display: grid; grid-template-columns: minmax(340px, 40%) 1fr;
    min-height: 0;
  }
  .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .col.deck { border-right: 2px solid var(--line); background: var(--bg2); }

  .sec-head {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 12px; background: var(--panel);
    border-bottom: 1px solid var(--line);
    font-size: 11px; letter-spacing: 1px; color: var(--dim);
  }
  .sec-head .n { color: var(--ink); }
  .sec-head .n.ok { color: var(--gold); }
  .sec-head .n.ruim { color: var(--red); }

  .lista { flex: 1; overflow-y: auto; padding: 8px; }

  .grade {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 6px;
  }
  .carta { position: relative; cursor: pointer; border: 1px solid var(--line); }
  .carta img { width: 100%; display: block; aspect-ratio: 59/86; object-fit: cover; }
  .carta .q {
    position: absolute; right: 2px; bottom: 2px;
    background: #000c; color: var(--gold); font-size: 11px; padding: 0 4px;
    border: 1px solid var(--line);
  }
  .carta.tem { border-color: var(--gold); }

  /* Mesmas cores e mesmo vocabulário do Booster Builder — quem já usa um
     reconhece o outro sem reaprender. */
  .sec-head .rar { font-weight: bold; letter-spacing: 2px; }
  .rar-UR { color: #e8c46a; }   /* dourado */
  .rar-SR { color: #cbb7ff; }   /* prata/roxo */
  .rar-R  { color: #7fd0ff; }   /* azul */
  .rar-N  { color: var(--dim); }

  .rar-block { padding: 0 12px 10px; }
  .rar-block .sec-head { margin: 0 -12px 6px; cursor: pointer; }
  .rar-block.ativa .sec-head { background: var(--panel2); box-shadow: inset 3px 0 0 var(--gold); }
  .zone-empty { font-size: 10px; color: var(--dim); padding: 6px 0; }
  .spacer { flex: 1; }

  /* Mesmo bloco de filtros do Booster Builder (web/booster.html) — quem monta
     um booster monta um estrutural, e um pool de 1158 cartas sem filtro só se
     navega sabendo o nome de cor. */
  .filtros {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .filtros input, .filtros select { padding: 4px 6px; font-size: 11px; }
  .filtros input[type="text"] { flex: 1; min-width: 130px; }
  .filtros input[type="number"] { width: 62px; }
  .filtros select { max-width: 140px; }

  .rodape {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-top: 2px solid var(--line); background: var(--panel);
  }
  .rodape .msg { flex: 1; font-size: 11px; }
  .rodape .msg.erro { color: var(--red); }
  .rodape .msg.ok { color: var(--gold); }

  .salvos { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 12px; }
  .salvos button { font-size: 11px; }
</style>
</head>
<body>
<div class="topbar">
  <button id="btn-voltar">← Área de Teste</button>
  <span style="flex:1"></span>
  <label style="font-size:11px; color:var(--dim)">nome</label>
  <input class="nome" id="nome" placeholder="Deck do Dragão Branco">
  <label style="font-size:11px; color:var(--dim)">DP</label>
  <input class="preco" id="preco" type="number" min="0" step="50" value="300">
  <label style="font-size:11px; color:var(--dim)">
    <input type="checkbox" id="na-loja" checked> na Loja
  </label>
  <button id="btn-salvar" class="btn-primary">publicar</button>
</div>

<div class="salvos" id="salvos"></div>

<div class="workspace">
  <div class="col deck">
    <div class="sec-head">
      DECK · <span class="n" id="conta">0</span> / 40–60
      <span class="spacer"></span>
      <span style="font-size:10px">clique = tirar uma cópia · segurar = ver o efeito</span>
    </div>
    <!-- Um bloco POR RARIDADE, como o Booster Builder: cabeçalho com a etiqueta,
         o nome por extenso e o contador daquela raridade. Clicar no cabeçalho
         torna a raridade ativa — é onde a próxima carta do pool entra. -->
    <div class="lista" id="zonas"></div>
  </div>

  <div class="col">
    <div class="filtros">
      <input type="text" id="f-name" placeholder="buscar por nome…" autocomplete="off">
      <select id="f-mon" title="filtrar monstros por tipo">
        <option value="">monstro…</option>
        <option value="*">▸ todos os monstros</option>
        <option value="Normal">Normal</option>
        <option value="Effect">Efeito</option>
        <option value="Ritual">Ritual</option>
        <option value="Fusion">Fusão</option>
        <option value="Synchro">Sincro</option>
        <option value="Xyz">Xyz</option>
        <option value="Link">Link</option>
        <option value="Pendulum">Pêndulo</option>
      </select>
      <select id="f-spell" title="filtrar magias por tipo">
        <option value="">magia…</option>
        <option value="*">▸ todas as magias</option>
        <option value="Normal">Normal</option>
        <option value="Continuous">Contínua</option>
        <option value="Equip">Equipamento</option>
        <option value="Field">Campo</option>
        <option value="Quick-Play">Rápida</option>
        <option value="Ritual">Ritual</option>
      </select>
      <select id="f-trap" title="filtrar armadilhas por tipo">
        <option value="">armadilha…</option>
        <option value="*">▸ todas as armadilhas</option>
        <option value="Normal">Normal</option>
        <option value="Continuous">Contínua</option>
        <option value="Counter">Counter</option>
      </select>
      <select id="f-attr"><option value="">atributo: todos</option></select>
      <select id="f-race"><option value="">raça: todas</option></select>
      <select id="f-arch"><option value="">arquétipo: todos</option></select>
      <select id="f-tag" title="filtrar por tag"><option value="">tag: todas</option></select>
      <select id="f-sort" title="ordenar as cartas">
        <option value="">ordem: padrão</option>
        <option value="atk">maior ATK</option>
        <option value="def">maior DEF</option>
        <option value="lv">maior nível</option>
      </select>
      <input type="number" id="f-lvmin" placeholder="nv⩾" min="0" max="12">
      <input type="number" id="f-lvmax" placeholder="nv⩽" min="0" max="12">
      <input type="number" id="f-atk" placeholder="ATK =" min="0" step="50" title="ATK exato (vazio = qualquer)">
      <input type="number" id="f-def" placeholder="DEF =" min="0" step="50" title="DEF exato (vazio = qualquer)">
      <!-- Não existe o checkbox "Lista 1" do Booster Builder: aqui o pool é
           SEMPRE a Lista 1. Um estrutural fora dela seria vendido e depois
           recusado por `salvar_deck` na primeira reedição. -->
      <button id="f-clear">limpar</button>
    </div>
    <div class="sec-head">
      POOL · <span class="n" id="conta-pool">—</span> cartas da Lista 1
      <span class="spacer"></span>
      <span style="font-size:10px">clique = adicionar · segurar = ver o efeito</span>
    </div>
    <div class="lista"><div class="grade" id="grade-pool"></div></div>
  </div>
</div>

<div class="rodape">
  <span class="msg" id="msg">carregando…</span>
  <button id="btn-apagar">apagar este</button>
  <button id="btn-novo">novo</button>
</div>

<script type="module">
/**
 * Builder do Deck Estrutural (Área de Teste).
 *
 * Publica no Supabase, não em disco: é a regra de toda ferramenta nova daqui —
 * salvo em `store/*.json`, o que se cria aqui nunca chegaria em quem joga sem
 * publicar um Release.
 *
 * O pool é a Lista 1, o mesmo do Deck Builder. Um estrutural fora dela seria
 * vendido e depois recusado por `salvar_deck` na primeira reedição — pior que
 * não deixar montar.
 */
import { YgoDB } from '/ygo-data/src/ygodb.js';
import { inLista1 } from '/web/js/lista1.js';
import { hydrateCardLists } from '/web/js/cardlists.js';
import {
  RARITIES, RARITY_LABEL, listBoosters, hydrateBoosters, annotateDb, allBoosterTags,
} from '/web/js/boosters.js';
import {
  listarEstruturais, salvarEstrutural, apagarEstrutural,
  validarYdk, paraYdk, deYdk, travadaPorBooster,
} from '/web/js/estruturais.js';
// Segurar a carta abre o efeito dela — o mesmo gesto e a mesma janela do
// Booster Builder e do Deck Builder. Sem isto, montar um estrutural obrigava a
// decorar o que cada carta faz.
import { wireLongPress, injectHoldStyles, HOLD_MS } from '/web/js/interact.js';
import { configureCardDetail, showCardDetail } from '/web/js/carddetail.js';

const $ = (id) => document.getElementById(id);
const ART = (id) => `https://images.ygoprodeck.com/images/cards_small/${id}.jpg`;
const MAX_POOL = 240;   // mesma trava do Deck Builder: 13.728 miniaturas matam a página
const MIN_DECK = 40;    // o deck é VENDIDO: menos que isto não dá para jogar

let db = null;
let pool = [];
let boosters = [];      // para saber a raridade já travada de cada carta
let quantidades = {};   // { id: n }
let raridades = {};     // { id: 'UR'|'SR'|'R'|'N' }
let raridadeAtiva = 'N';
let idAtual = null;     // id do estrutural em edição (null = novo)

const nomeDe = (id) => db?.brief(id)?.name ?? String(id);
const total = () => Object.values(quantidades).reduce((a, b) => a + b, 0);

function msg(texto, tipo = '') {
  $('msg').textContent = texto;
  $('msg').className = 'msg ' + tipo;
}

/** Raridade que ESTA carta deve ter: a travada por booster manda. */
function raridadeDe(id) {
  return travadaPorBooster(id, boosters)?.rarity ?? raridades[id] ?? 'N';
}

/** Ids do deck que estão nesta raridade. */
const daRaridade = (r) => Object.keys(quantidades).filter((id) => raridadeDe(id) === r);

/**
 * Desenha o deck em QUATRO BLOCOS, um por raridade — o mesmo formato do
 * Booster Builder (`booster-zones`). A separação é o ponto: numa grade única
 * não dá para ver de relance quantas UR o deck tem, que é justamente o que se
 * está balanceando.
 */
function pintarDeck() {
  const n = total();
  $('conta').textContent = n;
  $('conta').className = 'n ' + (n >= MIN_DECK && n <= 60 ? 'ok' : 'ruim');

  // O deck é VENDIDO: publicar com menos de 40 entregaria algo injogável.
  $('btn-salvar').disabled = n < MIN_DECK || n > 60;

  const wrap = document.createDocumentFragment();
  for (const r of RARITIES) {
    const ids = daRaridade(r);

    const bloco = document.createElement('div');
    bloco.className = 'rar-block' + (r === raridadeAtiva ? ' ativa' : '');

    const head = document.createElement('div');
    head.className = 'sec-head';
    head.innerHTML = `<span class="rar rar-${r}">${r}</span>`
      + `<span style="color:var(--dim)">${RARITY_LABEL[r]}</span>`
      + `<span class="n">${ids.reduce((s, id) => s + quantidades[id], 0)}</span>`
      + `<span class="spacer"></span>`
      + `<span style="font-size:10px">${r === raridadeAtiva ? 'recebendo' : ''}</span>`;
    head.onclick = () => { raridadeAtiva = r; pintarDeck(); pintarPool(); };
    bloco.append(head);

    if (!ids.length) {
      const vazio = document.createElement('div');
      vazio.className = 'zone-empty';
      vazio.textContent = `Nenhuma carta em ${r}.`;
      bloco.append(vazio);
    } else {
      const grade = document.createElement('div');
      grade.className = 'grade';
      for (const id of ids) {
        const el = document.createElement('div');
        el.className = 'carta tem';
        el.title = `${nomeDe(id)}\nclique = tirar uma cópia · segurar = detalhes`;
        el.innerHTML = `<img src="${ART(id)}" alt="" draggable="false">`
                     + `<span class="q">${quantidades[id]}</span>`;
        // `segurou()` consome o gesto: sem consultar isto, soltar o botão
        // tiraria uma cópia logo depois de abrir os detalhes.
        const segurou = wireLongPress(el, HOLD_MS, () => showCardDetail(id));
        el.onclick = () => {
          if (segurou()) return;
          quantidades[id] -= 1;
          if (quantidades[id] <= 0) { delete quantidades[id]; delete raridades[id]; }
          pintarDeck(); pintarPool();
        };
        el.oncontextmenu = (e) => { e.preventDefault(); showCardDetail(id); };
        grade.append(el);
      }
      bloco.append(grade);
    }
    wrap.append(bloco);
  }
  $('zonas').replaceChildren(wrap);
}

// ---------------------------------------------------------------- filtros do pool
// Portados do Booster Builder (`web/js/boosterbuilder.js`), com o mesmo
// comportamento: os três seletores de TIPO são mutuamente exclusivos, o resto
// combina livremente. A diferença é que aqui o `pool` já nasce restrito à
// Lista 1, então o filtro roda por cima dele e não do banco inteiro.

const TIPO_IDS = ['f-mon', 'f-spell', 'f-trap'];
const FILTRO_IDS = ['f-name', 'f-attr', 'f-race', 'f-arch', 'f-tag', 'f-sort',
                    'f-lvmin', 'f-lvmax', 'f-atk', 'f-def'];

function tipoAtivo() {
  const mon = $('f-mon').value, sp = $('f-spell').value, tr = $('f-trap').value;
  if (mon) return { cardType: 'M', sub: mon === '*' ? null : mon };
  if (sp) return { cardType: 'S', sub: sp === '*' ? null : sp };
  if (tr) return { cardType: 'T', sub: tr === '*' ? null : tr };
  return { cardType: null, sub: null };
}

function casaSub(c, cardType, sub) {
  const tl = c.tl || '';
  if (cardType === 'M') {
    if (sub === 'Normal') return /Normal/.test(tl);
    if (sub === 'Effect') return /Effect/.test(tl) && !/Ritual|Fusion|Synchro|Xyz|Link/.test(tl);
    return new RegExp(sub).test(tl);
  }
  return tl.startsWith(sub);
}

/** Ordena por maior ATK/DEF/nível (desc.); nulos por último. */
function ordenar(lista, chave) {
  if (!chave) return lista;
  const val = (c) => (chave === 'atk' ? c.atk : chave === 'def' ? c.def : c.lv);
  return [...lista].sort((a, b) => {
    const va = val(a), vb = val(b);
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    return vb - va;
  });
}

/** O pool depois dos filtros, ANTES do corte de MAX_POOL. */
function filtrado() {
  const num = (id) => ($(id).value === '' ? null : Number($(id).value));
  const { cardType, sub } = tipoAtivo();
  let r = pool;

  const nome = $('f-name').value.trim().toLowerCase();
  if (nome) r = r.filter((c) => c.name.toLowerCase().includes(nome));
  if (cardType) r = r.filter((c) => c.t === cardType);
  if (sub) r = r.filter((c) => casaSub(c, cardType, sub));

  const at = $('f-attr').value;   if (at) r = r.filter((c) => c.at === at);
  const raca = $('f-race').value; if (raca) r = r.filter((c) => c.r === raca);
  const arq = $('f-arch').value;  if (arq) r = r.filter((c) => (c.a ?? []).includes(arq));
  const tag = $('f-tag').value;   if (tag) r = r.filter((c) => (c.tags ?? []).includes(tag));

  const lvmin = num('f-lvmin'); if (lvmin != null) r = r.filter((c) => (c.lv ?? -1) >= lvmin);
  const lvmax = num('f-lvmax'); if (lvmax != null) r = r.filter((c) => (c.lv ?? 99) <= lvmax);
  const atk = num('f-atk');     if (atk != null) r = r.filter((c) => c.atk === atk);
  const def = num('f-def');     if (def != null) r = r.filter((c) => c.def === def);

  return ordenar(r, $('f-sort').value);
}

function pintarPool() {
  const achadas = filtrado();
  const lista = achadas.slice(0, MAX_POOL);

  // Conta o TOTAL achado, não o que coube na tela: "240" quando havia 900 faz
  // o filtro parecer mais estreito do que é.
  $('conta-pool').textContent = achadas.length > MAX_POOL
    ? `${achadas.length} (mostrando ${MAX_POOL})` : `${achadas.length}`;

  const frag = document.createDocumentFragment();
  for (const c of lista) {
    const q = quantidades[c.id] ?? 0;
    const trava = travadaPorBooster(c.id, boosters);
    const r = q ? raridadeDe(c.id) : (trava?.rarity ?? raridadeAtiva);

    const el = document.createElement('div');
    el.className = 'carta' + (q ? ' tem' : '');
    el.title = `${c.name}${q ? ` — ${q} no deck` : ''}`
             + (trava ? ` · ${trava.rarity} em "${trava.booster}"` : '')
             + `\nclique = adicionar em ${trava ? trava.rarity : raridadeAtiva} · segurar = detalhes`;
    el.innerHTML = `<img src="${ART(c.id)}" alt="" draggable="false">`
      + (q ? `<span class="r ${r}">${r}</span><span class="q">${q}</span>` : '');
    const segurou = wireLongPress(el, HOLD_MS, () => showCardDetail(c.id));
    el.oncontextmenu = (e) => { e.preventDefault(); showCardDetail(c.id); };
    el.onclick = () => {
      if (segurou()) return;
      // Teto de 3 aqui e no servidor. Aqui é conveniência; lá é a regra.
      if ((quantidades[c.id] ?? 0) >= 3) return void msg('máximo de 3 cópias', 'erro');
      quantidades[c.id] = (quantidades[c.id] ?? 0) + 1;

      // Reprint entra na raridade em que a carta JÁ está — a raridade é da
      // carta, não do pacote (mesma regra do Booster Builder).
      if (trava) {
        raridades[c.id] = trava.rarity;
        if (trava.rarity !== raridadeAtiva)
          msg(`${c.name} é ${trava.rarity} em "${trava.booster}" — entrou como ${trava.rarity}`);
      } else {
        raridades[c.id] = raridadeAtiva;
      }
      pintarDeck(); pintarPool();
    };
    frag.append(el);
  }
  $('grade-pool').replaceChildren(frag);
}

async function pintarSalvos() {
  const todos = await listarEstruturais();
  const frag = document.createDocumentFragment();
  for (const d of todos) {
    const b = document.createElement('button');
    b.textContent = `${d.nome} (${d.preco} DP)${d.na_loja ? '' : ' · fora da loja'}`;
    if (d.id === idAtual) b.classList.add('btn-primary');
    b.onclick = () => carregar(d);
    frag.append(b);
  }
  const novo = document.createElement('button');
  novo.textContent = '+ novo';
  novo.onclick = limpar;
  frag.append(novo);
  $('salvos').replaceChildren(frag);
}

function carregar(d) {
  idAtual = d.id;
  $('nome').value = d.nome;
  $('preco').value = d.preco;
  $('na-loja').checked = d.na_loja !== false;
  quantidades = deYdk(d.ydk);
  raridades = { ...(d.raridades ?? {}) };
  pintarDeck(); pintarPool(); pintarSalvos();
  msg(`editando "${d.nome}"`);
}

function limpar() {
  idAtual = null;
  $('nome').value = '';
  $('preco').value = 300;
  $('na-loja').checked = true;
  quantidades = {};
  raridades = {};
  pintarDeck(); pintarPool(); pintarSalvos();
  msg('novo deck estrutural');
}

/** "Deck do Dragão Branco" -> "deck-do-dragao-branco" */
function slug(s) {
  return String(s).normalize('NFD').replace(/\p{Diacritic}/gu, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'estrutural';
}

$('btn-salvar').onclick = async () => {
  const nome = $('nome').value.trim();
  if (!nome) return void msg('dê um nome ao deck', 'erro');

  const ydk = paraYdk(quantidades);

  // Valida NO SERVIDOR, com a mesma função que a compra usa — validar só aqui
  // deixaria a tela e o banco discordando justo na publicação.
  const v = await validarYdk(ydk);
  if (!v.ok) return void msg(`deck inválido: ${(v.problemas ?? []).join('; ')}`, 'erro');

  // A capa é a carta mais frequente; empate resolve pela primeira. Serve só de
  // arte na vitrine.
  const capa = Object.entries(quantidades).sort((a, b) => b[1] - a[1])[0]?.[0] ?? null;

  const r = await salvarEstrutural({
    id: idAtual ?? slug(nome),
    nome, preco: $('preco').value, capa, ydk,
    raridades: Object.fromEntries(Object.keys(quantidades).map((id) => [id, raridadeDe(id)])),
    na_loja: $('na-loja').checked,
  });
  if (!r.ok) return void msg(r.error, 'erro');

  idAtual = idAtual ?? slug(nome);
  await pintarSalvos();
  msg(`"${nome}" publicado — todo mundo recebe no próximo boot`, 'ok');
};

$('btn-apagar').onclick = async () => {
  if (!idAtual) return void msg('nada para apagar', 'erro');
  const r = await apagarEstrutural(idAtual);
  if (!r.ok) return void msg(r.error ?? 'não consegui apagar', 'erro');
  limpar();
  await pintarSalvos();
  msg('apagado', 'ok');
};

$('btn-novo').onclick = limpar;
$('btn-voltar').onclick = () => (location.href = '/web/teste.html');

for (const id of FILTRO_IDS) $(id).addEventListener('input', pintarPool);
for (const id of TIPO_IDS) {
  // Um tipo por vez: escolher "magia" tem de apagar "monstro", senão o filtro
  // vira uma interseção vazia e o pool some sem explicação.
  $(id).addEventListener('change', () => {
    if ($(id).value) for (const outro of TIPO_IDS) if (outro !== id) $(outro).value = '';
    pintarPool();
  });
}
$('f-clear').onclick = () => {
  for (const id of [...FILTRO_IDS, ...TIPO_IDS]) $(id).value = '';
  pintarPool();
};

// ---------------------------------------------------------------- boot
injectHoldStyles();   // o anel de progresso do "segurar"

try {
  db = await YgoDB.load('/ygo-data/data', { full: false });
  // A janela de detalhes usa o índice já carregado; o `cards.json` completo
  // (~14 MB, onde mora o texto do efeito) só é buscado no primeiro detalhe.
  configureCardDetail({ db });
  await hydrateCardLists();   // o pool publicado, ANTES de filtrar por ele

  // Boosters ANTES de montar o pool: `annotateDb` escreve `tags` nas entradas
  // do índice, e é dessas tags que vive o filtro de tag.
  await hydrateBoosters();
  boosters = listBoosters();
  annotateDb(db);

  // `db.filter({})` é como o Deck Builder semeia o pool — não existe `all()`.
  pool = db.filter({}).filter(inLista1).sort((a, b) => a.name.localeCompare(b.name));

  // As opções saem do POOL, não do banco inteiro: oferecer "Cyberse" numa lista
  // que não tem nenhum só cria filtro que devolve zero.
  const unicos = (fn) => [...new Set(pool.flatMap(fn).filter(Boolean))].sort();
  $('f-attr').append(...unicos((c) => [c.at]).map((v) => new Option(v, v)));
  $('f-race').append(...unicos((c) => [c.r]).map((v) => new Option(v, v)));
  $('f-arch').append(...unicos((c) => c.a ?? []).map((v) => new Option(v, v)));
  $('f-tag').append(...[...new Set(allBoosterTags())].sort().map((t) => new Option(t, t)));
} catch (e) {
  msg('não consegui carregar o banco de cartas: ' + e.message, 'erro');
}

await pintarSalvos();
limpar();
pintarPool();
</script>
