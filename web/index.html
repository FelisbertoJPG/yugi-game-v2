<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classic Duels — Home</title>
<link rel="icon" href="/web/img/icone.png">
<link rel="stylesheet" href="/web/css/ui.css">
<style>
  /* A lateral social (perfil, amigos, notificações) é FIXA na borda esquerda da
     janela, do topo ao rodapé — é um painel de estado do jogo, não conteúdo da
     página: ela não rola junto e não muda de lugar quando o menu cresce. O
     conteúdo fica centralizado no espaço que sobra.

     A largura dela é a MESMA em `--lateral`, usada no padding do body e no
     deslocamento do botão do deck. Repetir 280px em três lugares faria dois
     deles envelhecerem no dia em que a lateral mudar de tamanho. */
  :root { --lateral: 280px; }

  body {
    display: block; margin: 0;
    padding: 18px 18px 18px calc(var(--lateral) + 18px);
    background: radial-gradient(ellipse at 50% 0%, #1b2438 0%, var(--bg) 60%);
  }
  .home { width: min(760px, 100%); margin: 0 auto; }

  /* ------------------------------------------------------------- lateral */
  .lateral {
    position: fixed; left: 0; top: 0; bottom: 0; width: var(--lateral); z-index: 10;
    display: flex; flex-direction: column; gap: 10px;
    border-right: 2px solid var(--line); background: var(--bg2); padding: 10px;
    overflow: hidden;
  }

  /* Numa tela estreita a lateral deixa de ser fixa e vira o topo da página, e
     não some: perder o aviso de que alguém te chamou para duelar é o pior
     desfecho possível. */
  @media (max-width: 880px) {
    body { padding: 18px; }
    .lateral { position: static; width: auto; max-height: 50vh;
               border: 2px solid var(--line); margin-bottom: 18px; }
    .home { width: 100%; }
  }

  .cartao { border: 2px solid var(--line); background: var(--panel); padding: 10px; }

  .eu { display: flex; align-items: center; gap: 10px; }
  /* O SLOT do ícone. É um botão: clicar abre a escolha entre os que você tem.
     A borda dourada no hover é o único convite — um rótulo "trocar" ao lado
     ocuparia a linha do nome, que é onde o olho vai primeiro. */
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; flex: none; padding: 0;
    border: 2px solid var(--line2); background: var(--panel2);
    overflow: hidden; cursor: pointer;
  }
  .avatar:hover { border-color: var(--gold); }
  .avatar img { width: 100%; height: 100%; display: block; }
  .eu .quem { min-width: 0; flex: 1; }
  .eu .nome { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink);
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .eu .etiqueta { color: var(--gold); font-size: 11px; }
  .eu .dp { font-size: 12px; color: var(--gold); letter-spacing: 1px; margin-top: 2px; }

  /* O pontinho de presença. Verde/vermelho é a leitura instantânea, mas quem
     não distingue as duas cores ainda tem o texto ONLINE/OFFLINE ao lado —
     cor sozinha nunca carrega a informação. */
  .ponto { width: 9px; height: 9px; border-radius: 50%; flex: none;
           background: var(--red); box-shadow: 0 0 0 1px #0006; }
  .ponto.on { background: var(--green); }

  .amigos-topo { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .amigos-topo h2 { margin: 0; font-size: 10px; letter-spacing: 2px; color: var(--dim); font-weight: normal; }
  .amigos-topo .n { margin-left: auto; font-size: 10px; color: var(--dim); }

  .amigos { flex: 1; min-height: 90px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }

  .busca-amigo { display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
                 background: var(--panel2); border: 1px solid var(--line); padding: 3px 6px; }
  .busca-amigo .lupa { font-size: 11px; opacity: .7; }
  .busca-amigo input { flex: 1; background: none; border: 0; color: var(--ink);
                       font-family: inherit; font-size: 11px; padding: 2px 0; }
  .busca-amigo input:focus { outline: none; }
  /* `display:flex` ganha do `[hidden]` da folha do navegador — sem este guarda a
     caixa de resultados fica na tela vazia o tempo todo. Ver esconder.test.mjs. */
  .busca-res { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; max-height: 30vh; overflow-y: auto; }
  .busca-res[hidden] { display: none; }
  .busca-res .achado { display: flex; align-items: center; gap: 6px; width: 100%;
                       background: var(--panel2); border: 1px solid var(--line);
                       color: var(--ink); font-family: inherit; font-size: 11px;
                       padding: 4px 6px; cursor: pointer; text-align: left; }
  .busca-res .achado:hover { border-color: var(--gold); color: var(--gold); }
  .busca-res .achado .mais { margin-left: auto; color: var(--dim); font-size: 10px; }
  .busca-res .vazio { color: var(--dim); font-size: 10px; padding: 2px; }
  .amigo {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 7px 9px; background: var(--panel2); border: 1px solid var(--line);
  }
  .amigo:hover:not(:disabled) { border-color: var(--gold); }
  .amigo .mini { width: 26px; height: 26px; border-radius: 50%; flex: none; overflow: hidden;
                 border: 1px solid var(--line2); background: var(--panel); }
  .amigo .mini img { width: 100%; height: 100%; display: block; }

  /* A grade de escolha do ícone. O que você NÃO tem aparece apagado e não
     clicável, em vez de sumir: ver o que dá para conseguir é metade da graça
     de ter coleção — e é o que vai levar alguém à Loja quando ela vender
     cosméticos. */
  .icone-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
                 gap: 8px; max-height: 46vh; overflow-y: auto; }
  .icone-op { padding: 6px; background: var(--panel2); border: 1px solid var(--line);
              display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .icone-op:hover:not(:disabled) { border-color: var(--gold); }
  .icone-op img { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line2); }
  .icone-op .rot { font-size: 8px; letter-spacing: 1px; color: var(--dim);
                   max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icone-op.atual { border-color: var(--gold); background: var(--panel); }
  .icone-op.atual img { border-color: var(--gold); }
  .icone-op:disabled { opacity: .38; }
  .icone-op:disabled .rot { color: var(--dim); }
  .amigo .nome { flex: 1; min-width: 0; font-size: 11px; overflow: hidden;
                 text-overflow: ellipsis; white-space: nowrap; }
  .amigo .estado { font-size: 9px; letter-spacing: 1px; color: var(--dim); }
  .amigo.on .estado { color: var(--green); }
  /* Offline continua VISÍVEL, só apagado: sumir com o amigo quando ele fecha o
     jogo faria a lista dançar sozinha e esconderia quem você tem. */
  .amigo:disabled { opacity: .55; }

  .vazio { font-size: 10px; color: var(--dim); line-height: 1.6; padding: 6px 2px; }

  /* Notificações: o botão fica no PÉ da lateral, como no desenho. Ele pisca
     quando chega coisa nova e mostra a contagem. */
  .notif-btn { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
               padding: 11px 12px; background: var(--panel); border: 2px solid var(--line); }
  .notif-btn:hover:not(:disabled) { border-color: var(--gold); }
  .notif-btn .txt { flex: 1; font-size: 10px; letter-spacing: 1px; color: var(--dim); }
  .notif-btn .cont { font-size: 11px; font-weight: bold; color: var(--bg); background: var(--dim);
                     border-radius: 9px; padding: 1px 7px; }
  .notif-btn.tem { border-color: var(--gold); animation: pulsa 1.6s ease-in-out infinite; }
  .notif-btn.tem .txt { color: var(--ink); }
  .notif-btn.tem .cont { background: var(--red); color: #fff; }
  .notif-btn .ic { font-size: 12px; }

  /* ------------------------------------------------------- a doca de chats
     Presa no rodapé e à direita da lateral, para as janelas crescerem de lado
     sem espremer o menu. `row-reverse` é o "se gruda mais a lateral" do
     desenho: o fluxo começa na esquerda, e as minimizadas — que o
     `chatdoca.js` põe primeiro no DOM — acabam encostadas nela. */
  .chatdoca {
    position: fixed; left: var(--lateral); right: 0; bottom: 0; z-index: 60;
    display: flex; align-items: flex-end; gap: 8px; padding: 0 10px;
    pointer-events: none;   /* a doca é só o trilho; quem clica são as janelas */
  }
  .chatdoca > * { pointer-events: auto; }

  .chatjanela {
    display: flex; flex-direction: column;
    width: 280px; height: 320px;
    background: var(--panel); border: 1px solid var(--line); border-bottom: 0;
  }
  /* Minimizada = só a barra. `height:auto` em vez de `display:none` no corpo:
     a janela continua na doca, ocupando o lugar dela na fila. */
  .chatjanela.min { height: auto; width: 190px; }
  .chatjanela.min .cj-corpo,
  .chatjanela.min .cj-pe,
  .chatjanela.min .cj-erro { display: none; }

  .cj-barra { display: flex; align-items: center; gap: 6px; cursor: pointer;
              background: var(--panel2); border-bottom: 1px solid var(--line); padding: 5px 7px; }
  .cj-barra:hover { border-bottom-color: var(--gold); }
  .cj-ic { font-size: 11px; }
  .cj-tit { flex: 1; font-size: 10px; letter-spacing: 1px; color: var(--ink);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cj-n { font-size: 10px; font-weight: bold; color: transparent; }
  .cj-n.tem { color: #fff; background: var(--red); border-radius: 8px; padding: 0 5px; }
  .cj-min, .cj-x { background: none; border: 0; color: var(--dim); cursor: pointer;
                   font-size: 12px; line-height: 1; padding: 0 2px; }
  .cj-min:hover, .cj-x:hover { color: var(--gold); }

  .cj-corpo { flex: 1; overflow-y: auto; padding: 6px 7px; display: flex;
              flex-direction: column; gap: 4px; font-size: 11px; }
  .cj-vazio { color: var(--dim); font-size: 10px; }
  .cj-msg { line-height: 1.35; word-break: break-word; }
  .cj-msg b { color: var(--gold); margin-right: 5px; font-weight: normal; }
  /* A minha mensagem encosta na direita — é o que separa "eu" de "os outros"
     numa conversa de várias pessoas sem repetir o nome em toda linha. */
  .cj-msg.meu { align-self: flex-end; text-align: right; max-width: 90%; }
  .cj-msg.meu b { color: var(--dim); }

  .cj-erro { display: none; font-size: 10px; color: var(--red); padding: 0 7px 4px; }
  .cj-erro.tem { display: block; }

  .cj-pe { border-top: 1px solid var(--line); padding: 5px 7px; }
  .cj-pe input { width: 100%; background: var(--panel2); border: 1px solid var(--line);
                 color: var(--ink); font-family: inherit; font-size: 11px; padding: 4px 6px; }
  .cj-pe input:focus { outline: none; border-color: var(--gold); }

  @media (max-width: 900px) {
    /* Na tela estreita a lateral não é fixa (ela vira um bloco no topo), então a
       doca não pode reservar espaço para ela. E a janela encolhe: 280px não
       cabem lado a lado num celular. */
    .chatdoca { left: 0; }
    .chatjanela { width: 76vw; max-width: 280px; height: 46vh; }
    .chatjanela.min { width: auto; }
  }
  @keyframes pulsa { 0%, 100% { box-shadow: 0 0 0 0 #e8c46a55; } 50% { box-shadow: 0 0 0 5px #e8c46a00; } }
  @media (prefers-reduced-motion: reduce) { .notif-btn.tem { animation: none; } }

  /* ------------------------------------------------------------- conteúdo */
  .topline { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .topline .spacer { flex: 1; }
  .test-link { font-size: 11px; color: var(--dim); border: 1px solid var(--line);
               padding: 4px 10px; background: var(--panel); }
  .test-link:hover { color: var(--ink); border-color: var(--dim); }

  /* Quantas pessoas estão no jogo agora. Canto superior direito, como pedido. */
  .online-agora { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dim);
                  border: 1px solid var(--line); background: var(--panel); padding: 4px 10px; }
  .online-agora b { color: var(--green); }
  /* O pontinho de "ao vivo" só some quando o canal cai — e aí o número continua
     certo, só demora mais a mudar. É informação, não alarme. */
  .online-agora .vivo { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .online-agora.frio .vivo { background: var(--dim); }

  .title { text-align: center; margin-bottom: 22px; border-bottom: 2px solid var(--line); padding-bottom: 16px; }
  .title h1 { margin: 0; font-size: 30px; letter-spacing: 5px; color: var(--gold); text-shadow: 0 2px 0 #0008; }
  .title p { margin: 6px 0 0; color: var(--dim); font-size: 11px; letter-spacing: 2px; }

  .menu { display: grid; gap: 9px; }
  .menu button {
    text-align: left; padding: 15px 16px; font-size: 15px;
    background: var(--panel); border: 2px solid var(--line);
    display: flex; align-items: baseline; gap: 12px;
  }
  .menu button:hover:not(:disabled) { background: var(--panel2); }
  .menu .k { color: var(--gold); font-weight: bold; min-width: 18px; }
  .menu .why { margin-left: auto; font-size: 10px; color: var(--dim); }

  /* ---------------------------------------------------- cartão de aviso */
  .fundo { display: none; position: fixed; inset: 0; z-index: 30;
           background: #060810cc; align-items: center; justify-content: center; padding: 18px; }
  .fundo.show { display: flex; }
  .cartaz { width: min(440px, 96vw); background: var(--panel); border: 2px solid var(--gold); padding: 18px; }
  .cartaz h2 { margin: 0 0 4px; font-size: 13px; letter-spacing: 2px; color: var(--gold); }
  .cartaz .sub { font-size: 10px; color: var(--dim); margin-bottom: 14px; }
  .aviso-lista { display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow-y: auto; }
  .aviso {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 11px 12px; background: var(--panel2); border: 1px solid var(--line);
  }
  .aviso:hover { border-color: var(--gold); }
  .aviso .icone { font-size: 16px; }
  .aviso .txt { flex: 1; min-width: 0; font-size: 12px; }
  .aviso .txt b { color: var(--gold); }
  .aviso .tipo { font-size: 9px; letter-spacing: 1px; color: var(--dim); display: block; margin-top: 2px; }

  .detalhe { border: 1px solid var(--line); background: var(--panel2); padding: 14px; }
  .detalhe .frase { font-size: 13px; line-height: 1.6; margin-bottom: 12px; }
  .detalhe .frase b { color: var(--gold); }
  /* O "visto por último" do cartão do amigo. Fica ACIMA do seletor de deck e
     abaixo da frase, porque é contexto da decisão que os botões oferecem, e
     não uma das opções. */
  .detalhe .presenca { font-size: 11px; color: var(--dim); margin: -6px 0 12px;
                       display: flex; align-items: center; gap: 6px; }
  .detalhe .presenca::before { content: ''; width: 6px; height: 6px; border-radius: 50%;
                               background: var(--dim); flex: none; }
  .detalhe .presenca.on { color: var(--green); }
  .detalhe .presenca.on::before { background: var(--green); }
  .detalhe .campo { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 11px; color: var(--dim); }
  .detalhe .campo select { flex: 1; min-width: 0; }
  .botoes { display: flex; gap: 8px; }
  .botoes button { flex: 1; padding: 9px; }
  .botoes .aceitar { border-color: var(--green); color: var(--green); }
  .botoes .recusar { border-color: var(--line2); color: var(--dim); }
  .erro { font-size: 11px; color: var(--red); margin-top: 10px; min-height: 15px; }

  /* Ícone de canto — mesmo padrão do .log-fab do duel.html: um botão
     flutuante que abre um painel, em vez de ocupar espaço fixo na tela. */
  /* No TOPO, e não no rodapé: o rodapé passou a ser a doca dos chats
     (`.chatdoca`), e o atalho do deck ficava exatamente onde a primeira janela
     abre — a de baixo cobriria a de cima, ou o contrário, dependendo do
     `z-index`. Subir foi mais honesto que disputar a mesma faixa da tela. */
  .deck-fab {
    position: fixed; left: calc(var(--lateral) + 16px); top: 16px; z-index: 20;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--line);
    font-size: 20px; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .deck-fab:hover { border-color: var(--gold); }
  .deck-fab .badge {
    position: absolute; top: -4px; right: -4px; min-width: 15px; height: 15px;
    border-radius: 8px; background: var(--red); color: #fff; font-size: 9px;
    font-weight: bold; display: flex; align-items: center; justify-content: center;
    padding: 0 3px; border: 1px solid var(--bg);
  }
  .deck-fab .badge.ok { background: var(--green); }
  /* O `display:flex` acima ganha do `[hidden]` da folha do navegador — sem este
     guarda, o selo aparecia VAZIO em cima do atalho de deck o tempo todo.
     Ver `node web/js/esconder.test.mjs`. */
  .deck-fab .badge[hidden] { display: none; }

  /* O painel abre para BAIXO, colado no botão — ele seguiu o atalho para o
     topo. Fosse mantido no rodapé, o clique abriria uma caixa do outro lado da
     tela, longe de onde a pessoa clicou. */
  .deck-popup {
    display: none; position: fixed; left: calc(var(--lateral) + 16px); top: 68px; z-index: 20;
    width: min(360px, calc(100vw - 32px)); max-height: min(60vh, 420px);
    overflow: auto; background: var(--panel); border: 2px solid var(--gold);
    padding: 14px;
  }
  .deck-popup.show { display: block; }
  .deck-popup h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: 2px; color: var(--dim); font-weight: normal; }

  .deck-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .deck-name { font-size: 17px; color: var(--gold); }
  .deck-counts { color: var(--dim); font-size: 12px; }
  .pill { padding: 1px 7px; font-size: 10px; border: 1px solid; }
  .pill.ok  { color: var(--green); border-color: var(--green); }
  .pill.err { color: var(--red);   border-color: var(--red); }

  .preview { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin-top: 12px; }
  .preview .thumb { cursor: default; }
  .preview .thumb:hover { border-color: var(--line); }

  footer { text-align: center; color: var(--dim); font-size: 10px; margin-top: 18px; }

  /* Sem lateral fixa, o botao do deck volta para o canto da janela. Esta media
     query fica no FIM de proposito: vindo antes da regra de .deck-fab, ela
     perderia na cascata (mesma especificidade) e o botao ficaria deslocado
     numa tela onde nao ha lateral nenhuma para desviar. */
  @media (max-width: 880px) {
    /* Na tela estreita a lateral não é fixa — ela vira um bloco no TOPO —, então
       o atalho no topo cairia por cima do cartão de perfil. Ele volta para o
       rodapé, mas do lado DIREITO: a doca dos chats encosta na esquerda, e o
       canto direito é o único que sobra livre nas duas pontas. */
    .deck-fab  { left: auto; right: 16px; top: auto; bottom: 16px; }
    .deck-popup { left: auto; right: 16px; top: auto; bottom: 68px; }
  }
</style>
</head>
<body>
<div class="home">

  <!-- ============================================================ LATERAL -->
  <aside class="lateral">
    <div class="cartao">
      <div class="eu">
        <button class="avatar" id="btn-icone" title="trocar o ícone do perfil">
          <img id="eu-icone" src="/web/img/icone.png" alt="">
        </button>
        <div class="quem">
          <div class="nome">
            <span id="eu-nome">…</span>
            <span class="etiqueta" id="eu-etiqueta"></span>
            <span class="ponto on" title="você está online"></span>
          </div>
          <div class="dp" id="dp">— DP</div>
        </div>
      </div>
    </div>

    <div class="cartao" style="display:flex; flex-direction:column; flex:1; min-height:0">
      <div class="amigos-topo">
        <h2>AMIGOS</h2>
        <span class="n" id="amigos-n"></span>
      </div>
      <!-- A busca fica ENTRE o cabeçalho e a lista, e não numa tela à parte:
           adicionar alguém é a mesma tarefa que olhar quem já está lá. Antes o
           único caminho era ir ao Multiplayer e digitar a etiqueta. -->
      <div class="busca-amigo">
        <span class="lupa" aria-hidden="true">🔍</span>
        <input type="text" id="busca-amigo" autocomplete="off"
               placeholder="buscar por nome ou etiqueta…"
               title="digite o nome (começo) ou a etiqueta (só números)">
      </div>
      <div class="busca-res" id="busca-res" hidden></div>

      <div class="amigos" id="amigos">
        <div class="vazio">carregando…</div>
      </div>
    </div>

    <!-- O chat global fica ACIMA das notificações e com a mesma cara: os dois
         são "coisas que chegam", e a lateral não deveria ter dois desenhos para
         a mesma ideia. Minimizado, ele é só este botão — é o "ícone de globo"
         do desenho. -->
    <button class="notif-btn" id="btn-chat-global">
      <span class="ic" aria-hidden="true">🌐</span>
      <span class="txt">CHAT GLOBAL</span>
      <span class="cont" id="chat-n">0</span>
    </button>

    <button class="notif-btn" id="btn-notif">
      <span class="txt">SOLICITAÇÕES<br>NOTIFICAÇÃO</span>
      <span class="cont" id="notif-n">0</span>
    </button>
  </aside>

  <!-- A DOCA dos chats. Fica FORA da lateral e presa no rodapé: as janelas
       precisam poder crescer para a direita, lado a lado, sem espremer o menu.
       Ver `web/js/chatdoca.js`. -->
  <div class="chatdoca" id="chatdoca"></div>

  <!-- =========================================================== CONTEÚDO -->
  <main>
    <div class="topline">
      <span class="muted" id="user-tag"></span>

<script type="module">
import { getActiveDeck, listDecks, hydrateDecks } from '/web/js/storage.js';
import { RULES } from '/web/js/deck.js';
import { getDP, totalCards, hydrateWallet } from '/web/js/wallet.js';

import { contaAtual } from '/web/js/supabase.js';
import { montarDoca, abrirConversa, fecharTudo as fecharChats, chegouAlgo } from '/web/js/chatdoca.js';
import {
  meuPerfil, amigos as listarAmigos, desafiar, meusDecks,
  buscar as buscarJogador, pedirAmizade, removerAmigo,
} from '/web/js/multiplayer.js';
import { vigiar, aceitar, recusar } from '/web/js/notificacoesvivo.js';
import { baterPonto } from '/web/js/presenca.js';

import {
  meusIcones, escolherIcone, artesDe,
  caminhoDoIcone, PADRAO,
} from '/web/js/icones.js';

// A rede de seguranca deste boot mora em `/web/js/bootguard.js`, importado por
// uma tag ACIMA desta: um `throw` em qualquer `await` daqui para o modulo
// inteiro, e sem ele a home ficava nos "carregando…" de fabrica para sempre,
// sem erro em lugar nenhum. Ele nao conserta causa — cada uma se guarda no
// lugar dela; ele conserta o silencio.
// A Site URL do projeto aponta para a raiz, entao um link de recuperacao que o
// Supabase nao redirecionou para recuperar.html cai AQUI. Precisa vir antes do
// requireLogin: o redirect dele para o login descartaria o fragmento da URL, e
// com ele o token do link.
if (desviarParaRecuperacao()) throw new Error('indo para a recuperacao');

// Sem sessão, redireciona pro login e para aqui — wallet/decks são dados de
// CONTA, não dá pra hidratar antes de saber de quem é a sessão.
const username = await requireLogin();
if (!username) throw new Error('redirecionando para login');

// Hidratar e' encher um CACHE, e cache que falha nao e' motivo para nao ter
// home: sem a carteira o jogador ve o ultimo DP conhecido, sem os decks ve os
// que aquele navegador ja' tinha. Sem o `catch` era o oposto — um deck torto
// guardado no navegador (`new Deck(d)`) ou uma gravacao recusada derrubavam a
// TELA INTEIRA, e a home nao passava de 'carregando…'.
//
// `requireLogin()` acima nao ganha o mesmo tratamento de proposito: ali o
// desfecho de nao saber quem e' o jogador e' ir para o login, nunca desenhar a
// home de ninguem.
async function tolerar(oque, fn) {
  try { return await fn(); }
  catch (e) { console.warn(`[home] ${oque} falhou; seguindo com o que ja' estava aqui`, e); return null; }
}
await tolerar('a carteira', hydrateWallet);   // DP + coleção
await tolerar('os decks', hydrateDecks);      // decks/users/<u>/player/*.ydk

const $ = (id) => document.getElementById(id);
const ART = (id) => `https://images.ygoprodeck.com/images/cards_small/${id}.jpg`;

const toast = (t) => {
  const el = $('toast');
  el.textContent = t;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2600);
};

// ------------------------------------------------------------------ deck
function render() {
  $('dp').textContent = `${getDP()} DP`;
  const deck = getActiveDeck();
  const badge = $('deck-badge');

  if (!deck) {
    $('deck-info').innerHTML =
      `<span class="muted">Nenhum deck ainda. Compre boosters na Loja e monte um no Deck Builder.</span>`;
    $('preview').replaceChildren();
    badge.hidden = false;
    badge.className = 'badge';
    badge.textContent = '!';
    return;
  }

  const v = deck.validate();
  badge.hidden = false;
  badge.className = 'badge' + (v.valid ? ' ok' : '');
  badge.textContent = v.valid ? '✓' : '!';
  $('deck-info').innerHTML = `
    <div class="deck-line">
      <span class="deck-name"></span>
      <span class="deck-counts">
        Main <b>${deck.main.length}</b>/${RULES.MAIN_MIN}–${RULES.MAIN_MAX}
        &nbsp;·&nbsp; Extra <b>${deck.extra.length}</b>/${RULES.EXTRA_MAX}
      </span>
      <span class="pill ${v.valid ? 'ok' : 'err'}">${v.valid ? 'VÁLIDO' : 'INCOMPLETO'}</span>
    </div>
    ${v.valid ? '' : `<div class="muted" style="margin-top:6px">${v.errors[0]}</div>`}`;
  $('deck-info').querySelector('.deck-name').textContent = deck.name;

  const frag = document.createDocumentFragment();
  for (const id of deck.main.slice(0, 20)) {
    const d = document.createElement('div');
    d.className = 'thumb';
    d.innerHTML = `<img loading="lazy" src="${ART(id)}" alt="">`;
    frag.append(d);
  }
  $('preview').replaceChildren(frag);
}

$('btn-deck-fab').onclick = (e) => {
  e.stopPropagation();
  $('deck-popup').classList.toggle('show');
};
document.addEventListener('click', (e) => {
  const popup = $('deck-popup');
  if (popup.classList.contains('show') && !popup.contains(e.target)) popup.classList.remove('show');
});

// ------------------------------------------------------------- navegação
$('user-tag').textContent = username;
$('eu-nome').textContent = username;
$('btn-logout').onclick = async () => { await logout(); location.href = '/web/login.html'; };

$('btn-shop').onclick = () => (location.href = '/web/loja.html');
$('btn-deck').onclick = () => (location.href = '/web/deck.html?owned=1');
$('btn-inv').onclick = () => (location.href = '/web/inventario.html');
$('btn-adv').onclick = () => (location.href = '/web/trilha.html');
$('btn-mp').onclick = () => (location.href = '/web/multiplayer.html');
$('btn-test').onclick = () => (location.href = '/web/teste.html');

document.addEventListener('keydown', (e) => {
  // Com o cartão aberto, os números seriam atalhos para SAIR da tela em cima de
  // um convite com prazo. Esc fecha; o resto espera.
  if ($('fundo').classList.contains('show')) {
    if (e.key === 'Escape') fecharCartaz();
    return;
  }
  if (e.key === '1') $('btn-shop').click();
  if (e.key === '2') $('btn-deck').click();
  if (e.key === '3') $('btn-inv').click();
  if (e.key === '4') $('btn-adv').click();
  if (e.key === '5') $('btn-mp').click();
});

// ------------------------------------------------------------- presença
// O contador do canto e o meu próprio "estou vivo" saem da MESMA chamada
// (`bater_ponto`): a home precisa dos dois, e separá-los seria uma segunda ida
// de rede a cada 45s para saber um número que acabou de ser calculado.
// A classe frio NAO e mexida aqui: ela diz se o canal de tempo real esta de pe,
// e quem sabe disso e o vigiar(). Misturar as duas faria o pontinho de ao vivo
// acender por causa de um contador que chegou por outro caminho.
baterPonto((n) => { $('online-n').textContent = String(n); });

// A lista crua de `meus_amigos` (amigos E pedidos), como veio do banco. A busca
// a consulta para saber o que oferecer em cada resultado.
let amigosAgora = [];

// O MEU id. O chat precisa dele para separar "eu" das outras pessoas na
// conversa — e é a única coisa da sessão que a doca usa. Preenchido no boot,
// abaixo; até lá, toda mensagem é desenhada como de outra pessoa, que é o erro
// barato dos dois (o contrário mostraria o nome errado).
let meuId = null;

// --------------------------------------------------------------- amigos
// A lista vem do banco (`meus_amigos`, migration 0034), já com `online` e já
// ordenada — quem tem pedido pendente primeiro, depois quem está online. A
// ordem mora lá porque esta tela e a de Multiplayer precisam concordar.
let decksDoBanco = [];

async function pintarAmigos() {
  const r = await listarAmigos();
  const caixa = $('amigos');
  if (!r.ok) {
    // Sem rede, o que já estava na tela continua valendo. Só a primeira carga
    // mostra o aviso, porque aí não há nada para preservar.
    if (!caixa.querySelector('.amigo')) {
      caixa.replaceChildren(Object.assign(document.createElement('div'),
        { className: 'vazio', textContent: 'não consegui ler a lista de amigos agora.' }));
    }
    return;
  }

  // A lista CRUA (com os pedidos pendentes) fica guardada: a busca precisa dela
  // para não oferecer "adicionar" a quem já é amigo ou já tem pedido em aberto.
  amigosAgora = r.dados ?? [];
  const lista = amigosAgora.filter((a) => a.direcao === 'amigo');
  $('amigos-n').textContent = lista.length
    ? `${lista.filter((a) => a.online).length}/${lista.length} online` : '';

  if (!lista.length) {
    caixa.replaceChildren(Object.assign(document.createElement('div'), {
      className: 'vazio',
      textContent: 'nenhum amigo ainda — adicione pela etiqueta no Multiplayer.',
    }));
    return;
  }

  const frag = document.createDocumentFragment();
  for (const a of lista) {
    const b = document.createElement('button');
    b.className = 'amigo' + (a.online ? ' on' : '');
    // O OFFLINE voltou a ser clicável (23/08/2026). Ele foi desabilitado porque
    // desafiar quem está com o jogo fechado é gastar um convite que expira em 10
    // minutos — e isso continua verdade: quem decide é o cartão, que só oferece
    // "chamar" para quem está online. O que a trava fazia junto, sem querer, era
    // impedir REMOVER um amigo offline: a única porta para isso é este clique, e
    // ela estava fechada justamente para quem não está jogando — que é a maioria
    // da lista na maior parte do tempo.
    // O "visto por último" entra aqui e no cartão, e não como uma linha fixa na
    // lista: a lateral é estreita e a lista rola, então uma segunda linha por
    // amigo empurraria para fora da tela justamente os que estão online (que
    // vêm primeiro). Quem está ONLINE não ganha a frase — o carimbo dele é de
    // no máximo dois minutos atrás, e "visto hoje às 15:00" ao lado de um selo
    // verde escrito ONLINE só disputa a atenção com ele.
    const visto = a.online ? null : textoVistoEm(a.visto_em);
    b.title = a.online
      ? `${a.usuario} — desafiar ou remover`
      : visto ? `${a.usuario} — visto por último ${visto} · abrir para remover`
              : `${a.usuario} está offline — abrir para remover`;
    // O ícone do amigo vem como `icone_id` (`meus_amigos`), não como arquivo: a
    // policy de `perfis` só deixa cada um ver o próprio registro, então quem
    // cruza o id com a arte é o catálogo, que é de leitura aberta.
    b.innerHTML = `<span class="mini"><img alt="" src="${caminhoDoIcone(arteDoIcone.get(a.icone_id))}"></span>`
      + `<span class="nome"></span>`
      + `<span class="estado">${a.online ? 'ONLINE' : 'OFFLINE'}</span>`
      + `<span class="ponto${a.online ? ' on' : ''}"></span>`;
    b.querySelector('.nome').textContent = `[${a.etiqueta}] ${a.usuario}`;
    b.onclick = () => abrirDesafio(a);
    frag.append(b);
  }
  caixa.replaceChildren(frag);
}

/**
 * O cartão do amigo: chamar para duelar e/ou REMOVER da lista.
 *
 * Os dois moram no mesmo lugar porque a porta é a mesma — o clique no amigo. E
 * "chamar" só aparece para quem está ONLINE: o convite expira em 10 minutos, e
 * oferecê-lo a quem está com o jogo fechado é prometer o que não acontece.
 * Remover vale sempre; era justamente isso que não tinha porta nenhuma antes.
 */
function abrirDesafio(amigo) {
  const corpo = document.createElement('div');
  corpo.className = 'detalhe';
  corpo.innerHTML = `<div class="frase">${amigo.online ? 'Chamar <b></b> para um duelo.'
                                                       : '<b></b> está offline.'}</div>`;
  corpo.querySelector('b').textContent = `[${amigo.etiqueta}] ${amigo.usuario}`;

  // VISTO POR ÚLTIMO. É aqui que ele mais vale: "OFFLINE" é a resposta para
  // quase todo mundo quase o tempo todo, e não separa quem fechou o jogo há
  // cinco minutos de quem não entra há três semanas — que são decisões
  // diferentes na hora de chamar para duelar, mandar mensagem ou remover.
  //
  // O carimbo vem do BANCO (`meus_amigos.visto_em`, migration 0049), nunca de
  // uma conta local: a policy de `perfis` não deixa o navegador ler o
  // `visto_em` de ninguém, e mesmo que deixasse, "há 3 dias" medido contra o
  // relógio da máquina teria o mesmo defeito que fez o `online` nascer no
  // servidor — dois clientes discordando, cada um certo pela sua conta.
  //
  // Sem carimbo (servidor anterior à 0049) a linha simplesmente não aparece:
  // `textoVistoEm` devolve `null` em vez de "Invalid Date".
  const quando = textoVistoEm(amigo.visto_em);
  if (amigo.online || quando) {
    const presenca = document.createElement('div');
    presenca.className = 'presenca' + (amigo.online ? ' on' : '');
    presenca.textContent = amigo.online
      ? `online agora · visto por último ${quando ?? 'há pouco'}`
      : `visto por último ${quando}`;
    corpo.append(presenca);
  }

  if (amigo.online) corpo.append(campoDeDeck());

  const botoes = document.createElement('div');
  botoes.className = 'botoes';
  botoes.innerHTML = (amigo.online ? '<button class="aceitar">chamar</button>' : '')
    + '<button class="conversar">abrir chat</button>'
    + '<button class="remover">remover amigo</button>'
    + '<button class="recusar">fechar</button>';
  botoes.querySelector('.recusar').onclick = () => fecharCartaz();

  // ABRIR CHAT vale para quem está offline também — a mensagem fica lá e ele lê
  // quando entrar. É a diferença entre conversa e desafio: o convite de duelo
  // expira em 10 minutos, a conversa não expira.
  botoes.querySelector('.conversar').onclick = () => {
    fecharCartaz();
    abrirConversa({
      chave: amigo.id, titulo: amigo.usuario, para: amigo.id,
      icone: '💬', euSou: meuId,
    });
  };

  // Remover pede confirmação: é a única ação desta lateral que DESFAZ alguma
  // coisa, e o alvo é um botão pequeno numa lista que rola.
  botoes.querySelector('.remover').onclick = async (e) => {
    if (!confirm(`Remover [${amigo.etiqueta}] ${amigo.usuario} da sua lista de amigos?`)) return;
    e.target.disabled = true;
    const r = await removerAmigo(amigo.id);
    e.target.disabled = false;
    if (!r.ok) return void erro(r.erro ?? 'nao consegui remover agora');
    // A lista vem do BANCO, então redesenhar é reler — tirar a linha na mão
    // deixaria a tela e o servidor discordando se a remoção tivesse falhado
    // pela metade.
    await pintarAmigos();
    abrirNotificacoes();
  };
  if (!amigo.online) { corpo.append(botoes); mostrarCartaz('AMIGO', 'ele não está com o jogo aberto agora', corpo); return; }
  botoes.querySelector('.aceitar').onclick = async (e) => {
    const deck = corpo.querySelector('select')?.value;
    if (!deck) return void erro('escolha um deck para chamar alguém');
    e.target.disabled = true;
    const r = await desafiar(amigo.id, deck);
    e.target.disabled = false;
    if (!r.ok) return void erro(r.erro);
    // Vai para o MULTIPLAYER, e isto não é preguiça de fazer aqui: quem
    // desafia precisa ser levado ao duelo no instante em que o outro aceita, e
    // essa espera já existe lá (o pintarPartida com o aguardavaSala). Ficando na
    // home, o convite seria aceito do outro lado e o desafiante continuaria
    // parado olhando o menu — a falha calada de sempre. Duplicar o vaivém aqui
    // daria dois caminhos para o mesmo estado, e eles divergiriam.
    location.href = '/web/multiplayer.html';
  };
  corpo.append(botoes);

  mostrarCartaz('DESAFIAR', 'ele recebe o convite na hora, na tela dele', corpo);
}

/**
 * O seletor de deck. Vem do BANCO (`decks_jogador`), não do localStorage: é o
 * deck do banco que a partida usa, e oferecer um nome que só existe neste
 * navegador daria um erro do servidor no momento menos oportuno.
 */
function campoDeDeck() {
  const campo = document.createElement('div');
  campo.className = 'campo';
  campo.innerHTML = '<span>seu deck:</span>';
  const sel = document.createElement('select');
  if (!decksDoBanco.length) {
    sel.append(new Option('nenhum deck salvo no servidor', ''));
    sel.disabled = true;
  } else {
    for (const n of decksDoBanco) sel.append(new Option(n, n));
    // O deck ativo daqui costuma ser o que a pessoa quer usar; se ele existe no
    // banco, já vem escolhido.
    const ativo = getActiveDeck()?.name;
    if (ativo && decksDoBanco.includes(ativo)) sel.value = ativo;
  }
  campo.append(sel);
  return campo;
}

// ---------------------------------------------------- buscar e adicionar
//
// A busca por NOME ou ETIQUETA, e o clique que manda o pedido. Quem responde é
// o banco (`buscar_jogador`): nome pelo começo ou etiqueta exata, sempre sem
// você mesmo, no máximo 20. Digitar menos de 2 caracteres não consulta nada — é
// a mesma trava que a função tem do lado de lá, repetida aqui só para não fazer
// a viagem.
//
// O resultado NÃO diz se a pessoa já é sua amiga: `buscar_jogador` responde o
// que a policy de `perfis` permitiria a qualquer um, e cruzar isso com a sua
// lista é trabalho de tela. Sem esse cruzamento, o botão prometeria "adicionar"
// para quem já está na lista e o servidor devolveria um erro que ninguém pediu.
let buscaEmAndamento = 0;

async function pintarBusca() {
  const termo = $('busca-amigo').value.trim();
  const caixa = $('busca-res');

  if (termo.length < 2) { caixa.hidden = true; caixa.replaceChildren(); return; }

  // Cada digitada dispara uma consulta, e elas voltam fora de ordem. O selo diz
  // qual é a mais recente: uma resposta velha chegando depois pintaria na tela o
  // resultado de um termo que ninguém está mais buscando.
  const meu = ++buscaEmAndamento;
  const r = await buscarJogador(termo);
  if (meu !== buscaEmAndamento) return;

  caixa.hidden = false;
  if (!r.ok) {
    caixa.replaceChildren(Object.assign(document.createElement('div'),
      { className: 'vazio', textContent: 'não consegui buscar agora.' }));
    return;
  }

  // Quem já está na sua lista (amigo, pedido enviado ou recebido) não pode
  // aparecer como "adicionar": o servidor recusaria, e o rótulo teria mentido.
  const jaTenho = new Map((amigosAgora ?? []).map((a) => [a.id, a.direcao]));
  const achados = r.dados ?? [];

  if (!achados.length) {
    caixa.replaceChildren(Object.assign(document.createElement('div'),
      { className: 'vazio', textContent: `ninguém com "${termo}".` }));
    return;
  }

  const frag = document.createDocumentFragment();
  for (const j of achados) {
    const estado = jaTenho.get(j.id);
    const b = document.createElement('button');
    b.className = 'achado';
    b.innerHTML = '<span class="nome"></span><span class="mais"></span>';
    b.querySelector('.nome').textContent = `[${j.etiqueta}] ${j.usuario}`;
    b.querySelector('.mais').textContent =
      estado === 'amigo' ? 'já é amigo'
      : estado === 'enviado' ? 'pedido enviado'
      : estado === 'recebido' ? 'te chamou' : '+ adicionar';
    b.disabled = !!estado;
    if (!estado) {
      b.onclick = async () => {
        b.disabled = true;
        const p = await pedirAmizade(j.etiqueta);
        if (!p.ok) {
          // NA PRÓPRIA LINHA, e não pelo `erro()`: aquele escreve no
          // `#cartaz-erro`, que só está visível com o cartaz aberto — e a busca
          // mora na lateral. A falha ficaria invisível.
          b.disabled = false;
          b.querySelector('.mais').textContent = p.erro ?? 'não deu certo';
          return;
        }
        b.querySelector('.mais').textContent = 'pedido enviado';
        // Relê a lista: o pedido enviado passa a aparecer nela, e é isso que faz
        // uma segunda busca já saber que ele existe.
        await pintarAmigos();
      };
    }
    frag.append(b);
  }
  caixa.replaceChildren(frag);
}

// Espera a digitada parar. Sem isto, cada tecla vira uma consulta ao banco — e a
// busca por nome roda um `ilike` na tabela de perfis inteira.
let buscaTimer = null;
$('busca-amigo').addEventListener('input', () => {
  clearTimeout(buscaTimer);
  buscaTimer = setTimeout(pintarBusca, 250);
});
// Esc limpa: a caixa de resultados fica entre o cabeçalho e a lista de amigos, e
// deixá-la aberta empurra a lista para baixo.
$('busca-amigo').addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  $('busca-amigo').value = '';
  $('busca-res').hidden = true;
  $('busca-res').replaceChildren();
});

// ------------------------------------------------------------------ chat
//
// O botão do globo é um INTERRUPTOR: aberto, minimiza; minimizado, volta. É o
// mesmo gesto da barra da janela, e é o que o desenho pede — "senão fica
// minimizado, com um ícone de globo".
montarDoca($('chatdoca'), (chave, n) => {
  if (chave === 'global') pintarSelo($('chat-n'), $('btn-chat-global'), n);
});

$('btn-chat-global').onclick = () => abrirConversa({
  chave: 'global', titulo: 'CHAT GLOBAL', para: null, icone: '🌐', euSou: meuId,
});

/** O selo de não lidas, no mesmo desenho do de notificações. */
function pintarSelo(alvo, botao, n) {
  alvo.textContent = String(n ?? 0);
  botao.classList.toggle('tem', (n ?? 0) > 0);
}

// --------------------------------------------------------- notificações
let notificacoes = [];

function mostrarCartaz(titulo, sub, corpo) {
  $('cartaz-titulo').textContent = titulo;
  $('cartaz-sub').textContent = sub;
  $('cartaz-corpo').replaceChildren(corpo);
  $('cartaz-erro').textContent = '';
  $('fundo').classList.add('show');
}

const fecharCartaz = () => $('fundo').classList.remove('show');
const erro = (t) => { $('cartaz-erro').textContent = t ?? 'não deu certo'; };

$('btn-fechar').onclick = fecharCartaz;
$('fundo').onclick = (e) => { if (e.target === $('fundo')) fecharCartaz(); };
$('btn-notif').onclick = () => abrirNotificacoes();

/** A LISTA de notificações. Clicar numa abre o cartão dela. */
function abrirNotificacoes() {
  const corpo = document.createElement('div');
  corpo.className = 'aviso-lista';

  if (!notificacoes.length) {
    corpo.innerHTML = '<div class="vazio">nada esperando resposta agora.</div>';
  } else {
    for (const n of notificacoes) {
      const b = document.createElement('button');
      b.className = 'aviso';
      b.innerHTML = `<span class="icone">${n.tipo === 'duelo' ? '⚔️' : '🤝'}</span>`
        + `<span class="txt"><b></b><span class="tipo">${
             n.tipo === 'duelo' ? 'CHAMOU VOCÊ PARA DUELAR' : 'QUER TE ADICIONAR'}</span></span>`;
      b.querySelector('b').textContent = `[${n.quem.etiqueta}] ${n.quem.usuario}`;
      b.onclick = () => abrirNotificacao(n);
      corpo.append(b);
    }
  }

  mostrarCartaz('NOTIFICAÇÕES',
                notificacoes.length ? 'clique numa para responder' : 'o que está esperando a sua resposta',
                corpo);
}

/** O cartão de UMA notificação: o que é, e aceitar/recusar. */
function abrirNotificacao(n) {
  const corpo = document.createElement('div');
  corpo.className = 'detalhe';

  const frase = document.createElement('div');
  frase.className = 'frase';
  frase.innerHTML = n.tipo === 'duelo'
    ? '<b></b> chamou você para um duelo.<br><span class="muted" style="font-size:11px">'
      + 'O convite vale por 10 minutos.</span>'
    : '<b></b> quer te adicionar como amigo.<br><span class="muted" style="font-size:11px">'
      + 'Aceitando, ele entra na sua lista aqui ao lado.</span>';
  frase.querySelector('b').textContent = `[${n.quem.etiqueta}] ${n.quem.usuario}`;
  corpo.append(frase);

  // Só o duelo precisa de deck — e ele precisa ANTES de aceitar: o banco recusa
  // um aceite sem baralho, e perguntar depois deixaria a partida de pé com um
  // dos lados sem deck.
  if (n.tipo === 'duelo') corpo.append(campoDeDeck());

  const botoes = document.createElement('div');
  botoes.className = 'botoes';
  botoes.innerHTML = `<button class="aceitar">aceitar</button>`
                   + `<button class="recusar">recusar</button>`;

  botoes.querySelector('.aceitar').onclick = async (e) => {
    e.target.disabled = true;
    const deck = corpo.querySelector('select')?.value || null;
    const r = await aceitar(n, deck);
    e.target.disabled = false;
    if (!r.ok) return void erro(r.erro);
    if (r.ir) { location.href = r.ir; return; }
    fecharCartaz();
    toast(`${n.quem.usuario} agora é seu amigo`);
    pintarAmigos();
  };

  botoes.querySelector('.recusar').onclick = async (e) => {
    e.target.disabled = true;
    const r = await recusar(n);
    e.target.disabled = false;
    if (!r.ok) return void erro(r.erro);
    fecharCartaz();
    toast('recusado');
    pintarAmigos();
  };

  corpo.append(botoes);
  mostrarCartaz(n.tipo === 'duelo' ? 'DESAFIO' : 'PEDIDO DE AMIZADE',
                'responda aqui mesmo', corpo);
}

function pintarNotificacoes(lista, { novas, tempoReal }) {
  notificacoes = lista;
  const btn = $('btn-notif');
  $('notif-n').textContent = String(lista.length);
  btn.classList.toggle('tem', lista.length > 0);
  $('online-agora').classList.toggle('frio', !tempoReal);

  // Chegou coisa nova enquanto a pessoa olhava outra coisa: o toast diz o quê,
  // sem roubar o clique dela. O cartão só abre por vontade de quem clica.
  for (const n of novas ?? []) {
    toast(n.tipo === 'duelo'
      ? `${n.quem.usuario} chamou você para duelar`
      : `${n.quem.usuario} quer te adicionar`);
  }

  // Um pedido de amizade aceito/recusado do outro lado muda a lista de amigos
  // também — redesenhar aqui é o que faz o ponto verde aparecer sem F5.
  if ((novas ?? []).length) pintarAmigos();
}

// --------------------------------------------------------------- ícones
// O catálogo é de leitura aberta e muda pouco, então é lido UMA vez no boot: é
// dele que sai a arte do meu ícone e a dos amigos (a lista de amigos traz só o
// `icone_id`, porque a policy de `perfis` não deixaria ver o resto).
let arteDoIcone = new Map();

/** Desenha o meu ícone no slot. `null` cai no padrão do jogo. */
function pintarMeuIcone(id) {
  $('eu-icone').src = caminhoDoIcone(arteDoIcone.get(id));
}

/**
 * A escolha. Mostra o catálogo inteiro, com o que você NÃO tem apagado e não
 * clicável — ver o que dá para conseguir é metade da graça de ter coleção, e é
 * o que vai levar alguém à Loja quando ela vender cosméticos.
 *
 * Quem decide se você pode usar é o SERVIDOR (`escolher_icone` mais o gatilho
 * `perfis_icone_valido`): esta tela desabilitar o botão é conveniência, não
 * trava. Uma trava que vive só aqui é uma trava que não existe.
 */
async function abrirIcones() {
  const r = await meusIcones();
  if (!r.ok) return void toast('não consegui ler os ícones agora');

  const lista = r.dados ?? [];
  const corpo = document.createElement('div');

  if (!lista.length) {
    corpo.innerHTML = '<div class="vazio">nenhum ícone no jogo ainda.</div>';
    return void mostrarCartaz('ÍCONE DO PERFIL', 'nada para escolher', corpo);
  }

  const grade = document.createElement('div');
  grade.className = 'icone-grade';

  for (const i of lista) {
    const b = document.createElement('button');
    b.className = 'icone-op' + (i.em_uso ? ' atual' : '');
    b.disabled = !i.tenho;
    b.title = i.tenho ? i.nome
            : i.na_loja ? `${i.nome} — ${i.preco} DP na Loja`
                        : `${i.nome} — você ainda não tem`;
    const img = document.createElement('img');
    img.src = caminhoDoIcone(i);
    img.alt = '';
    // A arte pode não ter viajado no Release (o ícone é cadastrado no banco, a
    // imagem vem no game.zip). Sem isto ficaria o quadrado quebrado do
    // navegador, que parece falha de rede.
    img.onerror = () => { img.src = PADRAO; };
    const rot = document.createElement('span');
    rot.className = 'rot';
    rot.textContent = i.nome;
    b.append(img, rot);
    b.onclick = async () => {
      const x = await escolherIcone(i.id);
      if (!x.ok) return void erro(x.erro);
      // O mapa só conhece as artes que a home pediu no boot (a minha e a dos
      // amigos). Sem guardar a nova aqui, escolher um ícone o desenharia como
      // o padrão até o próximo F5 — parecendo que a escolha não pegou.
      if (i.imagem) arteDoIcone.set(i.id, i.imagem);
      pintarMeuIcone(i.id);
      fecharCartaz();
      toast(`ícone: ${i.nome}`);
      // A lista de amigos mostra o SEU ícone para os outros, não para você —
      // mas o cache do catálogo é o mesmo, então redesenhar mantém tudo coerente
      // se você for amigo de si mesmo em teste.
      pintarAmigos();
    };
    grade.append(b);
  }

  corpo.append(grade);
  const tenho = lista.filter((i) => i.tenho).length;
  mostrarCartaz('ÍCONE DO PERFIL',
                `${tenho} de ${lista.length} — os apagados você ainda não tem`, corpo);
}

$('btn-icone').onclick = abrirIcones;

// ------------------------------------------------------------------ boot
render();

// As ARTES antes dos amigos, de propósito: é delas que sai o avatar de cada
// `icone_id`, e desenhar a lista sem elas mostraria todo mundo com o ícone
// padrão por um instante — um pisca que parece "perdi meu ícone".
//
// As artes de quem aparece na tela: a minha e a dos amigos. Trazer o catálogo
// inteiro seria baixar a coleção de ícones (até 40 KB cada) a cada abertura da
// home para desenhar meia dúzia deles.
//
// O perfil é lido UMA vez e reaproveitado: ele dá o nome, a etiqueta e o meu
// `icone_id`, e pedir de novo seria uma segunda ida de rede pelo mesmo dado.
const meuPerfilAgora = await meuPerfil().catch(() => null);
meuId = (await contaAtual().catch(() => null))?.id ?? null;
if (meuPerfilAgora?.etiqueta) $('eu-etiqueta').textContent = `[${meuPerfilAgora.etiqueta}]`;
if (meuPerfilAgora?.usuario) {
  $('eu-nome').textContent = meuPerfilAgora.usuario;
  $('user-tag').textContent = meuPerfilAgora.usuario;
}

// A Área de Teste é das ferramentas de quem administra o jogo, e todas elas
// publicam conteúdo — a RLS (`eh_admin()`) recusa o resto. O botão NASCE
// escondido no HTML e só aparece aqui: ao contrário, ele piscaria na tela de
// todo jogador no intervalo entre o boot e a resposta do perfil.
//
// Isto é a porta; a fechadura continua no servidor, e cada página da Área de
// Teste tem o seu próprio `requireAdmin()` — quem digitar o endereço na barra
// volta para cá.
$('btn-test').hidden = !meuPerfilAgora?.admin;

try {
  const amigosAgora = await listarAmigos();
  arteDoIcone = await artesDe([meuPerfilAgora?.icone_id,
                               ...(amigosAgora.dados ?? []).map((x) => x.icone_id)]);
} catch { /* sem as artes, todo mundo fica com o ícone padrão do jogo */ }
pintarMeuIcone(meuPerfilAgora?.icone_id ?? null);

meusDecks().then((d) => { decksDoBanco = d; });
pintarAmigos();
// O segundo argumento é o chat: `mensagens` chega pelo MESMO canal, e a doca
// relê por conta dela quando avisada. Sem isto o chat funcionaria só pela
// releitura de 8s — que é a rede de segurança, não o caminho principal.
vigiar(pintarNotificacoes, () => chegouAlgo());

// Sair leva as janelas junto: elas são `position: fixed` e sobreviveriam à
// navegação da SPA que não existe — mas o `fecharTudo` também para os relógios
// de releitura, que continuariam consultando o banco de uma tela que ninguém
// está mais vendo.
window.addEventListener('pagehide', () => fecharChats());

// A presença dos amigos expira em 2 minutos no banco, então a lista precisa ser
// relida de tempos em tempos — o Realtime avisa de amizade nova, nunca de
// "fulano fechou o jogo", que não é um evento: é a ausência de um.
setInterval(pintarAmigos, 45_000);

try {
  const meta = await (await fetch('/ygo-data/data/meta.json')).json();
  $('foot').textContent =
    `sua Coleção: ${totalCards()} cartas · banco: ${meta.counts.cards.toLocaleString('pt-BR')} cartas`;
} catch {
  $('foot').textContent = `sua Coleção: ${totalCards()} cartas`;
}
</script>

     O terminal deixou de existir, entao e' a PAGINA que diz "ainda estou
     aqui". Toda tela de web/ precisa desta linha — `web/js/vivo.test.mjs`
     reprova quem a esquecer. Ver o cabecalho de `web/js/vivo.js`. -->
<script type="module">import { manterVivo } from '/web/js/vivo.js'; manterVivo();</script>
<script type="module">import { exigirVersao } from '/web/js/versao.js'; exigirVersao();</script>
