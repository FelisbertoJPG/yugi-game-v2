<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personagens — Classic Duels</title>
<link rel="icon" href="/web/img/icone.png">
<link rel="stylesheet" href="/web/css/ui.css">
<style>
  /* O guarda geral do `hidden`. O atributo é uma regra da folha do NAVEGADOR,
     a especificidade mais baixa que existe, e qualquer `display` nosso ganha
     dela — o elemento fica na tela com `el.hidden === true` e sem erro nenhum.
     Ver `web/js/esconder.test.mjs`. */
  [hidden] { display: none !important; }

  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  .corpo { flex: 1; display: flex; min-height: 0; }

  /* O palco do 3D. A escolha do personagem se julga OLHANDO, então ele ocupa a
     metade da tela e o catálogo fica ao lado — nunca por cima. É a mesma
     decisão da MIRA do ataque e do vestiário do Mundo: um vidro sobre o boneco
     no único momento em que o que importa é o boneco seria escolher às cegas. */
  #palco { flex: 1; position: relative; min-width: 0; background: #0e1119; }
  #palco canvas { display: block; width: 100%; height: 100%; }
  #semwebgl { position: absolute; inset: 0; display: flex; align-items: center;
              justify-content: center; text-align: center; padding: 24px; color: var(--dim); }
  #nome-atual { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center;
                font-size: 15px; font-weight: bold; color: var(--gold); pointer-events: none;
                text-shadow: 0 2px 8px #000; }
  #girar { position: absolute; left: 12px; bottom: 12px; font-size: 11px; color: var(--dim); }

  aside { width: 340px; border-left: 1px solid var(--line); background: var(--bg2);
          display: flex; flex-direction: column; min-height: 0; }
  aside header { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--dim); }
  #catalogo { flex: 1; overflow-y: auto; padding: 10px; display: grid;
           grid-template-columns: repeat(3, 1fr); gap: 8px; align-content: start; }

  .cartao { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
            padding: 6px 4px 8px; cursor: pointer; text-align: center; color: var(--fg);
            font: inherit; font-size: 11px; display: flex; flex-direction: column; gap: 5px; }
  .cartao:hover { border-color: var(--gold); }
  .cartao.escolhido { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .cartao .rosto { width: 100%; aspect-ratio: 1; border-radius: 6px; background: #0e1119;
                   image-rendering: pixelated; object-fit: cover; }
  .cartao .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  aside footer { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  aside footer button { flex: 1; }

  /* "Faltar é normal" precisa ser DITO. Sem o `.glb` do corpo não há personagem
     para escolher, e uma grade vazia é indistinguível de uma tela quebrada. */
  #semcorpo { padding: 14px; font-size: 12px; color: var(--dim); line-height: 1.6; }
</style>
</head>
<body>

<div class="topbar">
  <h1>▚ PERSONAGENS</h1>
  <span class="sub" id="sub">quem é você no Mundo</span>
  <span class="spacer"></span>
  <button id="btn-mundo">ir ao Mundo</button>
  <button id="btn-home">home</button>
</div>

<div class="corpo">
  <div id="palco">
    <canvas id="cv"></canvas>
    <div id="nome-atual"></div>
    <div id="girar">arraste para girar</div>
    <div id="semwebgl" hidden>
      Este navegador não abriu o 3D (WebGL). O personagem continua sendo escolhido
      pela lista ao lado — só a prévia não aparece.
    </div>
  </div>

  <aside>
    <header id="cabecalho">carregando…</header>
    <div id="semcorpo" hidden></div>
    <div id="catalogo"></div>
    <footer>
      <button id="btn-usar" class="primary" disabled>usar este personagem</button>
    </footer>
  </aside>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="/web/js/bootguard.js"></script>
<script type="module" src="/web/js/personagenspagina.js"></script>
<script type="module">import { manterVivo } from '/web/js/vivo.js'; manterVivo();</script>
<script type="module">import { exigirVersao } from '/web/js/versao.js'; exigirVersao();</script>
</body>
</html>
