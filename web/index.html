<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duel Academy — Home</title>
<link rel="stylesheet" href="/web/css/ui.css">
<style>
  body {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 50% 0%, #1b2438 0%, var(--bg) 60%);
  }
  .home { width: min(760px, 94vw); }
  .title {
    text-align: center; margin-bottom: 22px;
    border-bottom: 2px solid var(--line); padding-bottom: 16px;
  }
  .title h1 {
    margin: 0; font-size: 30px; letter-spacing: 5px; color: var(--gold);
    text-shadow: 0 2px 0 #0008;
  }
  .title p { margin: 6px 0 0; color: var(--dim); font-size: 11px; letter-spacing: 2px; }

  .slot {
    background: var(--panel); border: 2px solid var(--line);
    padding: 14px; margin-bottom: 16px;
  }
  .slot h2 {
    margin: 0 0 10px; font-size: 11px; letter-spacing: 2px; color: var(--dim);
    font-weight: normal;
  }
  .deck-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .deck-name { font-size: 17px; color: var(--gold); }
  .deck-counts { color: var(--dim); font-size: 12px; }
  .pill {
    padding: 1px 7px; font-size: 10px; border: 1px solid;
  }
  .pill.ok  { color: var(--green); border-color: var(--green); }
  .pill.err { color: var(--red);   border-color: var(--red); }

  .menu { display: grid; gap: 9px; }
  .menu button {
    text-align: left; padding: 13px 16px; font-size: 14px;
    background: var(--panel); border: 2px solid var(--line);
    display: flex; align-items: baseline; gap: 12px;
  }
  .menu button:hover:not(:disabled) { background: var(--panel2); }
  .menu .k { color: var(--gold); font-weight: bold; min-width: 18px; }
  .menu .why { margin-left: auto; font-size: 10px; color: var(--dim); }
  .menu button:disabled .k { color: var(--dim); }

  .preview { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin-top: 12px; }
  .preview .thumb { cursor: default; }
  .preview .thumb:hover { border-color: var(--line); }

  footer { text-align: center; color: var(--dim); font-size: 10px; margin-top: 18px; }
</style>
</head>
<body>
<div class="home">
  <div class="title">
    <h1>DUEL ACADEMY</h1>
    <p>YUGI GAME V2</p>
  </div>

  <div class="slot">
    <h2>DECK ATUAL</h2>
    <div id="deck-info"></div>
    <div class="preview" id="preview"></div>
  </div>

  <div class="menu">
    <button id="btn-deck">
      <span class="k">1</span>
      <span>Deck Builder</span>
      <span class="why" id="deck-hint"></span>
    </button>
    <button id="btn-duel" disabled>
      <span class="k">2</span>
      <span>Duelar contra NPC</span>
      <span class="why">motor de regras ainda não implementado</span>
    </button>
    <button id="btn-cards">
      <span class="k">3</span>
      <span>Navegador de cartas</span>
      <span class="why">13.728 cartas</span>
    </button>
    <button id="btn-npcs">
      <span class="k">4</span>
      <span>Adversários (NPCs)</span>
      <span class="why">montar os decks dos NPCs</span>
    </button>
    <button id="btn-train">
      <span class="k">5</span>
      <span>Treino de duelo</span>
      <span class="why">beta · exige o duel-server rodando</span>
    </button>
  </div>

  <footer id="foot">carregando…</footer>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { getActiveDeck, listDecks } from '/web/js/storage.js';
import { RULES } from '/web/js/deck.js';

const $ = (id) => document.getElementById(id);
const ART = (id) => `https://images.ygoprodeck.com/images/cards_small/${id}.jpg`;

function render() {
  const deck = getActiveDeck();
  const total = listDecks().length;

  if (!deck) {
    $('deck-info').innerHTML =
      `<span class="muted">Nenhum deck salvo ainda. Abra o Deck Builder para criar o primeiro.</span>`;
    $('preview').replaceChildren();
    $('deck-hint').textContent = 'criar o primeiro deck';
    return;
  }

  const v = deck.validate();
  $('deck-info').innerHTML = `
    <div class="deck-line">
      <span class="deck-name"></span>
      <span class="deck-counts">
        Main <b>${deck.main.length}</b>/${RULES.MAIN_MIN}–${RULES.MAIN_MAX}
        &nbsp;·&nbsp; Extra <b>${deck.extra.length}</b>/${RULES.EXTRA_MAX}
      </span>
      <span class="pill ${v.valid ? 'ok' : 'err'}">${v.valid ? 'VÁLIDO' : 'INCOMPLETO'}</span>
    </div>
    ${v.valid ? '' : `<div class="muted" style="margin-top:6px">${v.errors[0]}</div>`}`;
  $('deck-info').querySelector('.deck-name').textContent = deck.name;

  // prévia: primeiras 20 cartas do main
  const frag = document.createDocumentFragment();
  for (const id of deck.main.slice(0, 20)) {
    const d = document.createElement('div');
    d.className = 'thumb';
    d.innerHTML = `<img loading="lazy" src="${ART(id)}" alt="">`;
    frag.append(d);
  }
  $('preview').replaceChildren(frag);
  $('deck-hint').textContent = total > 1 ? `${total} decks salvos` : 'editar';
}

$('btn-deck').onclick = () => (location.href = '/web/deck.html');
$('btn-cards').onclick = () => (location.href = '/ygo-data/examples/web-demo.html');
$('btn-npcs').onclick = () => (location.href = '/web/npcs.html');
$('btn-train').onclick = () => (location.href = '/web/duel.html');

document.addEventListener('keydown', (e) => {
  if (e.key === '1') $('btn-deck').click();
  if (e.key === '3') $('btn-cards').click();
  if (e.key === '4') $('btn-npcs').click();
  if (e.key === '5') $('btn-train').click();
});

// rodapé com a proveniência dos dados
try {
  const meta = await (await fetch('/ygo-data/data/meta.json')).json();
  $('foot').textContent =
    `${meta.counts.cards.toLocaleString('pt-BR')} cartas · ${meta.counts.withScript.toLocaleString('pt-BR')} com script lua · banco gerado em ${meta.generatedAt.slice(0, 10)}`;
} catch {
  $('foot').textContent = 'banco local não encontrado — rode `npm run dev` a partir da raiz do projeto';
}

render();
</script>
</body>
</html>
