<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treino de Duelo — Duel Academy</title>
<link rel="stylesheet" href="/web/css/ui.css">
<style>
  body { display: flex; flex-direction: column; overflow: hidden; }
  .status-line { font-size: 11px; }
  .status-line b { color: var(--gold); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--red); margin-right:5px; }
  .dot.on { background: var(--green); }

  /* zoom escala o cenário inteiro (cartas, zonas, mãos, midbar) de uma vez —
     inclusive os widths que o JS seta inline — mantendo tudo alinhado. +25%. */
  .arena { flex: 1; zoom: 1.25; display: flex; flex-direction: column; gap: 6px; padding: 8px 12px; min-height: 0; overflow: auto; }
  .handrow { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; min-height: 62px; }
  .handrow.opp { opacity: .8; }

  .rows { display: flex; flex-direction: column; gap: 4px; }
  .zonerow { display: flex; gap: 6px; justify-content: center; align-items: center; }
  .pile { display: flex; flex-direction: column; gap: 4px; }

  .zone {
    width: 58px; aspect-ratio: 59/86; border: 1px solid var(--line);
    background: #0c141d; display: flex; align-items: center; justify-content: center;
    position: relative; border-radius: 2px;
  }
  .zone .zl { position: absolute; top: 1px; left: 2px; font-size: 7px; color: #3a4756; letter-spacing: .5px; }
  .zone.mz { border-color: #6b4a1e; }
  .zone.sz { border-color: #1e5a4a; }
  .zone.fz { border-color: #4a2e6b; }
  .zone.free { outline: 2px dashed var(--gold); outline-offset: -2px; cursor: pointer; background: #1a2436; }
  .zone.free:hover { background: #24324a; }
  .zone img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .zone .def img { transform: rotate(90deg) scale(.82); }

  .card { width: 54px; aspect-ratio: 59/86; border: 1px solid var(--line); background: #0c141d; position: relative; border-radius: 2px; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card.playable { outline: 2px solid var(--green); outline-offset: -2px; cursor: pointer; }
  .card.playable:hover { outline-color: var(--gold); }
  .card.selected { outline: 3px solid var(--gold); outline-offset: -2px; }
  .back {
    width:100%; height:100%;
    background:
      radial-gradient(circle at 50% 42%, #b8863a 0 18%, #7c5417 19% 34%, #59380d 35% 100%),
      linear-gradient(135deg,#6b4a1e,#3a260c);
    border: 1px solid #2a1c08; box-sizing: border-box;
  }
  .actbar { display:flex; gap:6px; align-items:center; }
  .actbar b { color: var(--gold); }
  .actbar button { font-size: 11px; padding: 3px 10px; }

  .midbar { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 4px; background: var(--panel); border: 1px solid var(--line); flex-wrap: wrap; }
  .phase-pill { padding: 1px 7px; border: 1px solid var(--line); font-size: 10px; color: var(--dim); }
  .phase-pill.on { color: var(--gold); border-color: var(--gold); }
  .lp { font-size: 12px; color: var(--ink); }
  .midbar button { font-size: 11px; padding: 3px 10px; }

  /* ---------- zona interativa (mudar posição / ativar em campo) ---------- */
  .zone.actionable { outline: 2px solid var(--green); outline-offset: -2px; cursor: pointer; }
  .zone.actionable:hover { outline-color: var(--gold); }

  /* ---------- ataque ---------- */
  .zone.attacker { outline: 2px solid var(--red); outline-offset: -2px; cursor: grab; }
  .zone.attacker:hover { outline-color: var(--gold); }
  .zone .sword {
    position: absolute; top: -6px; right: -4px; z-index: 3;
    font-size: 15px; line-height: 1; text-shadow: 0 0 3px #000, 0 0 6px #000;
    pointer-events: none;
  }
  .zone.target { outline: 2px dashed var(--red); outline-offset: -2px; cursor: crosshair; }
  .zone.target.over { outline-style: solid; background: #3a1a1e; }
  .zone.attacking { opacity: .45; }

  /* ---------- camada de animação (cartas em movimento) ---------- */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 55; overflow: hidden; }
  #fx .ghost {
    position: fixed; border-radius: 2px; overflow: hidden;
    box-shadow: 0 4px 14px #000a; will-change: transform, opacity;
    transition: transform var(--fxdur, .28s) cubic-bezier(.4,.1,.2,1), opacity .2s;
  }
  #fx .ghost img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #fx .ghost .back {
    width: 100%; height: 100%; box-sizing: border-box; border: 1px solid #2a1c08;
    background:
      radial-gradient(circle at 50% 42%, #b8863a 0 18%, #7c5417 19% 34%, #59380d 35% 100%),
      linear-gradient(135deg,#6b4a1e,#3a260c);
  }
  /* tremor do alvo quando é atingido por um ataque */
  @keyframes fx-shake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-3px,2px) rotate(-2deg); }
    40% { transform: translate(3px,-2px) rotate(2deg); }
    60% { transform: translate(-2px,1px) rotate(-1deg); }
    80% { transform: translate(2px,-1px) rotate(1deg); }
  }
  .fx-hit { animation: fx-shake .28s ease-in-out; }
  /* brilho rápido quando uma carta ativa seu efeito */
  @keyframes fx-flash { 0%,100% { box-shadow: 0 0 0 0 #e8c46a00; } 50% { box-shadow: 0 0 10px 3px #e8c46acc; } }
  .fx-activate { animation: fx-flash .5s ease-in-out; }

  /* soltar SOBRE um monstro = tributá-lo */
  .zone.drop-tribute { outline: 2px dashed #c98b2e; outline-offset: -2px; }
  .zone.drop-tribute.over { outline-style: solid; background: #3a2a12; }

  /* carta oferecida numa seleção (tributo, alvo, ritual) */
  .zone.selectable {
    outline: 3px solid var(--gold); outline-offset: -3px; cursor: pointer;
    animation: pisca 1s ease-in-out infinite;
  }
  @keyframes pisca { 50% { outline-color: #6b5220; } }
  /* já marcada para a seleção: para de piscar e ganha um visto */
  .zone.selectable.picked { animation: none; outline-color: var(--green); }
  .zone.selectable.picked::after {
    content: "✓"; position: absolute; top: 0; right: 2px; z-index: 3;
    color: var(--green); font-size: 15px; text-shadow: 0 0 3px #000;
  }

  /* ---------- aviso de fase ---------- */
  /* Entra deslizando, segura um instante e sai. Não intercepta clique. */
  #phase-toast {
    position: fixed; top: 38%; left: 0; right: 0; text-align: center;
    pointer-events: none; z-index: 55;
  }
  #phase-toast span {
    display: inline-block; padding: 8px 26px;
    background: #0c1118dd; border: 2px solid var(--gold); color: var(--gold);
    font-size: 22px; letter-spacing: 4px; text-transform: uppercase;
    animation: fase 1.4s ease-out forwards;
  }
  @keyframes fase {
    0%   { opacity: 0; transform: translateX(-70px); }
    18%  { opacity: 1; transform: translateX(0); }
    68%  { opacity: 1; transform: translateX(0); }
    100% { opacity: 0; transform: translateX(70px); }
  }

  .pilezone {
    width: 58px; aspect-ratio: 59/86; border: 1px dashed #3a4756; border-radius: 2px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 9px; color: var(--dim); cursor: default; background: #0a0f16; position: relative;
  }
  .pilezone.has { cursor: pointer; border-style: solid; border-color: #555; color: var(--ink); }
  .pilezone.has:hover { border-color: var(--gold); }
  .pilezone .n { font-size: 15px; color: var(--gold); }

  .gv-back { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; background: #000b; padding: 20px; }
  .gv-back.show { display: flex; }
  .gv { background: var(--panel); border: 2px solid var(--gold); padding: 12px; width: min(680px, 96vw); max-height: 88vh; overflow: auto; }
  .gv-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .gv-head b { color: var(--gold); flex: 1; }
  .gv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
  .gv-grid .thumb { width: 100%; }

  .log { height: 96px; overflow: auto; background: #0c1118; border-top: 1px solid var(--line);
    font-family: ui-monospace, monospace; font-size: 11px; padding: 5px 12px; color: var(--dim); }
  .log .l { white-space: pre-wrap; }
  .log .l.big { color: var(--gold); }
  .prompt { font-size: 12px; color: var(--gold); min-height: 16px; }

  /* ---------- overlay de seleção (tributo / alvo) ---------- */
  #sel-overlay {
    position: fixed; inset: 0; background: #000b; z-index: 60;
    display: flex; align-items: center; justify-content: center;
  }
  #sel-overlay[hidden] { display: none; }
  .sel-box {
    background: var(--panel); border: 2px solid var(--gold);
    padding: 16px; max-width: 620px; width: 92%;
  }
  .sel-box h3 { margin: 0 0 4px; color: var(--gold); font-size: 14px; }
  .sel-info { font-size: 11px; color: var(--dim); margin-bottom: 10px; }
  .sel-cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: 6px; max-height: 46vh; overflow-y: auto; margin-bottom: 12px;
  }
  .sel-card {
    border: 2px solid var(--line); cursor: pointer; aspect-ratio: 59/86;
    overflow: hidden; background: var(--panel2);
  }
  .sel-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sel-card:hover { border-color: var(--blue); }
  .sel-card { position: relative; }
  .sel-card.on { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
  /* nível da carta, para conferir a soma do ritual sem abrir o card */
  .sel-card .lvl {
    position: absolute; left: 0; bottom: 0; background: #000c; color: var(--gold);
    font-size: 9px; padding: 0 3px;
  }
  .sel-acts { display: flex; gap: 8px; justify-content: flex-end; }

  /* ---------- arrastar da mão para a zona ---------- */
  .card.draggable { cursor: grab; }
  .card.dragging { opacity: .35; }
  /* zona que aceita a carta sendo arrastada */
  .zone.drop-ok { outline: 2px dashed var(--green); outline-offset: -2px; background: #14261c; }
  .zone.drop-ok.over { outline-style: solid; background: #1d3a28; }
  /* zona do tipo errado: deixa explícito que não é ali */
  .zone.drop-no { opacity: .45; }

  /* ---------- popup de posição (ataque / setar) ---------- */
  #pos-overlay {
    position: fixed; inset: 0; background: #000c; z-index: 70;
    display: flex; align-items: center; justify-content: center;
  }
  #pos-overlay[hidden] { display: none; }
  .pos-box {
    background: var(--panel); border: 2px solid var(--gold);
    padding: 18px 22px; display: flex; gap: 18px; align-items: center;
    min-width: min(460px, 92vw);
  }
  .pos-box img { width: 96px; border: 1px solid var(--line); display: block; }
  .pos-info { flex: 1; }
  .pos-info h3 { margin: 0 0 2px; color: var(--gold); font-size: 15px; }
  .pos-info .sub { font-size: 11px; color: var(--dim); margin-bottom: 12px; }
  .pos-acts { display: flex; flex-direction: column; gap: 7px; }
  .pos-acts button { padding: 9px 14px; font-size: 13px; text-align: left; }

  /* ---------- popup de corrente (ativar armadilha em resposta) ---------- */
  #chain-overlay {
    position: fixed; inset: 0; background: #000c; z-index: 80;
    display: flex; align-items: center; justify-content: center;
  }
  #chain-overlay[hidden], #yn-overlay[hidden] { display: none; }
  #yn-overlay {
    position: fixed; inset: 0; background: #000c; z-index: 80;
    display: flex; align-items: center; justify-content: center;
  }
  .chain-box {
    background: var(--panel); border: 2px solid var(--gold);
    padding: 18px 20px; max-width: 460px; width: 92%;
  }
  .chain-box h3 { margin: 0 0 2px; color: var(--gold); font-size: 15px; }
  .chain-box .sub { font-size: 11px; color: var(--dim); margin-bottom: 12px; }
  .chain-cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 8px; margin-bottom: 12px;
  }
  .chain-card {
    border: 2px solid var(--line); cursor: pointer; aspect-ratio: 59/86;
    overflow: hidden; background: var(--panel2); position: relative;
  }
  .chain-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .chain-card:hover { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
  .chain-acts { display: flex; gap: 8px; justify-content: flex-end; }

  /* ---------- popup de fim de duelo (vitória/derrota) ---------- */
  #end-overlay {
    position: fixed; inset: 0; background: #000d; z-index: 90;
    display: flex; align-items: center; justify-content: center;
  }
  #end-overlay[hidden] { display: none; }
  .end-box {
    background: var(--panel); border: 2px solid var(--gold);
    padding: 26px 34px; text-align: center; min-width: min(360px, 90vw);
    box-shadow: 0 0 40px #000;
  }
  #end-emoji { font-size: 44px; line-height: 1; margin-bottom: 6px; }
  .end-box h2 { margin: 0 0 6px; font-size: 22px; color: var(--gold); }
  #end-sub { font-size: 12px; color: var(--dim); margin-bottom: 18px; }
  .end-box.lose { border-color: var(--red); }
  .end-box.lose h2 { color: var(--red); }
  .end-acts { display: flex; gap: 10px; justify-content: center; }
  .end-acts button { padding: 9px 16px; font-size: 13px; }
</style>
</head>
<body>

<div class="topbar">
  <h1>▚ TREINO</h1>
  <span class="status-line"><span class="dot" id="dot"></span><span id="conn">—</span></span>
  <span class="spacer"></span>
  <span class="status-line">turno: <b id="turn">—</b></span>
  <select id="deck-sel" title="deck do treino" style="max-width:160px; font-size:11px"></select>
  <button id="btn-end">encerrar turno</button>
  <button id="btn-save" class="btn-primary" title="grava a jogada deste turno p/ treinar o NPC">salvar jogada</button>
  <button id="btn-start">novo duelo</button>
  <button id="btn-home">← home</button>
</div>

<div class="hint" id="prompt-bar"><span class="prompt" id="prompt">—</span></div>
<div class="hint" id="warn" style="color:var(--red)" hidden></div>

<div id="sel-overlay" hidden>
  <div class="sel-box">
    <h3 id="sel-title"></h3>
    <div class="sel-info" id="sel-info"></div>
    <div class="sel-cards" id="sel-cards"></div>
    <div class="sel-acts">
      <button id="sel-ok" class="btn-primary">confirmar</button>
      <button id="sel-finish">encerrar seleção</button>
    </div>
  </div>
</div>

<div id="pos-overlay" hidden>
  <div class="pos-box">
    <img id="pos-art" alt="">
    <div class="pos-info">
      <h3 id="pos-name"></h3>
      <div class="sub" id="pos-where"></div>
      <div class="pos-acts" id="pos-acts"></div>
    </div>
  </div>
</div>

<div id="chain-overlay" hidden>
  <div class="chain-box">
    <h3 id="chain-title">Ativar em resposta?</h3>
    <div class="sub" id="chain-sub"></div>
    <div class="chain-cards" id="chain-cards"></div>
    <div class="chain-acts">
      <button id="chain-pass">não ativar</button>
    </div>
  </div>
</div>

<div id="yn-overlay" hidden>
  <div class="chain-box">
    <h3 id="yn-title">Efeito opcional</h3>
    <div class="sub" id="yn-sub"></div>
    <div class="chain-acts">
      <button id="yn-no">não</button>
      <button id="yn-yes" class="btn-primary">sim</button>
    </div>
  </div>
</div>

<div id="end-overlay" hidden>
  <div class="end-box">
    <div id="end-emoji">🏆</div>
    <h2 id="end-title"></h2>
    <div id="end-sub"></div>
    <div class="end-acts">
      <button id="end-home" class="btn-primary">voltar para a home</button>
      <button id="end-again">novo duelo</button>
    </div>
  </div>
</div>

<div id="phase-toast"></div>

<div id="fx"></div>

<div class="arena">
  <div class="handrow opp" id="hand-opp"></div>

  <div class="rows" id="opp-field"></div>
  <div class="midbar" id="mid"></div>
  <div class="rows" id="you-field"></div>

  <div class="handrow" id="hand-you"></div>
</div>

<div class="log" id="log"></div>

<div class="gv-back" id="gv-back">
  <div class="gv">
    <div class="gv-head"><b id="gv-title">Cemitério</b><button id="gv-close">fechar</button></div>
    <div class="gv-grid" id="gv-grid"></div>
  </div>
</div>

<script type="module">
import { YgoDB } from '/ygo-data/src/ygodb.js';
import { getActiveDeck, listDecks, getActiveIndex } from '/web/js/storage.js';
import { getNpc, loadNpcDecks, getNpcActiveDeck, hydrateCustomNpcs } from '/web/js/npcs.js';
import { addDP, addCards, WIN_REWARD, hydrateWallet } from '/web/js/wallet.js';
import { wireLongPress, injectHoldStyles, HOLD_MS } from '/web/js/interact.js';
import { configureCardDetail, showCardDetail } from '/web/js/carddetail.js';

// Modo Adversário: duel.html?npc=<id>. Sem npc = Treino (Área de Teste, sem
// recompensa). Com npc, o NPC usa o próprio deck e vencer dá o prêmio em DP
// definido no deck (padrão 100) + a carta-assinatura dele.
const advId = new URLSearchParams(location.search).get('npc');
let advNpc = advId ? getNpc(advId) : null;
let advDeck = null;        // deck do NPC (main ids), carregado no boot
let advExtra = null;       // extra do NPC (fusões etc.), idem
let advSignature = null;
let advReward = WIN_REWARD; // DP que este deck do NPC dá ao ser vencido
let rewardGiven = false;   // trava para não premiar duas vezes no mesmo duelo

const SRV = 'http://localhost:8770';
const $ = (id) => document.getElementById(id);
const ART = (id) => `https://images.ygoprodeck.com/images/cards_small/${id}.jpg`;
const PHASES = [[1,'DP'],[2,'SP'],[4,'M1'],[0x80,'BP'],[0x100,'M2'],[0x200,'EP']];
const PHASE_NOME = {
  1: 'Draw Phase', 2: 'Standby Phase', 4: 'Main Phase 1',
  0x8: 'Battle Phase', 0x10: 'Battle Step', 0x20: 'Damage Step',
  0x40: 'Damage Step', 0x80: 'Battle Phase', 0x100: 'Main Phase 2',
  0x200: 'End Phase',
};

let db = null;
try { db = await YgoDB.load('/ygo-data/data', { full: false }); } catch {}
const nameOf = (id) => db?.brief(id)?.name ?? String(id);

// Mesma janela de detalhes do navegador de cartas e do Deck Builder.
injectHoldStyles(HOLD_MS);
configureCardDetail({ db });

// estado do duelo no cliente
let hand = { 0: [], 1: 0 };                 // p0: lista de codes; p1: só contagem
let field = { 0: fresh(), 1: fresh() };
let question = null, ended = false, turn = 0, phase = 0, turnNo = 0;
let lp = { 0: 8000, 1: 8000 };               // pontos de vida
let deckCount = { 0: 0, 1: 0 };              // cartas restantes no deck de cada um
let selectedHand = null;                      // índice da carta da mão selecionada
let turnPlays = [];                          // jogadas do turno atual (p/ "salvar jogada")
let deckName = '';                            // deck em uso
function fresh() { return { m: Array(5).fill(null), s: Array(5).fill(null), f: null, g: [] }; }

function log(msg, big=false){ const e=document.createElement('div'); e.className='l'+(big?' big':''); e.textContent=msg; $('log').append(e); $('log').scrollTop=1e9; }

/**
 * Anuncia a fase com um texto que entra deslizando e some. Recriamos o elemento
 * a cada aviso para a animação reiniciar — reusar o mesmo nó faz o CSS ignorar
 * a segunda chamada.
 */
let avisoTimer = null;
function avisoFase(texto) {
  const box = $('phase-toast');
  const s = document.createElement('span');
  s.textContent = texto;
  box.replaceChildren(s);
  clearTimeout(avisoTimer);
  avisoTimer = setTimeout(() => box.replaceChildren(), 1500);
}

// ---------- comunicação com o servidor ----------
async function rpc(path, body) {
  const r = await fetch(`${SRV}${path}`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('http '+r.status);
  return r.json();
}

function chosenDeck() {
  const decks = listDecks();
  const i = Number($('deck-sel').value);
  return decks[i] || getActiveDeck();
}

async function start() {
  busy = false; $('fx').replaceChildren();   // aborta qualquer animação em curso
  const deck = chosenDeck();
  const ids = deck ? deck.main : [];
  const extraIds = deck?.extra ?? [];
  if (!ids.length) { warn('Nenhum deck com cartas. Monte/selecione um deck no Deck Builder.'); return; }
  deckName = deck.name;
  hand = { 0: [], 1: 0 }; field = { 0: fresh(), 1: fresh() };
  lp = { 0: 8000, 1: 8000 };
  ended = false; turnNo = 0; turnPlays = []; selectedHand = null;
  rewardGiven = false;
  dragging = null; pendingZone = null; fecharPopupPosicao(); fecharFimDuelo();
  $('log').replaceChildren();
  // No modo Adversário o NPC joga com o PRÓPRIO deck; no Treino, os dois usam o seu.
  const npcIds = (advNpc && advDeck && advDeck.length) ? advDeck : ids;
  deckCount = { 0: ids.length, 1: npcIds.length };
  try {
    const body = { deck: ids };
    // O Extra Deck vai separado: o motor o guarda em LOCATION_EXTRA, de onde
    // saem Fusão/Sincro/Xyz/Link. Mandado junto do main, seria embaralhado e
    // COMPRADO como carta comum — e a fusão nunca apareceria para invocar.
    if (extraIds.length) body.extra = extraIds;
    if (advNpc && advDeck && advDeck.length) body.npcDeck = npcIds;
    if (advNpc && advExtra && advExtra.length) body.npcExtra = advExtra;
    const j = await rpc('/start', body);            // seed aleatória no servidor
    conn(true);
    const vs = advNpc ? ` vs ${advNpc.name}` : '';
    log(`● novo duelo — deck "${deck.name}" (${ids.length} cartas)${vs}`, true);
    apply(j);
  } catch (e) { conn(false); warn('Sem conexão com o duel-server. Rode:  duel-server.exe --serve  (porta 8770).'); }
}

async function act(action, arg, label, args) {
  if (ended || busy) return;   // busy = animação rolando; ignora cliques até assentar
  turnPlays.push({ action, arg, label, turn: turnNo });
  try { apply(await rpc('/respond', args ? { action, arg, args } : { action, arg })); }
  catch (e) { conn(false); warn('perdi a conexão com o servidor.'); }
}

// ---------- seleção de cartas (tributo, alvo) ----------
// O motor pede isso em três formatos: lista de uma vez (selectcard/selecttribute)
// e escolha incremental, uma carta por vez (selectunselect). O overlay abaixo
// atende os dois; a soma de níveis do ritual o servidor resolve sozinho.
const picked = new Set();

function selectionQuestion() {
  if (!question || question.player !== 0) return null;
  return ['selectcard', 'selecttribute', 'selectunselect', 'selectsum'].includes(question.kind)
    ? question : null;
}

/** Soma dos níveis das cartas marcadas (usado no ritual). */
function somaMarcada(q) {
  let s = 0;
  for (const c of q.choices || []) if (picked.has(c.index)) s += (c.param || 0);
  return s;
}

/**
 * A seleção de tributos do ritual já é válida?
 *   • soma exata (q.sumOverflow=false): os níveis batem cravado o alvo.
 *   • "ou mais"  (q.sumOverflow=true):  a soma passa do alvo SEM tributo
 *     dispensável — tirar o de menor nível já derrubaria abaixo do alvo. É a
 *     mesma regra do motor; sem isso ele recusa (RETRY) e o ritual não sai.
 */
function somaValida(q) {
  let soma = 0, menor = Infinity, n = 0;
  for (const c of q.choices || []) if (picked.has(c.index)) {
    const v = c.param || 0; soma += v; if (v < menor) menor = v; n++;
  }
  if (n === 0) return false;
  if (q.selMin && n < q.selMin) return false;
  if (q.selMax > 0 && n > q.selMax) return false;
  return q.sumOverflow ? (soma >= q.sumNeeded && soma - menor < q.sumNeeded)
                       : (soma === q.sumNeeded);
}

function renderSelection() {
  const q = selectionQuestion();
  const box = $('sel-overlay');
  if (!q) { box.hidden = true; return; }
  box.hidden = false;

  const incremental = q.kind === 'selectunselect';
  const soma = q.kind === 'selectsum';
  const need = q.selMin || 1;

  $('sel-title').textContent =
    soma ? 'Escolha os tributos do Ritual'
    : q.kind === 'selecttribute' ? 'Escolha o(s) tributo(s)'
    : incremental ? 'Escolha uma carta' : 'Escolha as cartas';

  if (soma) {
    // Feedback: no ritual "ou mais" o alvo é um mínimo, não um valor cravado.
    const atual = somaMarcada(q);
    const falta = q.sumNeeded - atual;
    const pronto = somaValida(q);
    const alvoTxt = q.sumOverflow ? `${q.sumNeeded} ou mais` : `${q.sumNeeded}`;
    const el = $('sel-info');
    el.innerHTML = `níveis somados: <b style="color:${pronto ? 'var(--green)' : 'var(--gold)'}">${atual}</b>`
      + ` / ${alvoTxt}`
      + (pronto ? ' — pronto!'
         : falta > 0 ? ` — faltam ${falta}`
         : ' — tem tributo sobrando');
  } else {
    $('sel-info').textContent = incremental
      ? `clique numa carta (faltam ${need})`
      : `selecione ${need}${q.selMax > need ? ` a ${q.selMax}` : ''} — ${picked.size} escolhida(s)`;
  }

  const frag = document.createDocumentFragment();
  for (const c of q.choices || []) {
    const el = document.createElement('div');
    el.className = 'sel-card' + (picked.has(c.index) ? ' on' : '');
    // Carta virada do oponente (o servidor omite o código): mostra o verso, não a arte.
    const oculta = c.hidden || !c.code;
    el.innerHTML = (oculta
        ? `<div class="back" style="width:100%;height:100%"></div>`
        : `<img src="${ART(c.code)}" alt="">`)
      + (soma ? `<span class="lvl">Nv ${c.param ?? '?'}</span>` : '');
    el.title = oculta ? 'carta virada' : `código ${c.code}` + (soma ? ` — nível ${c.param}` : '');
    el.onclick = () => {
      if (incremental) { act('pick', c.index, `pick ${c.code}`); picked.clear(); return; }
      picked.has(c.index) ? picked.delete(c.index) : picked.add(c.index);
      renderSelection();
    };
    frag.append(el);
  }
  $('sel-cards').replaceChildren(frag);

  const ok = $('sel-ok');
  ok.hidden = incremental;
  // No ritual o que libera não é a quantidade, é a SOMA ser válida (exata ou
  // "ou mais", conforme o modo que o motor pediu).
  ok.disabled = soma
    ? !somaValida(q)
    : picked.size < need || (q.selMax > 0 && picked.size > q.selMax);
  ok.onclick = () => {
    const list = [...picked];
    picked.clear();
    act('select', 0, `select ${list.join(',')}`, list);
  };
  $('sel-finish').hidden = !(incremental && q.canFinish);
  $('sel-finish').onclick = () => { picked.clear(); act('finishselect', 0, 'finish'); };
}

// ---------- corrente: ativar armadilha/efeito em resposta ----------
function renderChain() {
  const q = (question && question.kind === 'chain' && question.player === 0
             && question.choices && question.choices.length) ? question : null;
  const box = $('chain-overlay');
  if (!q) { box.hidden = true; return; }
  box.hidden = false;

  $('chain-sub').textContent = q.chainForced
    ? 'Você precisa ativar uma destas cartas.'
    : 'Você pode ativar uma carta em resposta — ou passar.';

  const frag = document.createDocumentFragment();
  for (const c of q.choices) {
    const el = document.createElement('div');
    el.className = 'chain-card';
    el.innerHTML = `<img src="${ART(c.code)}" alt="">`;
    el.title = `ativar ${nameOf(c.code)}`;
    el.onclick = () => { box.hidden = true; act('chain', c.index, `ativar ${nameOf(c.code)}`); };
    frag.append(el);
  }
  $('chain-cards').replaceChildren(frag);
  $('chain-pass').hidden = !!q.chainForced;
}

// ---------- sim/não: efeito opcional (Dust Tornado, etc.) ----------
function renderYesno() {
  const q = (question && question.kind === 'yesno' && question.player === 0) ? question : null;
  const box = $('yn-overlay');
  if (!q) { box.hidden = true; return; }
  box.hidden = false;
  $('yn-sub').innerHTML = q.askCode
    ? `Ativar o efeito de <b>${nameOf(q.askCode)}</b>?`
    : 'O efeito permite uma ação opcional (ex.: Dust Tornado — setar 1 carta da mão). Aceitar?';
}

// ---------- aplicar a resposta do servidor ----------
// ---------------- animação (camada #fx) ----------------
// Enhancement PURO: se faltar posição/elemento, cai no instantâneo — nunca
// quebra o duelo. `busy` trava os cliques do jogador enquanto uma sequência roda.
let busy = false;
const prefersReduced = !!window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const nextFrame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

function anchorRect(anchor) {
  if (!anchor) return null;
  const el = document.querySelector(`[data-anchor="${anchor}"]`);
  if (!el) return null;
  const r = el.getBoundingClientRect();
  return r.width && r.height ? r : null;
}
function containerRect(id) {
  const el = document.getElementById(id);
  const r = el && el.getBoundingClientRect();
  return r && r.width ? r : null;
}
/** loc do motor → âncora de zona/pilha. */
function locAnchor(ctrl, loc, seq) {
  if (loc === 4) return `${ctrl}:4:${seq}`;
  if (loc === 8) return `${ctrl}:8:${seq}`;
  if (loc === 0x100) return `${ctrl}:8:5`;   // zona de campo
  if (loc === 0x10) return `${ctrl}:gy`;
  if (loc === 1) return `${ctrl}:deck`;
  return null;
}
function spawnGhost(rect, code, face) {
  const g = document.createElement('div');
  g.className = 'ghost';
  g.style.left = rect.left + 'px'; g.style.top = rect.top + 'px';
  g.style.width = rect.width + 'px'; g.style.height = rect.height + 'px';
  g.innerHTML = (face === 'back' || !code) ? '<div class="back"></div>' : `<img src="${ART(code)}" alt="">`;
  $('fx').append(g);
  return g;
}
/** Lança um fantasma de `from` até `to` (centro→centro). `endScale` encolhe o
 *  fantasma na chegada — útil pra "encaixar" numa pilha pequena (cemitério). */
async function flyGhost(from, to, code, face, dur = 280, endScale = 1) {
  if (prefersReduced || !from || !to) return;
  const g = spawnGhost(from, code, face);
  const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
  const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
  g.style.setProperty('--fxdur', dur + 'ms');
  await nextFrame();                     // firma a posição inicial antes de transicionar
  g.style.transform = `translate(${dx}px, ${dy}px) scale(${endScale})`;
  await sleep(dur);
  g.remove();
}
function flashZone(anchor, cls = 'fx-activate', ms = 500) {
  const el = anchor && document.querySelector(`[data-anchor="${anchor}"]`);
  if (!el) return;
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}

/** Animação de UM evento, ANTES de mutar o estado (a origem ainda está na tela). */
async function animateEvent(ev) {
  try {
    if (ev.type === 'draw') {
      const from = anchorRect(`${ev.player}:deck`);
      const cont = containerRect(ev.player === 0 ? 'hand-you' : 'hand-opp');
      const w = from?.width || 54, h = from?.height || 78;
      // Mira o CENTRO da mão (as cartas ficam centralizadas), não a borda.
      const to = cont ? { left: cont.left + cont.width / 2 - w / 2, top: cont.top, width: w, height: h } : from;
      const n = ev.cards?.length || 1;
      for (let i = 0; i < n; i++) { flyGhost(from, to, 0, 'back', 240); await sleep(130); }
      await sleep(150);
      return;
    }
    if (ev.type === 'move') {
      let fromAnchor;
      if (ev.fromLoc === 2) {                              // da mão
        if (ev.fromCtrl === 0) { const hh = hand[0].indexOf(ev.code); fromAnchor = hh >= 0 ? `0:hand:${hh}` : null; }
        else fromAnchor = '1:hand:0';
      } else fromAnchor = locAnchor(ev.fromCtrl, ev.fromLoc, ev.fromSeq);
      const from = anchorRect(fromAnchor)
        || (ev.fromLoc === 2 ? containerRect(ev.fromCtrl === 0 ? 'hand-you' : 'hand-opp') : null);
      const to = anchorRect(locAnchor(ev.controller, ev.loc, ev.seq));
      const face = (ev.hidden || !ev.code) ? 'back' : 'art';
      // Indo pro cemitério (pilha pequena): encolhe na chegada pra "encaixar".
      const endScale = ev.loc === 0x10 ? 0.55 : 1;
      await flyGhost(from, to, ev.code, face, 300, endScale);
      return;
    }
    if (ev.type === 'attack') {
      const from = anchorRect(`${ev.atkCtrl}:4:${ev.atkSeq}`);
      const to = ev.direct
        ? containerRect(ev.atkCtrl === 0 ? 'hand-opp' : 'hand-you')
        : anchorRect(`${ev.defCtrl}:4:${ev.defSeq}`);
      const code = field[ev.atkCtrl]?.m?.[ev.atkSeq]?.code || 0;
      if (prefersReduced || !from || !to) return;
      const g = spawnGhost(from, code, 'art');
      const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
      const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
      g.style.setProperty('--fxdur', '170ms');
      await nextFrame(); g.style.transform = `translate(${dx}px, ${dy}px)`;
      await sleep(170);
      if (!ev.direct) flashZone(`${ev.defCtrl}:4:${ev.defSeq}`, 'fx-hit', 280);
      await sleep(140);
      g.style.transform = 'translate(0,0)';
      await sleep(170); g.remove();
      return;
    }
  } catch { /* animação nunca derruba o duelo */ }
}

async function apply(j) {
  busy = true;
  try {
    $('warn').hidden = true;
    for (const ev of j.events || []) {
      await animateEvent(ev);   // move o fantasma (origem ainda visível)
      handle(ev);               // muta o estado
      render();                 // a carta "assenta" no lugar
      // magia/armadilha ATIVADA (face-up na zona S/campo): brilho + meio segundo
      // até resolver — é o que dá o fluxo "vivo" (Pote fica no campo, depois compra).
      if (ev.type === 'move' && (ev.loc === 8 || ev.loc === 0x100) && ev.code && !(ev.pos & 0xa)) {
        flashZone(locAnchor(ev.controller, ev.loc, ev.seq));
        await sleep(500);
      }
    }
    question = j.question || null;
    ended = !!j.ended;
    picked.clear();
    selectedField = null;   // a pergunta mudou: a seleção de campo não vale mais
    render();
    renderSelection();
    renderChain();
    renderYesno();

    // Auto-respostas do arrasto (tributo/alvo/zona) — liberam a trava antes de
    // reenviar, para o act() interno passar pelo guardião de `busy`.
    if (pendingTribute != null && question && question.player === 0
        && ['selecttribute', 'selectunselect'].includes(question.kind)) {
      const alvo = pendingTribute; pendingTribute = null;
      const c = (question.choices || []).find((x) => x.location === 4 && x.sequence === alvo);
      if (c) {
        busy = false;
        act(question.kind === 'selectunselect' ? 'pick' : 'select', c.index,
            'tributo escolhido no arrasto', question.kind === 'selectunselect' ? undefined : [c.index]);
        return;
      }
    }
    if (pendingTarget) {
      const alvo = pendingTarget; pendingTarget = null;
      if (question && question.kind === 'selectcard' && question.player === 0) {
        const i = (question.choices || []).findIndex((c) => c.location === alvo.loc && c.sequence === alvo.seq);
        if (i >= 0) { busy = false; act('select', 0, 'alvo do ataque', [question.choices[i].index]); return; }
        log('o alvo arrastado não está entre as opções — escolha na janela.');
      }
    }
    if (pendingZone) {
      const alvo = pendingZone; pendingZone = null;
      if (question && question.kind === 'place' && question.player === 0) {
        if (question.zoneType === alvo.type && (question.zones || []).includes(alvo.index)) {
          busy = false; act('place', alvo.index, `colocar na zona ${alvo.type.toUpperCase()}${alvo.index}`); return;
        }
        log('a zona arrastada não está mais livre — escolha uma destacada.');
      }
    }
  } catch (e) {
    console.error('[apply]', e, j);
    warn('ERRO na tela: ' + (e && e.message ? e.message : e) + ' — abra o console (F12) e/ou dê "novo duelo".');
  } finally {
    busy = false;
  }
}

function handle(ev) {
  switch (ev.type) {
    // O NPC anuncia a jogada e o motivo — é como dá para conferir se ele está
    // seguindo as regras sem abrir o log do servidor.
    case 'npc':
      if (ev.action === 'chain' && ev.code)
        log(`🤖 NPC ativou ${nameOf(ev.code)} em resposta!`, true);
      else
        log(`🤖 NPC: ${ev.action} — ${ev.why}`, true);
      return;
    case 'draw':
      if (ev.player === 0) { for (const c of ev.cards) hand[0].push(c.code); }
      else hand[1] += ev.cards.length;
      deckCount[ev.player] = Math.max(0, deckCount[ev.player] - ev.cards.length);
      log(`compra: jogador ${ev.player} +${ev.cards.length}`);
      break;
    case 'turn':
      turn = ev.player; turnNo++;
      if (ev.player === 0) turnPlays = [];
      log(`— turno ${turnNo} (jogador ${ev.player}) —`, true);
      avisoFase(ev.player === 0 ? 'Seu turno' : 'Turno do oponente');
      break;
    case 'phase': {
      const antes = phase;
      phase = ev.phase;
      // O motor emite as fases iniciais em rajada; só anunciamos mudanças reais.
      if (antes !== phase) avisoFase(PHASE_NOME[phase] ?? `Fase ${phase}`);
      break;
    }
    case 'summoning': log(`invocando ${nameOf(ev.code)}`); break;
    case 'retry':
      // O motor recusou. Sem avisar, a tela só "não reage" e parece bug de clique.
      warn('O motor recusou essa escolha — confira se ela atende ao que foi pedido '
         + '(por exemplo, no ritual os níveis precisam somar o nível pedido, ou mais, sem tributo sobrando).');
      log('⚠ escolha recusada pelo motor');
      break;
    case 'refused':
      warn(`Ação "${ev.action}" não vale agora (o motor espera: ${ev.expected}).`);
      break;
    case 'attack':
      log(ev.direct ? '⚔ ataque direto!' : '⚔ ataque declarado');
      break;
    case 'battle': {
      // O motor já resolveu; aqui é só contar o que houve.
      const quem = (a, d) => `${a}${d ? ' (destruído)' : ''}`;
      log(`⚔ ${quem(ev.atkAtk, ev.atkDestroyed)} vs ${quem(ev.defAtk, ev.defDestroyed)}`, true);
      break;
    }
    case 'pos': {
      // Mudança de posição: a carta continua na zona, só muda a orientação.
      const f = field[ev.controller];
      const alvo = ev.loc === 4 ? f?.m?.[ev.seq]
                 : ev.loc === 8 ? (ev.seq === 5 ? f?.f : f?.s?.[ev.seq]) : null;
      // Ao REVELAR (flip), o pos traz o código real: atualiza para a arte aparecer.
      // Continua virada (code=0) => mantém o que tinha.
      if (alvo) { alvo.pos = ev.pos; if (ev.code) alvo.code = ev.code; }
      const nomes = { 1: 'ataque', 2: 'ataque (virada)', 4: 'defesa', 8: 'defesa (virada)' };
      log(`${ev.code ? nameOf(ev.code) : 'carta virada'} → ${nomes[ev.pos] ?? 'pos ' + ev.pos}`);
      break;
    }
    case 'move': {
      // limpa a zona de origem (carta que sai p/ cemitério, mão, etc.)
      const src = field[ev.fromCtrl];
      if (src) {
        if (ev.fromLoc === 4) src.m[ev.fromSeq] = null;
        else if (ev.fromLoc === 8) { if (ev.fromSeq === 5) src.f = null; else src.s[ev.fromSeq] = null; }
        else if (ev.fromLoc === 0x100) src.f = null;
        // 0x10 = LOCATION_GRAVE. O cemitério é uma PILHA por código, não um
        // vetor de zonas: para tirar, acha o código e remove UMA ocorrência —
        // `indexOf` e não um filtro, senão um Monster Reborn num deck com 3
        // cópias limparia as três do cemitério.
        //
        // Sem este ramo a pilha só crescia: o monstro revivido aparecia em
        // campo E continuava listado no cemitério.
        else if (ev.fromLoc === 0x10 && ev.code) {
          const i = src.g.indexOf(ev.code);
          if (i >= 0) src.g.splice(i, 1);
        }
      }
      // coloca no destino
      const f = field[ev.controller] || (field[ev.controller] = fresh());
      const card = { code: ev.code, pos: ev.pos };
      if (ev.loc === 4) f.m[ev.seq] = card;
      else if (ev.loc === 8) { if (ev.seq === 5) f.f = card; else f.s[ev.seq] = card; } // seq 5 = zona de campo
      else if (ev.loc === 0x100) f.f = card;
      else if (ev.loc === 0x10) f.g.push(ev.code); // 0x10 = LOCATION_GRAVE
      // 0x2 = LOCATION_HAND. Carta que VAI PARA A MÃO sem ser compra: busca no
      // deck (Fusion Sage), volta do campo, devolução do cemitério. O MSG_DRAW
      // cobre só a compra, então sem este ramo a carta buscada sumia — saía do
      // deck (o contador caía) e não aparecia em lugar nenhum.
      else if (ev.loc === 2) {
        if (ev.controller === 0) { if (ev.code) hand[0].push(ev.code); }
        else hand[1]++;
      }
      if (ev.fromLoc === 2) { // saiu da mão
        if (ev.fromCtrl === 0) { const i = hand[0].indexOf(ev.code); if (i>=0) hand[0].splice(i,1); }
        else if (hand[1] > 0) hand[1]--;
      }
      // Saiu do deck por efeito (não pela compra, que já vem no MSG_DRAW).
      if (ev.fromLoc === 1) {
        deckCount[ev.fromCtrl] = Math.max(0, deckCount[ev.fromCtrl] - 1);
        if (ev.loc === 2) {
          log(`busca: ${ev.code ? nameOf(ev.code) : 'carta'} foi do deck para a mão`);
        }
      }
      break;
    }
    case 'lp': {
      lp[ev.player] = ev.lp;
      const who = ev.player === 0 ? 'você' : 'oponente';
      log(`${ev.delta < 0 ? '−' : '+'}${Math.abs(ev.delta)} LP ${who} → ${ev.lp}`);
      break;
    }
    case 'end': {
      // Vencedor definitivo do motor (0/1 = jogador, 2 = empate); se não veio,
      // deduz pelos LP zerados.
      const w = (typeof ev.winner === 'number' && ev.winner >= 0) ? ev.winner
              : lp[0] <= 0 ? 1 : lp[1] <= 0 ? 0 : -1;
      const empate = w === 2 || w < 0;
      const venci = w === 0;
      log(`=== ${empate ? 'duelo encerrado' : venci ? 'você venceu!' : 'oponente venceu'} ===`, true);
      const premio = concederRecompensa(venci);
      mostrarFimDuelo(venci, empate, premio);
      break;
    }
  }
}

// ---------- render ----------
let SELECIONAVEIS = new Map();   // recalculado a cada render

function zoneEl(cell, cls, label, onClick, drop, campoOpts, atk, selKey) {
  const z = document.createElement('div');
  z.className = 'zone ' + cls;
  if (selKey) z.dataset.anchor = selKey;   // p/ animações localizarem a zona
  z.innerHTML = `<span class="zl">${label}</span>`;
  // A arte vem primeiro: as ramificações abaixo podem sair da função cedo
  // (durante uma seleção, por exemplo) e a carta precisa aparecer de qualquer jeito.
  if (cell) {
    const facedown = (cell.pos & 0xa) !== 0;   // POS_FACEDOWN_*
    const el = document.createElement(facedown ? 'div' : 'img');
    if (facedown) { el.className = 'back'; el.style.width = '100%'; el.style.height = '100%'; }
    else el.src = ART(cell.code);
    // só MONSTRO em defesa deita; magia/armadilha fica sempre vertical
    if (cls === 'mz' && (cell.pos & 0xc)) el.style.transform = 'rotate(90deg) scale(.82)';
    el.title = facedown ? 'carta virada' : nameOf(cell.code) + '\nsegurar: ver detalhes';
    z.append(el);
    // Carta virada não revela nada: ver o detalhe dela seria trapaça.
    if (!facedown) {
      wireLongPress(z, HOLD_MS, () => showCardDetail(cell.code));
      z.oncontextmenu = (e) => { e.preventDefault(); showCardDetail(cell.code); };
    }
  }

  // --- ataque: meu monstro que pode atacar ---
  // Guarda de posição: só monstro em ATAQUE face-up declara ataque. O motor já
  // não lista monstro em defesa como atacante, mas travar aqui também alinha o
  // visual (carta deitada = defesa) à ação e mata qualquer descompasso.
  if (cell && atk && atk.meu && !(cell.pos & 0xc)) {
    z.classList.add('attacker');
    z.insertAdjacentHTML('beforeend', '<span class="sword" title="pode atacar">⚔️</span>');
    if (atacando && atacando.seq === atk.seq) z.classList.add('attacking');
    z.draggable = true;
    z.addEventListener('dragstart', (e) => {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(cell.code));
      atacando = { index: atk.act.index, seq: atk.seq, code: cell.code, direct: atk.act.canDirect };
      // Só o campo do oponente precisa mudar; redesenhar tudo agora cancelaria
      // o arrasto, como já aconteceu com a mão.
      setTimeout(() => { if (atacando) $('opp-field').replaceChildren(fieldRows(1, false)); }, 0);
    });
    z.addEventListener('dragend', () => { atacando = null; render(); });
    z.onclick = () => {
      // NÃO marcar `atacando` aqui: ele existe só para o arrasto. Deixá-lo
      // pendurado fazia toda zona do oponente virar alvo de drop para sempre, e
      // soltar uma carta da mão ali respondia "atacar" a uma pergunta de zona —
      // que o motor lia como "coloque no campo do jogador 1".
      atacando = null;
      pendingTarget = null;   // sem alvo definido: o motor vai perguntar
      act('attack', atk.act.index, `atacar com ${nameOf(cell.code)}`);
    };
  }

  // --- ataque: zona do oponente como alvo ---
  // Exige estar de fato na Battle Phase: fora dela, uma resposta de ataque seria
  // lida pelo motor como resposta a outra pergunta.
  const naBatalha = question && question.kind === 'battle' && question.player === 0;
  if (atk && atk.alvo && atacando && naBatalha) {
    z.classList.add('target');
    z.addEventListener('dragover', (e) => { e.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', () => z.classList.remove('over'));
    z.addEventListener('drop', (e) => {
      e.preventDefault();
      z.classList.remove('over');
      const a = atacando;
      atacando = null;
      if (!a) return;
      // Guarda o alvo: o motor pergunta em seguida, num SELECT_CARD.
      pendingTarget = cell ? { loc: atk.loc, seq: atk.seq } : null;
      act('attack', a.index, `atacar com ${nameOf(a.code)}`);
    });
  }

  // Durante uma seleção, a zona vira candidata clicável — e nada mais.
  if (cell && selKey) {
    const c = SELECIONAVEIS.get(selKey);
    if (c) {
      const q = question;
      const marcada = picked.has(c.index);
      z.classList.add('selectable');
      if (marcada) z.classList.add('picked');
      const nome = (c.hidden || !cell.code) ? 'carta virada' : nameOf(cell.code);
      z.title = nome + (q.kind === 'selectsum' ? ` — nível ${c.param}` : '')
              + (marcada ? ' — escolhida (clique para tirar)' : ' — clique para escolher');
      z.onclick = () => {
        // Escolha única (seletor incremental ou seleção de 1) envia na hora.
        // As demais ACUMULAM: um ritual precisa somar o nível exato, e mandar
        // uma carta só fazia o motor recusar em silêncio.
        if (q.kind === 'selectunselect') {
          act('pick', c.index, `escolher ${nameOf(cell.code)}`);
          return;
        }
        if (q.selMax === 1 && q.kind !== 'selectsum') {
          act('select', 0, `escolher ${nameOf(cell.code)}`, [c.index]);
          return;
        }
        picked.has(c.index) ? picked.delete(c.index) : picked.add(c.index);
        render();
        renderSelection();
      };
      return z;   // nesta pergunta a zona não faz mais nada
    }
  }

  // Ações disponíveis para a carta que já está nesta zona.
  if (cell && campoOpts) {
    const chave = `${campoOpts.loc}:${campoOpts.seq}`;
    const opts = [];
    const iRepos = campoOpts.acoes.repos.get(chave);
    const iAtiva = campoOpts.acoes.ativa.get(chave);
    if (iAtiva !== undefined) opts.push({ action: 'activate', arg: iAtiva, label: 'Ativar' });
    if (iRepos !== undefined) opts.push({ action: 'reposition', arg: iRepos, label: 'Mudar posição' });

    if (opts.length) {
      z.classList.add('actionable');
      const sel = selectedField;
      const marcada = sel && sel.loc === campoOpts.loc && sel.seq === campoOpts.seq;
      if (marcada) z.style.outlineColor = 'var(--gold)';
      z.onclick = () => {
        // Uma opção só: executa direto. Duas: mostra a barra para escolher.
        if (opts.length === 1) { act(opts[0].action, opts[0].arg, `${opts[0].label} ${nameOf(cell.code)}`); return; }
        selectedField = marcada ? null : { ...campoOpts, code: cell.code, opts };
        selectedHand = null;
        render();
      };
    }
  }

  // Zona com uma carta em jogo (arrastada ou clicada): marca se aceita o TIPO
  // dela. Aceita tanto soltar quanto clicar.
  const ativa = activeHand();
  if (ativa != null && drop) {
    const codigoAtivo = hand[0][ativa];
    // Zona ocupada só aceita quem exige tributo — e o gesto significa
    // "tributa este monstro".
    const sobreMonstro = !!cell && drop.type === 'm' && exigeTributo(codigoAtivo);
    const aceita = dropTargets(ativa)[drop.type] && (!cell || sobreMonstro);

    if (aceita) {
      z.classList.add(sobreMonstro ? 'drop-tribute' : 'drop-ok');
      z.style.cursor = 'pointer';
      if (sobreMonstro) z.title = `tributar ${nameOf(cell.code)} para invocar`;
      const escolher = () => dropOn(drop.type, drop.index, sobreMonstro ? drop.index : null);
      z.onclick = escolher;
      z.addEventListener('dragover', (e) => { e.preventDefault(); z.classList.add('over'); });
      z.addEventListener('dragleave', () => z.classList.remove('over'));
      z.addEventListener('drop', (e) => {
        e.preventDefault();
        z.classList.remove('over');
        escolher();
      });
    } else if (!cell) {
      z.classList.add('drop-no');
    }
  }

  if (!cell && onClick) { z.classList.add('free'); z.onclick = onClick; }
  return z;
}

/**
 * O que o motor permite fazer com as cartas JÁ em campo, indexado por posição.
 *
 * É aqui que as regras oficiais entram sem que a gente as escreva: um monstro
 * invocado neste turno não aparece em `repositionable`, uma armadilha baixada
 * agora não aparece em `activatable`, e uma magia normal aparece. Quem decide
 * é o motor — nós só desenhamos o que ele ofereceu.
 */
function acoesDeCampo(player) {
  const repos = new Map(), ativa = new Map();
  if (question && question.kind === 'idle' && question.player === 0) {
    for (const a of question.repositionable || []) {
      if (a.controller === player) repos.set(`${a.location}:${a.sequence}`, a.index);
    }
    for (const a of question.activatable || []) {
      // location 2 = mão; aqui só interessam as que já estão no campo
      if (a.controller === player && a.location !== 2) ativa.set(`${a.location}:${a.sequence}`, a.index);
    }
  }
  return { repos, ativa };
}

let selectedField = null;   // { loc, seq, code } da carta de campo selecionada
let atacando = null;        // atacante arrastado/selecionado: { index, seq, code, direct }
let pendingTarget = null;   // alvo escolhido no arrasto, aplicado no SELECT_CARD

/**
 * Monstros meus que podem atacar agora, por sequência de zona. Quem decide é o
 * motor: monstro invocado neste turno, em defesa, ou que já atacou, simplesmente
 * não vem na lista.
 */
/**
 * Cartas do campo que a pergunta de seleção está oferecendo, por posição.
 *
 * Serve ao pedido de "separar as ações em partes": enquanto o motor pede uma
 * escolha, o tabuleiro para de oferecer invocação/posição/ataque e passa a
 * mostrar apenas o que está em jogo naquela escolha — e dá para clicar direto
 * na carta, em vez de caçá-la na janela.
 */
function selecionaveisNoCampo() {
  const m = new Map();
  const q = question;
  if (!q || q.player !== 0) return m;
  if (!['selectcard', 'selecttribute', 'selectunselect', 'selectsum'].includes(q.kind)) return m;
  for (const c of q.choices || []) {
    if (c.location === 4 || c.location === 8) m.set(`${c.controller}:${c.location}:${c.sequence}`, c);
  }
  return m;
}

function atacantes() {
  const m = new Map();
  if (question && question.kind === 'battle' && question.player === 0) {
    for (const a of question.attackers || []) {
      if (a.controller === 0 && a.location === 4) m.set(a.sequence, a);
    }
  }
  return m;
}

function fieldRows(player, isYou) {
  const wrap = document.createElement('div'); wrap.className = 'rows';
  const f = field[player];
  const campo = acoesDeCampo(player);
  const placing = question && question.kind === 'place' && isYou;
  const freeM = placing && question.zoneType === 'm' ? new Set(question.zones) : new Set();
  const freeS = placing && question.zoneType === 's' ? new Set(question.zones) : new Set();

  const mrow = document.createElement('div'); mrow.className = 'zonerow';
  const srow = document.createElement('div'); srow.className = 'zonerow';
  const co = (loc, seq) => (isYou ? { loc, seq, acoes: campo } : null);
  const atk = atacantes();
  // Meu monstro que pode atacar, ou zona do oponente servindo de alvo.
  const ai = (i) => isYou
    ? (atk.has(i) ? { meu: true, seq: i, act: atk.get(i) } : null)
    : { alvo: true, loc: 4, seq: i };

  const sk = (loc, seq) => `${player}:${loc}:${seq}`;

  mrow.append(zoneEl(f.f, 'fz', 'F', null,
    isYou ? { type: 'f', index: 5 } : null, co(8, 5), null, sk(8, 5)));
  for (let i = 0; i < 5; i++)
    mrow.append(zoneEl(f.m[i], 'mz', 'M'+i,
      freeM.has(i) ? () => act('place', i, `colocar na zona M${i}`) : null,
      isYou ? { type: 'm', index: i } : null, co(4, i), ai(i), sk(4, i)));
  mrow.append(pileEl(player, 'GY', f.g));   // cemitério à direita dos monstros
  const spacer = document.createElement('div'); spacer.style.width = '58px'; srow.append(spacer);
  for (let i = 0; i < 5; i++)
    srow.append(zoneEl(f.s[i], 'sz', 'S'+i,
      freeS.has(i) ? () => act('place', i, `colocar na zona S${i}`) : null,
      isYou ? { type: 's', index: i } : null, co(8, i), null, sk(8, i)));
  // Deck logo abaixo do cemitério, que é onde ele fica de verdade na mesa.
  srow.append(deckEl(player));

  // você (embaixo): monstros na linha de cima (perto do centro), magias embaixo.
  // oponente (em cima): espelhado.
  if (isYou) { wrap.append(mrow, srow); } else { wrap.append(srow, mrow); }
  return wrap;
}

// Mapeia cada carta da mão (por posição) ao índice dentro de uma lista do motor,
// casando por código e respeitando duplicatas (ordem da mão).
function mapList(list) {
  const m = new Array(hand[0].length).fill(-1);
  const used = new Set();
  for (const a of list || []) {
    for (let h = 0; h < hand[0].length; h++) {
      if (!used.has(h) && m[h] < 0 && hand[0][h] === a.code) { m[h] = a.index; used.add(h); break; }
    }
  }
  return m;
}

// As ações possíveis para a carta da mão na posição h (o motor decide o que
// pode: invocar/setar/utilizar — ver requisitos 3 e 4).
function actionsFor(h) {
  if (!question || question.kind !== 'idle' || question.player !== 0) return [];
  const out = [];
  if (MAPS.summon[h] >= 0)     out.push({ action: 'summon',     arg: MAPS.summon[h],     label: 'Invocar' });
  if (MAPS.activate[h] >= 0)   out.push({ action: 'activate',   arg: MAPS.activate[h],   label: 'Utilizar' });
  if (MAPS.setmonster[h] >= 0) out.push({ action: 'setmonster', arg: MAPS.setmonster[h], label: 'Setar' });
  if (MAPS.setspell[h] >= 0)   out.push({ action: 'setspell',   arg: MAPS.setspell[h],   label: 'Setar' });
  return out;
}

let MAPS = { summon: [], setmonster: [], setspell: [], activate: [] };
function rebuildMaps() {
  MAPS = {
    summon: mapList(question && question.summonable),
    setmonster: mapList(question && question.settable),
    setspell: mapList(question && question.settableST),
    activate: mapList(question && question.activatable),
  };
}

function toggleSelect(h) {
  selectedHand = (selectedHand === h) ? null : h;   // clicar de novo desmarca
  render();
}

function doAction(a) {
  const code = hand[0][selectedHand];
  selectedHand = null;
  act(a.action, a.arg, `${a.label} ${nameOf(code)}`);
}

// ---------- arrastar da mão para a zona ----------
// O motor pede a zona DEPOIS da ação (idle -> SELECT_PLACE). Como o arrasto já
// diz onde a carta vai, guardamos a zona e respondemos o SELECT_PLACE sozinhos.
let dragging = null;      // { h, code, kind }
let pendingZone = null;   // { type: 'm'|'s', index }
let pendingTribute = null; // sequência do monstro que o arrasto escolheu tributar

/** Onde a carta pode ser jogada: monstro, magia/armadilha ou campo. */
function cardKind(code) {
  const b = db?.brief(code);
  if (!b) return 'm';
  if (b.t === 'M') return 'm';
  return /\bField\b/.test(b.tl || '') ? 'f' : 's';
}

/** Nível da carta (0 quando não for monstro ou não estiver no índice). */
const nivelDe = (code) => db?.brief(code)?.lv ?? 0;

/**
 * Precisa de tributo? Só esses podem ser soltos SOBRE um monstro — é o gesto de
 * "tributa este aqui". Sem isso, com as 5 zonas ocupadas não sobrava nenhum
 * alvo de arrasto e a invocação por tributo ficava inacessível pelo arrasto.
 */
const exigeTributo = (code) => nivelDe(code) >= 5;

/**
 * Qual carta está "em jogo" agora: a que está sendo arrastada ou, se não houver
 * arrasto, a que foi clicada. Assim as zonas acendem nos dois casos e dá para
 * jogar sem arrastar — clique na carta, clique na zona.
 */
function activeHand() {
  if (dragging) return dragging.h;
  return selectedHand;
}

/** As zonas que aceitam esta carta, respeitando o tipo. */
function dropTargets(h) {
  if (h == null) return { m: false, s: false, f: false };
  const acts = actionsFor(h);
  if (!acts.length) return { m: false, s: false, f: false };
  const kind = cardKind(hand[0][h]);
  const podeMonstro = acts.some((a) => a.action === 'summon' || a.action === 'setmonster');
  const podeMagia = acts.some((a) => a.action === 'activate' || a.action === 'setspell');
  return {
    m: kind === 'm' && podeMonstro,
    s: kind === 's' && podeMagia,
    f: kind === 'f' && podeMagia,
  };
}

function startDrag(h, el) {
  dragging = { h, code: hand[0][h], kind: cardKind(hand[0][h]) };
  el.classList.add('dragging');

  // NÃO chamar render() aqui: ele reconstrói a mão e destruiria justamente o
  // elemento que está sendo arrastado, o que faz o navegador cancelar o arrasto.
  // Só o campo precisa ser redesenhado (para acender as zonas válidas), e ainda
  // assim num setTimeout, já com o arrasto iniciado.
  setTimeout(() => {
    if (dragging) $('you-field').replaceChildren(fieldRows(0, true));
  }, 0);
}

function endDrag() {
  dragging = null;
  document.querySelectorAll('.zone.over').forEach((z) => z.classList.remove('over'));
  render();
}

/**
 * Escolheu a zona (soltando ou clicando): guarda o destino e pergunta a posição.
 * `tributoSeq` vem preenchido quando a carta foi solta SOBRE um monstro — nesse
 * caso o gesto também diz qual monstro tributar.
 */
function dropOn(type, index, tributoSeq = null) {
  const h = activeHand();
  if (h == null) return;
  // A zona de campo é, para o motor, a sequência 5 do grupo de magia.
  pendingZone = { type: type === 'f' ? 's' : type, index: type === 'f' ? 5 : index };
  pendingTribute = tributoSeq;
  const acts = actionsFor(h);
  dragging = null;
  selectedHand = null;
  abrirPopupPosicao(h, acts, type, index);
}

/**
 * Popup de posição. Para monstro são [Posição de Ataque] e [Setar]; para
 * magia/armadilha, [Utilizar] e [Setar] — a mesma escolha, outro vocabulário.
 */
function abrirPopupPosicao(h, acts, type, index) {
  const code = hand[0][h];
  const LABEL = {
    summon: 'Posição de Ataque',
    setmonster: 'Setar (defesa, virada)',
    activate: 'Utilizar',
    setspell: 'Setar (virada)',
  };
  const zonaTxt = type === 'f' ? 'Zona de Campo'
    : type === 'm' ? `Zona de Monstro ${index + 1}`
    : `Zona de Magia/Armadilha ${index + 1}`;

  $('pos-art').src = ART(code);
  $('pos-name').textContent = nameOf(code);
  $('pos-where').textContent = `→ ${zonaTxt}`;

  const frag = document.createDocumentFragment();
  for (const a of acts) {
    const b = document.createElement('button');
    b.className = a.action === 'summon' || a.action === 'activate' ? 'btn-primary' : '';
    b.textContent = LABEL[a.action] ?? a.label;
    b.onclick = () => {
      fecharPopupPosicao();
      act(a.action, a.arg, `${LABEL[a.action] ?? a.label} ${nameOf(code)} em ${zonaTxt}`);
    };
    frag.append(b);
  }
  const x = document.createElement('button');
  x.textContent = 'cancelar';
  x.onclick = () => { pendingZone = null; fecharPopupPosicao(); render(); };
  frag.append(x);

  $('pos-acts').replaceChildren(frag);
  $('pos-overlay').hidden = false;
}

function fecharPopupPosicao() { $('pos-overlay').hidden = true; }

/**
 * Pergunta de POSIÇÃO (SELECT_POSITION): Invocação-Ritual e demais Invocações
 * Especiais deixam escolher entre ataque e defesa — as duas com a FACE PARA
 * CIMA. Não confunda com Set: setar é virar a carta, e é outra jogada.
 *
 * A máscara vem do motor (0x1 ataque, 0x4 defesa aberta); só desenhamos o que
 * ele aceita, em vez de oferecer uma opção que seria recusada.
 */
function abrirPopupPosicaoEspecial(q) {
  const code = q.askCode;
  const opcoes = [];
  if (q.posMask & 0x1) opcoes.push({ pos: 0x1, label: 'Posição de Ataque', primaria: true });
  if (q.posMask & 0x4) opcoes.push({ pos: 0x4, label: 'Posição de Defesa', primaria: false });
  // Máscara sem nada reconhecível: responde ataque para não travar o duelo.
  if (!opcoes.length) { act('position', 0x1, 'posição (ataque)'); return; }

  $('pos-art').src = ART(code);
  $('pos-name').textContent = nameOf(code);
  $('pos-where').textContent = '→ escolha a posição';

  const frag = document.createDocumentFragment();
  for (const o of opcoes) {
    const b = document.createElement('button');
    b.className = o.primaria ? 'btn-primary' : '';
    b.textContent = o.label;
    b.onclick = () => {
      fecharPopupPosicao();
      act('position', o.pos, `${nameOf(code)} em ${o.label.toLowerCase()}`);
    };
    frag.append(b);
  }
  // Sem "cancelar": o motor está esperando uma posição, e recusar trava o duelo.
  $('pos-acts').replaceChildren(frag);
  $('pos-overlay').hidden = false;
}

function render() {
  SELECIONAVEIS = selecionaveisNoCampo();
  if (question && question.kind === 'position' && question.player === 0) {
    abrirPopupPosicaoEspecial(question);
  }
  $('turn').textContent = turn === 0 ? 'VOCÊ' : 'oponente';
  $('opp-field').replaceChildren(fieldRows(1, false));
  $('you-field').replaceChildren(fieldRows(0, true));

  // LP + fases na barra central
  const lpEl = (p) => {
    const s = document.createElement('span'); s.className = 'lp';
    s.innerHTML = `<b style="color:${p === 0 ? 'var(--blue)' : 'var(--red)'}">${p === 0 ? 'VOCÊ' : 'OPP'}</b> ${lp[p]}`;
    return s;
  };
  $('mid').replaceChildren(
    lpEl(1),
    ...PHASES.map(([v, n]) => { const s = document.createElement('span'); s.className = 'phase-pill' + (v === phase ? ' on' : ''); s.textContent = n; return s; }),
    ...botoesDeFase(),
    lpEl(0),
  );

  // mão do oponente (verso)
  const oh = document.createElement('div'); oh.style.display='contents';
  $('hand-opp').replaceChildren(...Array.from({length: hand[1]}, (_, i) => {
    const c=document.createElement('div'); c.className='card'; c.dataset.anchor='1:hand:'+i; c.innerHTML='<div class="back"></div>'; return c;
  }));

  // sua mão (selecionável quando há ação disponível)
  rebuildMaps();
  if (selectedHand != null && actionsFor(selectedHand).length === 0) selectedHand = null;
  $('hand-you').replaceChildren(...hand[0].map((code, h) => {
    const c = document.createElement('div'); c.className = 'card'; c.dataset.anchor = '0:hand:' + h;
    c.innerHTML = `<img src="${ART(code)}" title="${nameOf(code)}\nsegurar: ver detalhes" alt="" draggable="false">`;

    // Segurar abre os detalhes — vale para toda carta da mão, jogável ou não.
    const segurou = wireLongPress(c, HOLD_MS, () => showCardDetail(code));
    c.oncontextmenu = (e) => { e.preventDefault(); showCardDetail(code); };

    if (actionsFor(h).length) {
      c.classList.add('playable', 'draggable');
      c.onclick = () => { if (segurou()) return; toggleSelect(h); };
      // Arrastar é o caminho novo; o clique continua funcionando para quem
      // preferir a barra de ações.
      c.draggable = true;
      c.addEventListener('dragstart', (e) => {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(code));  // exigido pelo Firefox
        startDrag(h, c);
      });
      c.addEventListener('dragend', endDrag);
    }
    if (h === selectedHand) c.classList.add('selected');
    if (dragging && dragging.h === h) c.classList.add('dragging');
    c.oncontextmenu = (e) => e.preventDefault();
    return c;
  }));

  const yourIdle = question && question.kind === 'idle' && question.player === 0;
  const yourPlace = question && question.kind === 'place' && question.player === 0;
  $('btn-end').disabled = !(yourIdle && question.canEnd) || ended;

  // barra de ação (quando há carta selecionada) ou prompt normal
  const bar = $('prompt-bar');
  if (selectedField) {
    const div = document.createElement('div'); div.className = 'actbar';
    div.append(Object.assign(document.createElement('b'), { textContent: nameOf(selectedField.code) + ':' }));
    for (const a of selectedField.opts) {
      const b = document.createElement('button');
      b.textContent = a.label;
      b.onclick = () => { const s = selectedField; selectedField = null; act(a.action, a.arg, `${a.label} ${nameOf(s.code)}`); };
      div.append(b);
    }
    const x = document.createElement('button'); x.textContent = 'cancelar';
    x.onclick = () => { selectedField = null; render(); };
    div.append(x);
    bar.replaceChildren(div);
  } else if (selectedHand != null) {
    const div = document.createElement('div'); div.className = 'actbar';
    div.append(Object.assign(document.createElement('b'), { textContent: nameOf(hand[0][selectedHand]) + ':' }));
    div.append(Object.assign(document.createElement('span'), {
      className: 'muted',
      textContent: 'clique numa zona verde para escolher onde, ou use:',
    }));
    for (const a of actionsFor(selectedHand)) {
      const b = document.createElement('button'); b.textContent = a.label; b.onclick = () => doAction(a); div.append(b);
    }
    const x = document.createElement('button'); x.textContent = 'cancelar'; x.onclick = () => { selectedHand = null; render(); };
    div.append(x);
    bar.replaceChildren(div);
  } else {
    const unsupported = question && question.kind === 'unsupported';
    if (unsupported) warn(`O motor pediu uma ação que o treino ainda não suporta (msg ${question.rawType}). Dê "novo duelo".`);
    bar.replaceChildren(Object.assign(document.createElement('span'), {
      className: 'prompt',
      textContent: ended ? 'duelo encerrado.'
        : unsupported ? `⚠ ação não suportada ainda (msg ${question.rawType}) — comece um novo duelo.`
        : yourPlace ? `Escolha uma zona ${question.zoneType === 's' ? 'de magia/armadilha' : 'de monstro'} livre (destacada).`
        : dragging ? 'Solte a carta numa zona verde.'
        : yourIdle ? 'Sua vez: arraste a carta até a zona — ou clique na carta e depois na zona.'
        : 'aguarde…'
    }));
  }
}

/**
 * Botões de fase, no centro do tabuleiro.
 *
 * O motor não tem um "próxima fase" genérico: da Main 1 dá para ir à Battle
 * (idle 6) ou à End Phase (idle 7); dentro da Battle dá para ir à Main 2
 * (battle 2) ou à End Phase (battle 3). O botão traduz isso para o que faz
 * sentido no momento, e desliga quando o motor não permite.
 */
function botoesDeFase() {
  const meu = question && question.player === 0 && !ended;
  const idle = meu && question.kind === 'idle';
  const batalha = meu && question.kind === 'battle';

  let proxima = null;
  if (idle && question.canBattle) proxima = { rotulo: '▶ Battle Phase', acao: 'battle' };
  else if (idle && question.canEnd) proxima = { rotulo: '▶ End Phase', acao: 'endturn' };
  else if (batalha && question.canMain2) proxima = { rotulo: '▶ Main Phase 2', acao: 'tomain2' };

  const b1 = document.createElement('button');
  b1.textContent = proxima ? proxima.rotulo : '▶ próxima fase';
  b1.disabled = !proxima;
  b1.title = 'avança para a próxima fase';
  if (proxima) b1.onclick = () => act(proxima.acao, 0, proxima.rotulo);

  const b2 = document.createElement('button');
  b2.textContent = '⏭ End Phase';
  b2.title = 'pula direto para a End Phase';
  b2.disabled = !(idle ? question.canEnd : batalha);
  b2.onclick = () => act(batalha ? 'endbattle' : 'endturn', 0, 'End Phase');

  return [b1, b2];
}

function pileEl(player, label, cards) {
  const d = document.createElement('div');
  d.className = 'pilezone' + (cards.length ? ' has' : '');
  d.dataset.anchor = player + ':gy';
  d.innerHTML = `<span class="n">${cards.length}</span>${label}`;
  if (cards.length) d.onclick = () => openGrave(player);
  return d;
}

/** Pilha do deck: quantas cartas ainda restam para comprar. */
function deckEl(player) {
  const n = deckCount[player];
  const d = document.createElement('div');
  d.className = 'pilezone';
  d.dataset.anchor = player + ':deck';
  d.title = `Deck de ${player === 0 ? 'você' : 'oponente'}: ${n} carta(s)`;
  if (n > 0) {
    d.style.borderStyle = 'solid';
    d.style.borderColor = '#6b4a1e';
    d.innerHTML = `<span class="n">${n}</span>DECK`;
  } else {
    d.innerHTML = `<span class="n" style="color:var(--red)">0</span>DECK`;
  }
  return d;
}

function openGrave(player) {
  const cards = field[player].g;
  $('gv-title').textContent = `Cemitério — ${player === 0 ? 'você' : 'oponente'} (${cards.length} cartas)`;
  $('gv-grid').replaceChildren(...cards.map((code) => {
    const t = document.createElement('div'); t.className = 'thumb'; t.title = nameOf(code);
    t.innerHTML = `<img src="${ART(code)}" alt="">`; return t;
  }));
  $('gv-back').classList.add('show');
}

function populateDecks() {
  const decks = listDecks();
  const sel = $('deck-sel');
  sel.replaceChildren(...decks.map((d, i) => new Option(`${d.name} (${d.main.length})`, String(i))));
  if (!decks.length) sel.append(new Option('(nenhum deck salvo)', ''));
  const active = getActiveIndex();
  sel.value = (active != null && decks[active]) ? String(active) : (decks.length ? '0' : '');
}

function snapshotField() {
  const side = (p) => ({
    m: field[p].m.map((c) => c ? c.code : null),
    s: field[p].s.map((c) => c ? c.code : null),
    f: field[p].f ? field[p].f.code : null,
    g: [...field[p].g],
  });
  return { you: side(0), opp: side(1) };
}

function conn(ok){ $('dot').classList.toggle('on', ok); $('conn').textContent = ok?'conectado':'desconectado'; }
function warn(m){ $('warn').hidden=false; $('warn').textContent=m; }
// qualquer erro de JS agora aparece na barra vermelha (nunca mais trava em silêncio)
window.addEventListener('error', (e) => warn('ERRO JS: ' + e.message + ' @ linha ' + e.lineno));
window.addEventListener('unhandledrejection', (e) => warn('ERRO async: ' + ((e.reason && e.reason.message) || e.reason)));

// ---------- salvar jogada (memória p/ NPC) ----------
// Snapshot do momento: turno, sua mão, a mão/campo do oponente, o campo, e a
// sequência de ações que você fez neste turno. É a matéria-prima do "treinar NPC".
function savePlays() {
  if (!turnPlays.length) return log('nenhuma jogada neste turno pra salvar.');
  const snap = {
    at: new Date().toISOString(),
    deck: deckName,
    turn: turnNo,
    phase,
    myHand: hand[0].map((c) => ({ code: c, name: nameOf(c) })),
    oppHandCount: hand[1],
    field: snapshotField(),
    plays: turnPlays,
  };
  let all = [];
  try { all = JSON.parse(localStorage.getItem('ygo:plays') || '[]'); } catch {}
  all.push(snap);
  localStorage.setItem('ygo:plays', JSON.stringify(all));
  log(`✔ jogada do turno ${turnNo} salva (${turnPlays.length} ações, ${snap.myHand.length} na mão). Total: ${all.length}.`, true);
}

/**
 * Recompensa do modo Adversário: só se for adversário (tem `advNpc`), se venceu,
 * e uma vez por duelo. Dá +100 DP e a carta-assinatura do NPC na Coleção.
 */
function concederRecompensa(venci) {
  if (!advNpc || !venci || rewardGiven) return null;
  rewardGiven = true;
  if (advReward > 0) addDP(advReward);
  if (advSignature) addCards([advSignature]);
  return { dp: advReward, cardId: advSignature };
}

/** Popup de fim de duelo: quem venceu + recompensa + botão para voltar à home. */
function mostrarFimDuelo(venci, empate, premio) {
  const box = document.querySelector('#end-overlay .end-box');
  box.classList.toggle('lose', !venci && !empate);
  $('end-emoji').textContent = empate ? '🤝' : venci ? '🏆' : '💀';
  $('end-title').textContent = empate ? 'Duelo empatado' : venci ? 'Você venceu!' : 'Você perdeu';
  let sub = `LP — você ${Math.max(0, lp[0])} · oponente ${Math.max(0, lp[1])}`;
  if (premio) {
    const carta = premio.cardId ? (nameOf(premio.cardId)) : null;
    sub += `<br><b style="color:var(--gold)">+${premio.dp} DP</b>`
         + (carta ? ` e <b style="color:var(--gold)">${carta}</b> na Coleção!` : '');
  }
  $('end-sub').innerHTML = sub;
  $('end-overlay').hidden = false;
}
function fecharFimDuelo() { $('end-overlay').hidden = true; }

$('btn-start').onclick = start;
$('btn-end').onclick = () => act('endturn', 0, 'encerrar turno');
$('btn-save').onclick = savePlays;
$('btn-home').onclick = () => (location.href = '/web/index.html');
$('chain-pass').onclick = () => { $('chain-overlay').hidden = true; act('chain', -1, 'não ativar'); };
$('yn-yes').onclick = () => { $('yn-overlay').hidden = true; act('yesno', 1, 'sim'); };
$('yn-no').onclick = () => { $('yn-overlay').hidden = true; act('yesno', 0, 'não'); };
$('end-home').onclick = () => (location.href = '/web/index.html');
$('end-again').onclick = () => { fecharFimDuelo(); start(); };
$('deck-sel').onchange = start;                 // trocar de deck começa novo duelo
$('gv-close').onclick = () => $('gv-back').classList.remove('show');
$('gv-back').addEventListener('click', (e) => { if (e.target === $('gv-back')) $('gv-back').classList.remove('show'); });

await hydrateWallet();   // carteira do projeto antes de premiar vitórias
await hydrateCustomNpcs();
// Um adversário criado noutra máquina só existe no disco: refaz a busca agora
// que o hydrate sincronizou (a busca lá em cima rodou antes de qualquer await).
if (advId && !advNpc) advNpc = getNpc(advId);

// Modo Adversário: carrega o deck e a assinatura do NPC antes do 1º duelo.
if (advNpc) {
  const h1 = document.querySelector('.topbar h1');
  if (h1) h1.textContent = `▚ ADVERSÁRIO — vs ${advNpc.name}`;
  try {
    await loadNpcDecks();
    const active = getNpcActiveDeck(advId);
    advDeck = active?.deck?.main?.length ? active.deck.main : null;
    advExtra = active?.deck?.extra?.length ? active.deck.extra : null;
    advSignature = active?.signatureId ?? advNpc.signatureId;
    advReward = Number.isFinite(Number(active?.rewardDp)) ? Number(active.rewardDp) : WIN_REWARD;
  } catch { advSignature = advNpc.signatureId; }
}

populateDecks();
start();
</script>
