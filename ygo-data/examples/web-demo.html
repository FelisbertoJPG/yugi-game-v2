<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco local YGO — navegador de cartas</title>
<style>
  :root {
    --bg: #10131a; --panel: #1a1f2b; --panel2: #232937; --line: #39425a;
    --ink: #d8dee9; --dim: #8892a6; --accent: #f0c674; --accent2: #7aa6da;
    --mon: #c8933a; --spell: #2f9e8f; --trap: #a5588f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.5 "Courier New", ui-monospace, monospace;
    image-rendering: pixelated;
  }
  header {
    padding: 10px 14px; background: var(--panel);
    border-bottom: 2px solid var(--line); display: flex; gap: 14px;
    align-items: baseline; flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 15px; letter-spacing: 1px; color: var(--accent); }
  .stat { color: var(--dim); font-size: 11px; }
  .layout { display: flex; align-items: flex-start; gap: 12px; padding: 12px; }
  aside {
    width: 210px; flex: none; background: var(--panel); padding: 10px;
    border: 2px solid var(--line); position: sticky; top: 12px;
  }
  aside label { display: block; margin: 9px 0 3px; font-size: 11px; color: var(--dim); }
  input, select, button {
    width: 100%; background: var(--panel2); color: var(--ink);
    border: 1px solid var(--line); padding: 5px 6px; font: inherit;
  }
  button { cursor: pointer; margin-top: 10px; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  main { flex: 1; min-width: 0; }
  .grid {
    display: grid; gap: 6px;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); padding: 7px;
    cursor: pointer; display: flex; gap: 7px; align-items: flex-start;
  }
  .card:hover { border-color: var(--accent); background: var(--panel2); }
  .card img { width: 38px; height: 55px; flex: none; background: var(--panel2); }
  .card b { display: block; font-size: 11px; font-weight: normal; color: var(--ink); }
  .card .meta { font-size: 10px; color: var(--dim); margin-top: 2px; }
  .tag { display: inline-block; padding: 0 3px; font-size: 9px; border: 1px solid; }
  .t-M { color: var(--mon); border-color: var(--mon); }
  .t-S { color: var(--spell); border-color: var(--spell); }
  .t-T { color: var(--trap); border-color: var(--trap); }
  .bar { display: flex; justify-content: space-between; align-items: center;
         margin-bottom: 8px; color: var(--dim); font-size: 11px; }
  dialog {
    background: var(--panel); color: var(--ink); border: 2px solid var(--accent);
    max-width: 560px; width: 92%; padding: 0;
  }
  dialog::backdrop { background: #000a; }
  .dlg-body { display: flex; gap: 14px; padding: 14px; }
  .dlg-body img { width: 160px; flex: none; align-self: flex-start; }
  .dlg h2 { margin: 0 0 4px; font-size: 15px; color: var(--accent); }
  .dlg .sub { color: var(--accent2); font-size: 11px; margin-bottom: 8px; }
  .dlg .desc { font-size: 11px; white-space: pre-wrap; border-top: 1px solid var(--line);
               padding-top: 8px; margin-top: 8px; max-height: 190px; overflow: auto; }
  .dlg dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px;
            margin: 0; font-size: 11px; }
  .dlg dt { color: var(--dim); }
  .dlg dd { margin: 0; }
  .close { padding: 6px 14px; background: var(--panel2); border-top: 1px solid var(--line); }
  .close button { width: auto; float: right; margin: 0; padding: 3px 12px; }
  .empty { color: var(--dim); padding: 30px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>▚ BANCO LOCAL YGO</h1>
  <span class="stat" id="stat">carregando…</span>
</header>

<div class="layout">
  <aside>
    <label>nome</label>
    <input id="q" placeholder="blue-eyes…" autocomplete="off">
    <label>tipo</label>
    <select id="cardType">
      <option value="">(todos)</option><option>Monster</option>
      <option>Spell</option><option>Trap</option>
    </select>
    <label>atributo</label>
    <select id="attribute"><option value="">(todos)</option></select>
    <label>tipo/raça</label>
    <select id="race"><option value="">(todos)</option></select>
    <label>arquétipo</label>
    <select id="archetype"><option value="">(todos)</option></select>
    <label>nível mín / máx</label>
    <div style="display:flex;gap:5px">
      <input id="levelMin" type="number" min="0" max="12" placeholder="0">
      <input id="levelMax" type="number" min="0" max="12" placeholder="12">
    </div>
    <label>ATK mínimo</label>
    <input id="atkMin" type="number" min="0" placeholder="0">
    <button id="clear">limpar filtros</button>
    <button id="rand">sortear 12 (pool de NPC)</button>
  </aside>

  <main>
    <div class="bar"><span id="count"></span><span>clique numa carta para ver os detalhes</span></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>nenhuma carta encontrada</div>
  </main>
</div>

<dialog id="dlg"><div class="dlg">
  <div class="dlg-body">
    <img id="d-img" alt="">
    <div style="min-width:0">
      <h2 id="d-name"></h2>
      <div class="sub" id="d-type"></div>
      <dl id="d-stats"></dl>
      <div class="desc" id="d-desc"></div>
    </div>
  </div>
  <div class="close"><button onclick="dlg.close()">fechar</button></div>
</div></dialog>

<script type="module">
import { YgoDB } from '../src/ygodb.js';

// Carrega só o índice (~2 MB). O cards.json completo (~14 MB) entra sob
// demanda, na primeira vez que uma carta é aberta.
const db = await YgoDB.load('../data', { full: false });
let fullDb = null;

const $ = (id) => document.getElementById(id);
const MAX_RENDER = 300;

$('stat').textContent =
  `${db.size.toLocaleString('pt-BR')} cartas · ${db.meta.counts.withScript.toLocaleString('pt-BR')} com script lua · gerado ${db.meta.generatedAt.slice(0, 10)}`;

// --- popula os selects a partir dos dados reais ---------------------------
const all = db.filter({});
const uniq = (fn) => [...new Set(all.map(fn).filter(Boolean))].sort();
for (const [sel, vals] of [
  ['attribute', uniq((c) => c.at)],
  ['race', uniq((c) => c.r)],
  ['archetype', uniq((c) => c.a[0]).slice(0, 600)],
]) {
  $(sel).append(...vals.map((v) => new Option(v, v)));
}

// --- render ---------------------------------------------------------------
function render(list) {
  $('count').textContent = list.length > MAX_RENDER
    ? `${list.length} resultados (mostrando ${MAX_RENDER})`
    : `${list.length} resultado${list.length === 1 ? '' : 's'}`;
  $('empty').hidden = list.length > 0;

  const frag = document.createDocumentFragment();
  for (const c of list.slice(0, MAX_RENDER)) {
    const el = document.createElement('div');
    el.className = 'card';
    el.tabIndex = 0;
    const stats = c.t === 'M'
      ? `${c.at ?? '?'} · nv ${c.lv ?? '?'} · ${c.atk ?? '?'}/${c.def ?? '—'}`
      : c.tl;
    el.innerHTML = `
      <img loading="lazy" src="${YgoDB.artUrl(c.id, { small: true })}" alt="">
      <div style="min-width:0">
        <b>${esc(c.name)}</b>
        <div class="meta"><span class="tag t-${c.t}">${c.t}</span> ${esc(stats)}</div>
      </div>`;
    el.onclick = () => open(c.id);
    el.onkeydown = (e) => e.key === 'Enter' && open(c.id);
    frag.append(el);
  }
  $('grid').replaceChildren(frag);
}

const esc = (s) => String(s ?? '').replace(/[<>&]/g,
  (m) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[m]));

// --- detalhe --------------------------------------------------------------
async function open(id) {
  if (!fullDb) {
    $('d-name').textContent = 'carregando cards.json…';
    $('dlg').showModal();
    fullDb = await YgoDB.load('../data', { full: true });
  }
  const c = fullDb.get(id);
  if (!c) return;

  $('d-img').src = YgoDB.artUrl(c.id);
  $('d-name').textContent = c.name;
  $('d-type').textContent = c.typeLabel;
  $('d-desc').textContent = c.desc;

  const rows = [['id', c.id]];
  if (c.cardType === 'Monster') {
    rows.push(
      ['atributo', c.attribute], ['tipo', c.race],
      [c.levelLabel.toLowerCase(), c.level],
      ['ATK / DEF', `${c.atkLabel} / ${c.defLabel ?? '—'}`]);
    if (c.scales) rows.push(['escalas', `${c.scales.left} / ${c.scales.right}`]);
    if (c.linkArrows) rows.push(['markers', c.linkArrows.join(' ')]);
  }
  if (c.archetypes.length) {
    rows.push(['arquétipos', c.archetypes.map((a) => a.name || a.hex).join(', ')]);
  }
  rows.push(['legal em', c.legal.join(' / ') || '—']);
  rows.push(['script lua', c.hasScript ? c.script : '(vanilla, sem script)']);

  $('d-stats').replaceChildren(...rows.flatMap(([k, v]) => {
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v ?? '—';
    return [dt, dd];
  }));
  if (!$('dlg').open) $('dlg').showModal();
}
window.dlg = $('dlg');

// --- filtros --------------------------------------------------------------
const num = (id) => ($(id).value === '' ? null : Number($(id).value));
function apply() {
  render(db.filter({
    name: $('q').value || undefined,
    cardType: $('cardType').value || undefined,
    attribute: $('attribute').value || undefined,
    race: $('race').value || undefined,
    archetype: $('archetype').value || undefined,
    levelMin: num('levelMin'), levelMax: num('levelMax'), atkMin: num('atkMin'),
  }));
}

for (const id of ['q', 'cardType', 'attribute', 'race', 'archetype',
                  'levelMin', 'levelMax', 'atkMin']) {
  $(id).addEventListener('input', apply);
}
$('clear').onclick = () => {
  for (const id of ['q', 'cardType', 'attribute', 'race', 'archetype',
                    'levelMin', 'levelMax', 'atkMin']) $(id).value = '';
  apply();
};
$('rand').onclick = () => render(db.random(12, {
  cardType: $('cardType').value || undefined,
}));

apply();
</script>
</body>
</html>
